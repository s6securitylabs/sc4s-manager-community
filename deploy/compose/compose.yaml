# SC4S Manager Docker-first release compose template.
# Install as /opt/sc4s/compose.yaml. Immutable frontend assets and built-in packs
# stay in the Manager image; only mutable state paths are bind-mounted.
# This deployment never mounts /var/run/docker.sock. A separately installed,
# narrow host control socket may be mounted explicitly when available.
services:
  sc4s:
    image: ${SC4S_IMAGE:-ghcr.io/splunk/splunk-connect-for-syslog/container3:3.46.0}
    container_name: SC4S
    restart: unless-stopped
    env_file:
      # Keep the conventional SC4S host path. Install staging makes this a
      # symlink to env/env_file so Manager can safely use atomic replacement on
      # the mounted containing directory without receiving broader /opt/sc4s access.
      - /opt/sc4s/env_file
    ports:
      - target: 514
        published: ${SC4S_SOURCE_LISTEN_TCP_PORT:-514}
        protocol: tcp
      - target: 514
        published: ${SC4S_SOURCE_LISTEN_UDP_PORT:-514}
        protocol: udp
      - target: 601
        published: ${SC4S_SOURCE_LISTEN_RFC6587_PORT:-601}
        protocol: tcp
      - target: 6514
        published: ${SC4S_SOURCE_LISTEN_TLS_PORT:-6514}
        protocol: tcp
      - target: 8080
        published: ${SC4S_LISTEN_STATUS_PORT:-8080}
        protocol: tcp
    volumes:
      - /opt/sc4s/local:/etc/syslog-ng/conf.d/local:z
      - splunk-sc4s-var:/var/lib/syslog-ng
      - /opt/sc4s/archive:/var/lib/syslog-ng/archive:z
      - /opt/sc4s/tls:/etc/syslog-ng/tls:ro,z

  manager:
    image: ghcr.io/s6securitylabs/sc4s-manager:${SC4S_MANAGER_VERSION:-3.46.0-beta}
    container_name: sc4s-manager
    restart: unless-stopped
    depends_on:
      - sc4s
    env_file:
      - /opt/sc4s/manager.env
    environment:
      SC4S_ROOT: /opt/sc4s
      SC4S_ENV_FILE: /opt/sc4s-manager-env/env_file
      SC4S_MANAGER_ROOT: /opt/sc4s-manager
      SC4S_CONTROL_SOCKET: /run/sc4s-manager/control.sock
      SC4S_HEALTH_URL: http://sc4s:8080/health
    ports:
      - target: 8090
        published: ${SC4S_MANAGER_PORT:-8090}
        host_ip: ${SC4S_MANAGER_BIND_ADDRESS:-127.0.0.1}
        protocol: tcp
    volumes:
      - /opt/sc4s/local:/opt/sc4s/local:z
      - /opt/sc4s/tls:/opt/sc4s/tls:z
      # Mount the containing directory so Manager's atomic temp+rename update is
      # safe; a single-file bind mount cannot be atomically replaced.
      - /opt/sc4s/env:/opt/sc4s-manager-env:z
      - /opt/sc4s/manager/state:/opt/sc4s-manager/state:z
      - /opt/sc4s/manager/backups:/opt/sc4s-manager/backups:z
      - /opt/sc4s/manager/templates:/opt/sc4s-manager/templates:z
      - sc4s-manager-run:/run/sc4s-manager
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data=json.loads(urllib.request.urlopen('http://127.0.0.1:8090/ready', timeout=3).read().decode()); raise SystemExit(0 if data.get('status') == 'ready' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  splunk-sc4s-var:
  sc4s-manager-run:
