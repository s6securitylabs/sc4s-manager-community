[cisco:ios]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = none
TIME_PREFIX = ^[*.]?
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 32
EXTRACT-cisco_ios_header = (?<timesync_marker>^[*.])?(?:[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}\s+)?(?:%|\s*%)(?<cisco_identifier>[A-Z0-9_]+)-(?<cisco_severity>[0-7])-(?<cisco_mnemonic>[A-Z0-9_]+):\s*(?<cisco_message>.*)$
EXTRACT-cisco_ios_config_user = (?i)\bConfigured from\s+(?<config_source>\S+)\s+by\s+(?<user>[A-Za-z0-9_.@-]+)\s+on\s+(?<terminal>\S+)
EXTRACT-cisco_ios_interface = (?i)\bInterface\s+(?<interface>[A-Za-z0-9_./:-]+),\s+changed\s+state\s+to\s+(?<interface_state>\w+)
EXTRACT-cisco_ios_lineproto = (?i)\bLine protocol on Interface\s+(?<interface>[A-Za-z0-9_./:-]+),\s+changed\s+state\s+to\s+(?<line_protocol_state>\w+)
EXTRACT-cisco_ios_login = (?i)\bLogin\s+(?<login_result>Success|failed)\s+\[user:\s*(?<user>[^\]]+)\]\s+\[Source:\s*(?<src_ip>\d{1,3}(?:\.\d{1,3}){3})\]\s+\[localport:\s*(?<dest_port>\d+)\]
EXTRACT-cisco_ios_login_reason = (?i)\[Reason:\s*(?<login_reason>[^\]]+)\]
EVAL-vendor = "Cisco"
EVAL-product = "IOS"
EVAL-vendor_product = "cisco:ios"
EVAL-signature = cisco_identifier . "-" . cisco_mnemonic
EVAL-signature_id = cisco_identifier . "-" . cisco_mnemonic
EVAL-severity = cisco_severity
EVAL-severity_label = case(cisco_severity=="0", "emergency", cisco_severity=="1", "alert", cisco_severity=="2", "critical", cisco_severity=="3", "error", cisco_severity=="4", "warning", cisco_severity=="5", "notice", cisco_severity=="6", "informational", cisco_severity=="7", "debug", true(), null())
EVAL-action = case(cisco_mnemonic=="CONFIG_I", "modified", cisco_mnemonic=="LOGIN_SUCCESS", "success", cisco_mnemonic=="LOGIN_FAILED", "failure", match(cisco_message, "(?i)changed state to up"), "up", match(cisco_message, "(?i)changed state to down"), "down", true(), null())
EVAL-src = src_ip
