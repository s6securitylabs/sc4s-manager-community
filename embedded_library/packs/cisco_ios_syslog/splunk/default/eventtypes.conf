[sc4s_cisco_ios]
search = sourcetype="cisco:ios" vendor="Cisco" product="IOS"

[sc4s_cisco_ios_config_changes]
search = sourcetype="cisco:ios" cisco_identifier="SYS" cisco_mnemonic="CONFIG_I"

[sc4s_cisco_ios_interface_state]
search = sourcetype="cisco:ios" cisco_identifier IN (LINK,LINEPROTO) interface=* (interface_state=* OR line_protocol_state=*)

[sc4s_cisco_ios_login]
search = sourcetype="cisco:ios" cisco_identifier="SEC_LOGIN" cisco_mnemonic IN (LOGIN_SUCCESS,LOGIN_FAILED)

[sc4s_cisco_ios_login_success]
search = sourcetype="cisco:ios" cisco_identifier="SEC_LOGIN" cisco_mnemonic="LOGIN_SUCCESS" login_result="Success"

[sc4s_cisco_ios_login_failure]
search = sourcetype="cisco:ios" cisco_identifier="SEC_LOGIN" cisco_mnemonic="LOGIN_FAILED" login_result="failed"

[sc4s_cisco_ios_platform]
search = sourcetype="cisco:ios" cisco_identifier="PLATFORM"
