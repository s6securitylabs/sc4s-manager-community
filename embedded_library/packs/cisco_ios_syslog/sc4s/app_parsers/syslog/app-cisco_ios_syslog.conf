# Cisco IOS / IOS-XE conservative SecHub Resources parser.
# Uses the upstream Cisco syslog token shape but scopes this curated profile to
# IOS/IOS-XE-style cisco:ios events. No reduction/drop behavior is enabled.
block parser app-cisco_ios_syslog() {
    channel {
        rewrite {
            r_set_splunk_dest_default(
                index("netops")
                sourcetype("cisco:ios")
                vendor("cisco")
                product("ios")
            );
        };
        rewrite(r_set_source_identified);
    };
};

application app-cisco_ios_syslog[sc4s-raw-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_CISCO_IOS_SYSLOG")
            or tags("source.s_CISCO_IOS_SYSLOG")
            or program("^(IOS|IOSXE|CiscoIOS|CiscoIOSXE)$" type(pcre))
            or message("%[A-Z0-9_]+-[0-7]-[A-Z0-9_]+:" type(pcre))
        );
    };
    parser { app-cisco_ios_syslog(); };
};

application app-cisco_ios_syslog[sc4s-network-source] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_CISCO_IOS_SYSLOG")
            or tags("source.s_CISCO_IOS_SYSLOG")
            or program("^(IOS|IOSXE|CiscoIOS|CiscoIOSXE)$" type(pcre))
            or message("%[A-Z0-9_]+-[0-7]-[A-Z0-9_]+:" type(pcre))
        );
    };
    parser { app-cisco_ios_syslog(); };
};
