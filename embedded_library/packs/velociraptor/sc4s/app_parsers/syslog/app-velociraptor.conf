# Velociraptor JSON/JSONL relay routing.
# Conservative: only acts on the dedicated source tag / netsource identity and documented relay fields.
block parser app-velociraptor_monitoring() { channel { rewrite { r_set_splunk_dest_default(index('oswinsec') sourcetype('velociraptor:monitoring:json') vendor('velocidex') product('velociraptor') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('endpoint')); }; }; };
block parser app-velociraptor_hunt() { channel { rewrite { r_set_splunk_dest_default(index('oswinsec') sourcetype('velociraptor:hunt:json') vendor('velocidex') product('velociraptor') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('audit')); }; }; };
block parser app-velociraptor_artifact_result() { channel { rewrite { r_set_splunk_dest_default(index('oswinsec') sourcetype('velociraptor:artifact:result:json') vendor('velocidex') product('velociraptor') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('endpoint')); }; }; };
application app-velociraptor_hunt[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_VELOCIRAPTOR") or "${.netsource.sc4s_vendor_product}" eq "velociraptor") and (message('"Artifact":"Server.Hunts.List"') or message('"Artifact":"System.Hunt.Creation"') or message('"Artifact":"Server.Internal.HuntModification"') or message('"hunt_id"') or message('"HuntId"')) and not message('"ArtifactRow"') }; parser { app-velociraptor_hunt(); }; };
application app-velociraptor_artifact_result[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_VELOCIRAPTOR") or "${.netsource.sc4s_vendor_product}" eq "velociraptor") and (message('"ArtifactRow"') or message('"FlowId"')) }; parser { app-velociraptor_artifact_result(); }; };
application app-velociraptor_monitoring[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_VELOCIRAPTOR") or "${.netsource.sc4s_vendor_product}" eq "velociraptor") and message('"Artifact"') }; parser { app-velociraptor_monitoring(); }; };
