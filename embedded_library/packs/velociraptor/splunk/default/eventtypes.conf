[velociraptor_monitoring_events]
search = sourcetype=velociraptor:monitoring:json vendor=Velocidex product=velociraptor Artifact=*

[velociraptor_hunt_activity]
search = sourcetype=velociraptor:hunt:json vendor=Velocidex product=velociraptor (hunt_id=* OR HuntId=*)

[velociraptor_artifact_results]
search = sourcetype=velociraptor:artifact:result:json vendor=Velocidex product=velociraptor Artifact=* (ArtifactRow=* OR FlowId=*)

[velociraptor_network_socket_results]
search = sourcetype=velociraptor:artifact:result:json vendor=Velocidex product=velociraptor Artifact="Windows.Network.Netstat" Pid=* Laddr.IP=* Raddr.IP=*

[velociraptor_service_inventory_results]
search = sourcetype=velociraptor:artifact:result:json vendor=Velocidex product=velociraptor Artifact="Windows.System.Services" Name=* State=*

[velociraptor_yara_process_results]
search = sourcetype=velociraptor:artifact:result:json vendor=Velocidex product=velociraptor Artifact="Windows.Detection.Yara.Process" Rule=* ProcessName=*

[velociraptor_prefetch_execution_results]
search = sourcetype=velociraptor:artifact:result:json vendor=Velocidex product=velociraptor Artifact="Windows.Forensics.Prefetch" Executable=* RunCount=* PrefetchFileName=*
