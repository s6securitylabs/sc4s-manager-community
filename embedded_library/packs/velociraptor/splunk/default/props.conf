[velociraptor:monitoring:json]
SHOULD_LINEMERGE = false
KV_MODE = json
AUTO_KV_JSON = true
TRUNCATE = 300000
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
MAX_TIMESTAMP_LOOKAHEAD = 30
EVAL-vendor = "Velocidex"
EVAL-product = "velociraptor"
EVAL-vendor_product = "velocidex:velociraptor"
FIELDALIAS-velociraptor_identity = Artifact AS artifact, Hostname AS dest, Hostname AS host, ClientId AS client_id
FIELDALIAS-velociraptor_hunt = HuntId AS hunt_id, FlowId AS flow_id, Created AS created, state AS result
FIELDALIAS-velociraptor_user = User AS user, Creator AS user
EVAL-signature = coalesce(artifact, Artifact)
EVAL-signature_id = coalesce(hunt_id, HuntId, flow_id, FlowId, ClientId)
EVAL-action = case(coalesce(artifact, Artifact)=="Windows.Network.Netstat", "network_socket", coalesce(artifact, Artifact)=="Windows.System.Services", "service_inventory", coalesce(artifact, Artifact)=="Windows.Detection.Yara.Process", "yara_detection", coalesce(artifact, Artifact)=="Windows.Forensics.Prefetch", "prefetch_execution", match(coalesce(artifact, Artifact), "Hunt"), "hunt_activity", sourcetype=="velociraptor:artifact:result:json", "artifact_result", true(), "monitoring_event")

