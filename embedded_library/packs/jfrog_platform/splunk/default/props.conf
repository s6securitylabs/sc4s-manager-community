[jfrog:artifactory:request]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = none
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 24
EXTRACT-jfrog_artifactory_request = ^(?<timestamp>[^|]+)\|(?<trace_id>[^|]+)\|(?<src_ip>[^|]+)\|(?<user>[^|]+)\|(?<http_method>[^|]+)\|(?<url>[^|]+)\|(?<status>[^|]+)\|(?<response_size>[^|]+)\|(?<request_size>[^|]+)\|(?<duration_ms>[^|]+)\|(?<user_agent>.*?)(?:\s+(?<marker>SC4S_JFROG_PLATFORM_TEST_[A-Z_0-9]+))?$
EVAL-vendor = "jfrog"
EVAL-product = "platform"
EVAL-vendor_product = "jfrog:platform"
EVAL-jfrog_component = "artifactory"
EVAL-jfrog_log_family = "artifactory_request"
EVAL-action = http_method
EVAL-signature = url
EVAL-signature_id = trace_id
EVAL-src = src_ip
EVAL-http_status = status

[jfrog:artifactory:access]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = auto
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 24
EXTRACT-jfrog_artifactory_access = ^(?<timestamp>\S+)\s+\[(?<trace_id>[^\]]+)\]\s+\[(?<action_response>[^\]]+)\]\s+(?<repo_path>.+?)\s+for client\s+:\s+(?<user>[^/]+)/(?<src_ip>\d{1,3}(?:\.\d{1,3}){3})\.?(?:\s+marker=(?<marker>SC4S_JFROG_PLATFORM_TEST_[A-Z_0-9]+))?$
EVAL-vendor = "jfrog"
EVAL-product = "platform"
EVAL-vendor_product = "jfrog:platform"
EVAL-jfrog_component = "artifactory"
EVAL-jfrog_log_family = "artifactory_access"
EVAL-vendor_raw_action = action_response
EVAL-action = action_response
EVAL-signature = repo_path
EVAL-signature_id = trace_id
EVAL-src = src_ip

[jfrog:access:security_audit]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = none
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 24
EXTRACT-jfrog_access_security_audit = ^(?<timestamp>[^|]+)\|(?<token_id>[^|]+)\|(?<src_ip>[^|]+)\|(?<user>[^|]+)\|(?<logged_principal>[^|]+)\|(?<entity_name>[^|]+)\|(?<event_type>[^|]+)\|(?<event>[^|]+)\|(?<data_changed>.*)$
EXTRACT-jfrog_access_security_audit_marker = (?:;|\s)marker=(?<marker>SC4S_JFROG_PLATFORM_TEST_[A-Z_0-9]+)
EVAL-vendor = "jfrog"
EVAL-product = "platform"
EVAL-vendor_product = "jfrog:platform"
