EVAL-jfrog_log_family = "access_security_audit"
EVAL-vendor_raw_action = event
EVAL-action = event
EVAL-signature = entity_name
EVAL-signature_id = token_id
EVAL-src = src_ip

[jfrog:router:request]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 24
EVAL-vendor = "jfrog"
EVAL-product = "platform"
EVAL-vendor_product = "jfrog:platform"
EVAL-jfrog_component = "router"
EVAL-jfrog_log_family = "router_request"
EVAL-action = request_method
EVAL-signature = request_url
EVAL-signature_id = trace_id
EVAL-src = remote_addr
EVAL-src_ip = remote_addr
EVAL-url = request_url
EVAL-http_status = status
FIELDALIAS-jfrog_router_marker = marker AS marker

