# Conservative JFrog Platform parser for SecHub Resources.
# Dedicated listener/source tag is required because JFrog log families use
# several wire shapes (pipe-delimited request/access/security-audit, service text, and JSON).
#
# 2026-06-12 fix: removed test-marker-only routing from if/elif filter conditions.
# 2026-06-18 hardening: add evidence-gated Xray request/service/webhook routes before
# generic Artifactory request/router matching so Xray-specific source shapes do not collapse
# into Artifactory sourcetypes.
# 2026-06-22 hardening: add narrowly evidenced Distribution request/access routes for
# distribution-request.log and distribution-access.log shaped by JFrog-maintained parsers.

block parser app-jfrog_platform() {
    channel {
        if {
            filter {
                match('^\{.*"schema_version"\s*:\s*"1\.1".*"alert_id"\s*:' value('MESSAGE'))
                and match('"issues"\s*:' value('MESSAGE'));
            };
            rewrite {
                r_set_splunk_dest_default(
                    index("main")
                    sourcetype("jfrog:xray:webhook")
                    vendor("jfrog")
                    product("platform")
                );
            };
        } elif {
            filter {
                match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+ \[jfx[a-z]+\] \[[A-Z]+\] \[[^\]]+\] \[[^\]]+\] \[[^\]]+\] - ' value('MESSAGE'));
            };
            rewrite {
                r_set_splunk_dest_default(
                    index("main")
                    sourcetype("jfrog:xray:service")
                    vendor("jfrog")
                    product("platform")
                );
            };
        } elif {
            filter {
                match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^|]+\|[^|]+\|[^|]+\|[^|]+\|(?:GET|POST|PUT|DELETE|PATCH|HEAD)\|/xray/' value('MESSAGE'));
            };
            rewrite {
                r_set_splunk_dest_default(
                    index("main")
                    sourcetype("jfrog:xray:request")
                    vendor("jfrog")
                    product("platform")
                );
            };
        } elif {
            filter {
                match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^|]+\|[^|]+\|[^|]+\|[^|]+\|(?:GET|POST|PUT|DELETE|PATCH|HEAD)\|/distribution/' value('MESSAGE'));
            };
            rewrite {
                r_set_splunk_dest_default(
                    index("main")
                    sourcetype("jfrog:distribution:request")
                    vendor("jfrog")
                    product("platform")
                );
            };
        } elif {
            filter {
                match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+ \[[^\]]+\] \[[^\]]+\] (?:dist-|distribution|release-bundles)' value('MESSAGE'))
                and match(' for client : ' value('MESSAGE'));
            };
            rewrite {
                r_set_splunk_dest_default(
                    index("main")
                    sourcetype("jfrog:distribution:access")
                    vendor("jfrog")
                    product("platform")
                );
            };
        } elif {
            filter {
                match('^\{.*"time"\s*:\s*"[0-9]{4}-[0-9]{2}-[0-9]{2}T.*".*"request_method"\s*:' value('MESSAGE'));
            };
            rewrite {
                r_set_splunk_dest_default(
                    index("main")
                    sourcetype("jfrog:router:request")
                    vendor("jfrog")
                    product("platform")
                );
            };
        } elif {
            filter {
                match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^|]+\|[^|]+\|[^|]+\|[^|]+\|(?:GET|POST|PUT|DELETE|PATCH|HEAD)\|[^|]+\|[0-9]{3}\|' value('MESSAGE'));
            };
            rewrite {
                r_set_splunk_dest_default(
                    index("main")
                    sourcetype("jfrog:artifactory:request")
                    vendor("jfrog")
                    product("platform")
                );
            };
        } elif {
            filter {
                match('^[0-9]{14}\|[^|]+\|[^|]+\|(?:UPLOAD|DOWNLOAD|DELETE|CACHE|REMOTE_DOWNLOAD)\|[^|]+\|[^|]+\|[0-9]+\|?' value('MESSAGE'));
            };
            rewrite {
                r_set_splunk_dest_default(
                    index("main")
                    sourcetype("jfrog:artifactory:traffic")
                    vendor("jfrog")
                    product("platform")
                );
            };
        } elif {
            filter {
                match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+ \[[^\]]+\] \[[^\]]+\].* for client : ' value('MESSAGE'));
            };
            rewrite {
                r_set_splunk_dest_default(
                    index("main")
                    sourcetype("jfrog:artifactory:access")
                    vendor("jfrog")
                    product("platform")
                );
            };
        } elif {
            filter {
                match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^|]+\|[^|]+\|[^|]+\|[^|]+\|[^|]+\|[^|]+\|[^|]+\|[^|]+\|' value('MESSAGE'))
                and not match('^[0-9]{4}-[0-9]{2}-[0-9]{2}T[^|]+\|[^|]+\|[^|]+\|[^|]+\|(?:GET|POST|PUT|DELETE|PATCH|HEAD)\|' value('MESSAGE'));
            };
            rewrite {
                r_set_splunk_dest_default(
                    index("main")
                    sourcetype("jfrog:access:security_audit")
                    vendor("jfrog")
                    product("platform")
                );
            };
        };
        rewrite(r_set_source_identified);
    };
};

application app-jfrog_platform[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_JFROG_PLATFORM")
            or "${.netsource.sc4s_vendor_product}" eq "jfrog_platform"
        );
    };
    parser { app-jfrog_platform(); };
};
