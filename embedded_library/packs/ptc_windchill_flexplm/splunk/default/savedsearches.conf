[PTC Windchill GW READY OK Probe]
description = Conservative translation of Splunk detection 2f37ab99-5eae-44c4-a6bc-15b6d9787a3d for public replay-corpus-backed Windchill MethodServer log4j telemetry.
search = `windchill_log4j` ("GW_READY_OK" OR "run?c=echo%20GW_READY_OK" OR "c=echo%20GW_READY_OK") | rex field=_raw "^(?:[^:\r\n]+:)?(?<log_ts>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3})\s+(?<log_level>\w+)\s+\[(?<thread>[^\]]+)\]\s+(?<logger>\S+)\s+-\s+(?<payload>.*)$" | search logger IN ("wt.servlet.ServletRequestMonitor.request", "wt.method.MethodContextMonitor.contexts.servletRequest") | rex field=payload "^(?<event_ts>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d{3})\s+(?<event_tz>[+\-]\d{4}),\s+(?<rest>.*)$" | eval parts=split(rest, ", ") | eval event_type=case(logger="wt.servlet.ServletRequestMonitor.request","servlet_request", logger="wt.method.MethodContextMonitor.contexts.servletRequest","method_context_servlet_request", true(),"other") | eval src_ip=case(event_type="servlet_request",mvindex(parts,2), event_type="method_context_servlet_request",mvindex(parts,5)) | eval uri_path=case(event_type="servlet_request",mvindex(parts,3), event_type="method_context_servlet_request",mvindex(parts,8)) | eval query_string=if(event_type="servlet_request",mvindex(parts,4),null()) | eval http_method=if(event_type="servlet_request",mvindex(parts,5),null()) | eval status=if(event_type="servlet_request",tonumber(mvindex(parts,6)),null()) | rex field=uri_path "^(?<uri_only>[^\?]+)(?:\?(?<uri_query>.*))?$" | eval query_string=if(query_string="-",null(),query_string) | eval query_string=coalesce(query_string,uri_query) | rex field=query_string "(?i)(?:^|&)(?<query_param>[cp])=(?<query_value>[^&]*)" | eval query_param=lower(query_param), query_value=urldecode(replace(query_value,"\+","%20")) | where query_param="c" AND match(query_value,"(?i)^echo(\s|20)+GW_READY_OK$") | eval src=src_ip, activity="gw_ready_ok_probe" | stats count min(_time) as firstTime max(_time) as lastTime values(log_level) as log_level values(logger) as logger values(http_method) as http_method values(status) as status values(uri_only) as uri_path values(query_string) as query_string by src activity query_param query_value | `ptc_windchill_gw_ready_ok_probe_filter`
disabled = 1
cron_schedule = */15 * * * *

[PTC Windchill Gateway Command Execution]
description = Conservative translation of Splunk detection d725b390-fe86-47df-b9a1-57497915403e for public replay-corpus-backed Windchill MethodServer log4j telemetry.
search = `windchill_log4j` ("WindchillGW/GW/run" OR "WindchillAuthGW/GW/run" OR "/GW/run?" OR "run?c=" OR "run?p=" OR ".jsp?c=" OR ".jsp?p=" OR "dpr_") | rex field=_raw "^(?:[^:\r\n]+:)?(?<log_ts>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3})\s+(?<log_level>\w+)\s+\[(?<thread>[^\]]+)\]\s+(?<logger>\S+)\s+-\s+(?<payload>.*)$" | search logger IN ("wt.servlet.ServletRequestMonitor.request", "wt.method.MethodContextMonitor.contexts.servletRequest") | rex field=payload "^(?<event_ts>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d{3})\s+(?<event_tz>[+\-]\d{4}),\s+(?<rest>.*)$" | eval parts=split(rest, ", ") | eval event_type=case(logger="wt.servlet.ServletRequestMonitor.request","servlet_request", logger="wt.method.MethodContextMonitor.contexts.servletRequest","method_context_servlet_request", true(),"other") | eval src_ip=case(event_type="servlet_request",mvindex(parts,2), event_type="method_context_servlet_request",mvindex(parts,5)) | eval uri_path=case(event_type="servlet_request",mvindex(parts,3), event_type="method_context_servlet_request",mvindex(parts,8)) | eval query_string=if(event_type="servlet_request",mvindex(parts,4),null()) | eval http_method=if(event_type="servlet_request",mvindex(parts,5),null()) | eval status=if(event_type="servlet_request",tonumber(mvindex(parts,6)),null()) | rex field=uri_path "^(?<uri_only>[^\?]+)(?:\?(?<uri_query>.*))?$" | eval query_string=if(query_string="-",null(),query_string) | eval query_string=coalesce(query_string,uri_query) | rex field=query_string "(?i)(?:^|&)(?<query_param>[cp])=(?<query_value>[^&]*)" | eval query_param=lower(query_param), query_value=urldecode(replace(query_value,"\+","%20")) | where isnotnull(uri_only) AND isnotnull(query_param) | where (match(uri_only,"(?i)(^|/)GW/run$") OR match(uri_only,"(?i)/servlet/(WindchillGW|WindchillAuthGW)/GW/run$") OR match(uri_only,"(?i)(^|/)dpr_[0-9a-f]{8}\.jsp$")) AND (query_param="c" OR query_param="p") | where NOT (query_param="c" AND match(query_value,"(?i)^echo(\s|20)+GW_READY_OK$")) | eval activity=case(query_param="c","command_execution_parameter",query_param="p","file_read_parameter",true(),"unknown") | eval src=src_ip | stats count min(_time) as firstTime max(_time) as lastTime values(log_level) as log_level values(logger) as logger values(http_method) as http_method values(status) as status values(uri_only) as uri_path values(query_string) as query_string by src activity query_param query_value | `ptc_windchill_gateway_command_execution_filter`
disabled = 1
cron_schedule = */15 * * * *
