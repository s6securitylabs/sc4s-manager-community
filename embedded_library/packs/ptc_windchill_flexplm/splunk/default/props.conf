[log4j]
SHOULD_LINEMERGE = false
TRUNCATE = 200000
KV_MODE = none
TIME_PREFIX = ^(?:[^:]+:)?
TIME_FORMAT = %Y-%m-%d %H:%M:%S,%3N
MAX_TIMESTAMP_LOOKAHEAD = 23
EXTRACT-windchill_outer = ^(?:[^:]+:)?(?<log_ts>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3})\s+(?<log_level>\w+)\s+\[(?<thread>[^\]]+)\]\s+(?<logger>\S+)\s+-\s+(?<payload>.*)$
EXTRACT-windchill_servlet_request = ^(?:[^:]+:)?\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3}\s+\w+\s+\[[^\]]+\]\s+wt\.servlet\.ServletRequestMonitor\.request\s+-\s+\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d{3}\s+(?<event_tz>[+\-]\d{4}),\s+(?<request_id>[^,]+),\s+(?<user_token>[^,]+),\s+(?<src_ip>\d+\.\d+\.\d+\.\d+),\s+(?<uri_path>[^,]+),\s+(?<query_string>[^,]+),\s+(?<http_method>[^,]+),\s+(?<status>\d+),\s+(?<duration_seconds>[^,]+),\s+(?<total_seconds>[^\r\n]+)$
EXTRACT-windchill_method_context = ^(?:[^:]+:)?\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2},\d{3}\s+\w+\s+\[[^\]]+\]\s+wt\.method\.MethodContextMonitor\.contexts\.servletRequest\s+-\s+\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d{3}\s+(?<event_tz>[+\-]\d{4}),\s+(?<request_id>[^,]+),\s+[^,]+,\s+[^,]+,\s+[^,]+,\s+[^,]+,\s+(?<src_ip>\d+\.\d+\.\d+\.\d+),\s+[^,]+,\s+[^,]+,\s+(?<uri_path>[^,]+),\s+(?<status>\d+),\s+[^,]+,\s+[^,]+,\s+[^,]+,\s+[^,]+,\s+(?<duration_seconds>[^,]+),\s+(?<total_seconds>[^\r\n]+)$
EXTRACT-windchill_query_fields = (?:\?|,\s)(?<query_param>[cp])=(?<query_value>[^,\s]+)
EVAL-query_string = coalesce(query_string, if(match(uri_path, "\\?"), replace(uri_path, "^[^?]*\\?", ""), null()))
EVAL-src = src_ip
EVAL-url = uri_path
EVAL-vendor = "ptc"
EVAL-product = "windchill_flexplm"
EVAL-vendor_product = "ptc:windchill_flexplm"
EVAL-signature = if(match(_raw, "GW_READY_OK"), "gw_ready_ok_probe", "gateway_command_execution")
EVAL-signature_id = coalesce(query_string, uri_path)
EVAL-activity = signature
