# Conservative Windchill / FlexPLM MethodServer log4j routing.
block parser app-ptc_windchill_flexplm() { channel { rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('log4j') vendor('ptc') product('windchill_flexplm') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('app')); }; }; };
application app-ptc_windchill_flexplm[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_PTC_WINDCHILL_FLEXPLM") or "${.netsource.sc4s_vendor_product}" eq "ptc_windchill_flexplm") and (message('wt\\.servlet\\.ServletRequestMonitor\\.request' type(pcre)) or message('wt\\.method\\.MethodContextMonitor\\.contexts\\.servletRequest' type(pcre))); }; parser { app-ptc_windchill_flexplm(); }; };
