[ontap:ems]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
TIME_PREFIX = ^.*?\s[A-Z][a-z][a-z]\s+
TIME_FORMAT = %b %d %Y %H:%M:%S %z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = auto
EVAL-vendor = "NetApp"
EVAL-product = "ONTAP"
EVAL-vendor_product = "netapp:ontap"
EXTRACT-ontap_ems_prefix = ^(?<ontap_node>[A-Za-z0-9_.-]+):\s+(?<ontap_event_id>[0-9a-f]+\.[0-9a-f]+)\s+(?<ontap_sequence>[0-9a-f]+)\s+(?<severity>[A-Z][A-Za-z]+)\s+
EVAL-signature_id = ontap_event_id
EVAL-signature = coalesce(event, message, ontap_event_id)
