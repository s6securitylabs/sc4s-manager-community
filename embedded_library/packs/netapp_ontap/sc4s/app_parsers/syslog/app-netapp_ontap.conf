# NetApp ONTAP dedicated-listener parser. Use host/source mapping or a unique
# listener because ONTAP messages are not globally distinctive.
block parser app-netapp_ontap() {
    channel {
        parser {
            regexp-parser(
                prefix(".tmp.netapp_ontap.")
                patterns('^[A-Za-z0-9\-\_\.]+: [0-9a-f]+\.[0-9a-f]+ [0-9a-f]+ [A-Z][A-Za-z]+ (?<timestamp>[A-Z][a-z][a-z] \d\d \d\d\d\d \d\d:\d\d:\d\d [+-]?\d{1,2}:\d\d)')
            );
            date-parser-nofilter(format('%b %d %Y %H:%M:%S %z') template("${.tmp.netapp_ontap.timestamp}"));
        };
        rewrite {
            r_set_splunk_dest_default(index('infraops') sourcetype('ontap:ems') vendor('netapp') product('ontap') template('t_hdr_msg'));
        };
        rewrite { r_set_splunk_dest_update_v2(class('ems')); };
    };
};
application app-netapp_ontap[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (tags(".source.s_NETAPP_ONTAP") or "${.netsource.sc4s_vendor_product}" eq "netapp_ontap")
    };
    parser { app-netapp_ontap(); };
};
