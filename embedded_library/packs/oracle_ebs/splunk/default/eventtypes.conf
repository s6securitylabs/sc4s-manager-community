[oracle_ebs_security_json_relay]
search = sourcetype="oracle:ebs:security:json" source_mode="ebs_security_json_relay"

[oracle_ebs_signon_failures]
search = sourcetype="oracle:ebs:security:json" event_family="ebs_signon_failure"

[oracle_ebs_privileged_changes]
search = sourcetype="oracle:ebs:security:json" (event_family="ebs_audittrail_sensitive_change" OR event_family="ebs_concurrent_privileged_request" OR event_family="ebs_workflow_mailer_change")

[oracle_ebs_admin_security_config]
search = sourcetype="oracle:ebs:security:json" source_mode="ebs_security_json_relay" (event_family="ebs_audittrail_sensitive_change" OR responsibility="System Administrator" OR application="System Administration")

[oracle_ebs_concurrent_failures]
search = sourcetype="oracle:ebs:security:json" source_mode="ebs_security_json_relay" event_family="ebs_concurrent_privileged_request" (status="error" OR request_status="Error" OR request_status="Warning")

[oracle_ebs_workflow_mailer_errors]
search = sourcetype="oracle:ebs:security:json" source_mode="ebs_security_json_relay" event_family="ebs_workflow_mailer_change" (status="error" OR action="notification_mailer_error" OR mailer_component="Workflow Notification Mailer")

[oracle_ebs_advisory_focus]
search = sourcetype="oracle:ebs:security:json" (cve="CVE-2026-46817" OR advisory_month="May 2026" OR event_family="ebs_oracle_payments_file_transmission" OR event_family="ebs_enterprise_command_center")

[oracle_ebs_application_tier_security]
search = sourcetype="oracle:ebs:security:json" (event_family="ebs_ohs_suspicious_http" OR event_family="ebs_weblogic_security" OR event_family="ebs_forms_oaf_error")
