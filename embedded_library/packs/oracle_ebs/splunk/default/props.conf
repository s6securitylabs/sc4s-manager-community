[oracle:ebs:security:json]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "event_time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = "oracle"
EVAL-product = "e_business_suite"
EVAL-vendor_product = "oracle:e_business_suite"
EVAL-user = coalesce(user, ebs_user)
EVAL-src = coalesce(src_ip, client_host)
EVAL-src_user = coalesce(user, ebs_user)
EVAL-app = coalesce(application, module)
EVAL-signature = coalesce(cve, error_code, component, module, event_family, event_type)
EVAL-signature_id = coalesce(sechub_fixture_marker, request_id, login_id, session_id, notification_id, primary_key)
EVAL-object = coalesce(object_name, table_name, form, function, request_uri, workflow_item_key, program, config_scope)
EVAL-object_type = case(isnotnull(table_name), "database_table", isnotnull(request_uri), "http_endpoint", isnotnull(form), "ebs_form", isnotnull(program), "concurrent_program", isnotnull(mailer_component), "workflow_mailer", true(), null())
EVAL-action = coalesce(action, event_type)
EVAL-vendor_raw_action = action
EVAL-status = coalesce(status, request_status, http_status)
EVAL-severity = coalesce(severity, if(status="failure" OR status="error", "high", null()))
EVAL-oracle_ebs_component = coalesce(component, module, application)
EVAL-oracle_ebs_family = event_family
EVAL-risk_bucket = case(severity="critical", "critical", severity="high", "high", status="failure" OR status="error" OR status="blocked", "attention", isnotnull(cve), "advisory_focus", true(), "informational")
EVAL-oracle_ebs_triage_area = case(event_family="ebs_signon_failure" OR action="authentication", "auth", event_family="ebs_audittrail_sensitive_change", "audit_admin_change", event_family="ebs_concurrent_privileged_request", "concurrent_request", event_family="ebs_workflow_mailer_change", "workflow_mailer", event_family="ebs_fnd_security_error", "fnd_security_error", event_family IN ("ebs_ohs_suspicious_http","ebs_weblogic_security","ebs_forms_oaf_error"), "app_tier", isnotnull(cve), "advisory_focus", true(), "other")
FIELDALIAS-oracle_ebs_marker = sechub_fixture_marker AS marker
