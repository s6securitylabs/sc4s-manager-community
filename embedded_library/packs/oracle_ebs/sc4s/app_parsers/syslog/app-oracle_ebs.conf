# Conservative Oracle E-Business Suite normalized JSON relay parser for SecHub Resources.
# Matches one JSON object per line emitted by a site-owned collector that normalizes EBS audit/table/log sources.
# This does not collect Oracle EBS, does not parse native DB rows or multiline app logs directly, and does not prove exploit detection.

block parser app_oracle_ebs() {
    channel {
        if {
            filter {
                match('"vendor"\s*:\s*"oracle"' value('MESSAGE'))
                and match('"product"\s*:\s*"e_business_suite"' value('MESSAGE'))
                and match('"source_mode"\s*:\s*"ebs_security_json_relay"' value('MESSAGE'))
                and match('"event_family"\s*:\s*"ebs_' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('oracle') product('ebs')) };
            rewrite { r_set_splunk_dest_default(index('main') sourcetype('oracle:ebs:security:json')) };
            rewrite { set('oracle_ebs', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
