# Conservative Netskope SASE / Security Cloud JSON relay parser for SecHub Resources.
# Matches one Netskope Data Export / log-streaming JSON event per line. SC4S does not poll Netskope APIs or own Cloud Exchange/Event Streaming Client state.

block parser app_netskope_sase() {
    channel {
        if {
            filter { match('"marker"\s*:\s*"SC4S_NETSKOPE_SASE_TEST_' value('MESSAGE')) or (match('"timestamp"\s*:' value('MESSAGE')) and match('"type"\s*:\s*"(page|application|alert|audit|network)"' value('MESSAGE'))) or (match('"x-transaction-id"\s*:' value('MESSAGE')) and match('"x-cs-timestamp"\s*:' value('MESSAGE'))); };
            parser { app-parser-template(vendor('netskope') product('security_cloud')) };
            if { filter { match('"type"\s*:\s*"page"' value('MESSAGE')); }; rewrite { r_set_splunk_dest_default(index('netproxy') sourcetype('netskope:events:page')) }; };
            elif { filter { match('"type"\s*:\s*"application"' value('MESSAGE')); }; rewrite { r_set_splunk_dest_default(index('netproxy') sourcetype('netskope:events:application')) }; };
            elif { filter { match('"type"\s*:\s*"alert"' value('MESSAGE')); }; rewrite { r_set_splunk_dest_default(index('netproxy') sourcetype('netskope:alerts')) }; };
            elif { filter { match('"type"\s*:\s*"audit"' value('MESSAGE')); }; rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('netskope:audit')) }; };
            elif { filter { match('"type"\s*:\s*"network"' value('MESSAGE')); }; rewrite { r_set_splunk_dest_default(index('netproxy') sourcetype('netskope:events:network')) }; };
            else { rewrite { r_set_splunk_dest_default(index('netproxy') sourcetype('netskope:transaction')) }; };
            rewrite { set('netskope_sase', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
