[netskope:transaction]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "x-cs-timestamp"\s*:\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 10
EVAL-vendor = "netskope"
EVAL-product = "security_cloud"
EVAL-vendor_product = "netskope:security_cloud"
EVAL-netskope_event_family = "transaction"
EVAL-event_id = tostring('x-transaction-id')
EVAL-signature = coalesce('x-policy-name', 'x-policy-action', 'cs-host')
EVAL-signature_id = event_id
EVAL-user = 'x-cs-user'
EVAL-src_user = 'x-cs-user'
EVAL-src = 'x-policy-src-ip'
EVAL-src_ip = 'x-policy-src-ip'
EVAL-dest = 'cs-host'
EVAL-url = coalesce('cs-uri', 'cs-host')
EVAL-action = 'x-policy-action'
EVAL-policy = 'x-policy-name'
FIELDALIAS-netskope_transaction_marker = marker AS marker
