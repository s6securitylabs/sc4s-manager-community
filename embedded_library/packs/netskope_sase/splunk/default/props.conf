[netskope:events:page]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "timestamp"\s*:\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 10
EVAL-vendor = "netskope"
EVAL-product = "security_cloud"
EVAL-vendor_product = "netskope:security_cloud"
EVAL-netskope_event_family = "page"
EVAL-event_id = coalesce(_id, tostring(transaction_id), tostring(request_id))
EVAL-signature = coalesce(policy, action, app, type)
EVAL-signature_id = event_id
EVAL-src = coalesce(srcip, userip)
EVAL-src_ip = coalesce(srcip, userip)
EVAL-dest = coalesce(dstip, site, app)
EVAL-dest_ip = dstip
EVAL-url = url
EVAL-bytes = numbytes
FIELDALIAS-netskope_page_marker = marker AS marker

