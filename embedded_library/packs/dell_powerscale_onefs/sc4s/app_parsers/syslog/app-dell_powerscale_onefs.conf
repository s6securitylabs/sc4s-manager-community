block parser app-dell_powerscale_onefs_protocol() {
    channel {
        parser { json-parser(prefix(".values.") template("${MESSAGE}")); };
        rewrite {
            r_set_splunk_dest_default(
                index("`SC4S_OPTION_DELL_POWERSCALE_ONEFS_INDEX`")
                sourcetype("dell:powerscale:onefs:protocol")
                vendor("dell")
                product("powerscale-onefs")
                source("dell_powerscale_onefs")
                template("t_json_values_msg")
            );
        };
    };
};

block parser app-dell_powerscale_onefs_config() {
    channel {
        parser { json-parser(prefix(".values.") template("${MESSAGE}")); };
        rewrite {
            r_set_splunk_dest_default(
                index("`SC4S_OPTION_DELL_POWERSCALE_ONEFS_INDEX`")
                sourcetype("dell:powerscale:onefs:config")
                vendor("dell")
                product("powerscale-onefs")
                source("dell_powerscale_onefs")
                template("t_json_values_msg")
            );
        };
    };
};

application app-netsource-dell_powerscale_onefs[sc4s-network-source] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_DELL_POWERSCALE_ONEFS")
            or tags("source.s_DELL_POWERSCALE_ONEFS")
            or "${SOURCE}" eq "s_DELL_POWERSCALE_ONEFS"
            or "${.netsource.sc4s_vendor_product}" eq "dell_powerscale_onefs"
        )
    };
    parser { app-dell_powerscale_onefs_protocol(); };
};

application app-syslog-dell_powerscale_onefs_protocol[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and message('"protocol"[ ]*:' type(pcre))
        and message('"eventType"[ ]*:' type(pcre));
    };
    parser { app-dell_powerscale_onefs_protocol(); };
};

application app-syslog-dell_powerscale_onefs_config[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and message('"topic"[ ]*:[ ]*"config"' type(pcre))
        and message('"eventType"[ ]*:' type(pcre));
    };
    parser { app-dell_powerscale_onefs_config(); };
};
