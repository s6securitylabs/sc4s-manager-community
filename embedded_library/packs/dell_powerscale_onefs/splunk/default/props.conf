SHOULD_LINEMERGE = false
TRUNCATE = 50000
KV_MODE = json
AUTO_KV_JSON = true
EVAL-vendor = "dell"
EVAL-product = "powerscale-onefs"
EVAL-vendor_product = "dell:powerscale-onefs"
FIELDALIAS-powerscale_config_action = eventType AS action
FIELDALIAS-powerscale_config_signature = detailType AS signature
