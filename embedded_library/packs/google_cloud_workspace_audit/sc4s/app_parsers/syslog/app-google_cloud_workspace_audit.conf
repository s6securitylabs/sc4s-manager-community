# Conservative Google Cloud / Workspace audit JSON parser for SecHub Resources.
# Match only Cloud Audit Log LogEntry JSON or Workspace Admin Reports Activity JSON.
# This parser does not validate Google API collection, Pub/Sub export, or Workspace polling.

block parser app_google_cloud_workspace_audit() {
    channel {
        if {
            filter {
                match('"protoPayload"\s*:\s*\{.*"type.googleapis.com/google.cloud.audit.AuditLog"' value('MESSAGE'))
                or match('"kind"\s*:\s*"admin#reports#activity".*"applicationName"\s*:\s*"(login|admin|drive|token|groups|calendar|saml)"' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('google') product('cloud_workspace_audit')) };
            rewrite { r_set_splunk_dest_default(index('main') sourcetype('google:audit:json')) };
            rewrite { set('google_cloud_workspace_audit', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
