[google:audit:json]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "(timestamp|time)"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = "google"
EVAL-product = "cloud_workspace_audit"
EVAL-vendor_product = "google:cloud_workspace_audit"
EVAL-google_audit_family = case(match(logName,"cloudaudit.googleapis.com%2Factivity"),"gcp_admin_activity", match(logName,"cloudaudit.googleapis.com%2Fdata_access"),"gcp_data_access", match(logName,"cloudaudit.googleapis.com%2Fsystem_event"),"gcp_system_event", match(logName,"cloudaudit.googleapis.com%2Fpolicy"),"gcp_policy_denied", 'id.applicationName'="login","workspace_login", 'id.applicationName'="admin","workspace_admin", 'id.applicationName'="drive","workspace_drive", 'id.applicationName'="token","workspace_token", 'id.applicationName'="groups","workspace_groups", 'id.applicationName'="calendar","workspace_calendar", 'id.applicationName'="saml","workspace_saml", true(),"google_audit")
EVAL-cloud_project = coalesce('resource.labels.project_id', project_id)
EVAL-gcp_service = 'protoPayload.serviceName'
EVAL-method = 'protoPayload.methodName'
EVAL-user = coalesce('protoPayload.authenticationInfo.principalEmail', 'actor.email')
EVAL-src_user = user
EVAL-src_ip = coalesce('protoPayload.requestMetadata.callerIp', ipAddress)
EVAL-action = coalesce(method, mvindex('events{}.name',0))
EVAL-signature = action
EVAL-signature_id = coalesce('protoPayload.resourceName', 'id.uniqueQualifier', action)
EVAL-resource_name = 'protoPayload.resourceName'
EVAL-status = coalesce(tostring('protoPayload.status.code'), severity)
EVAL-app = coalesce('id.applicationName', gcp_service)
EVAL-src = src_ip
EVAL-gcp_permission = coalesce(gcp_authorization_permission, 'protoPayload.authorizationInfo{}.permission')
EVAL-gcp_permission_granted = coalesce(gcp_authorization_granted, 'protoPayload.authorizationInfo{}.granted')
EVAL-workspace_oauth_app = coalesce(app_name, 'events{}.parameters{}.value')
EVAL-workspace_oauth_client_id = client_id
EVAL-workspace_oauth_client_type = client_type
EVAL-workspace_group_email = group_email
EVAL-workspace_member_email = coalesce(user_email, member_email)
EVAL-workspace_member_role = member_role
EVAL-workspace_calendar_id = calendar_id
EVAL-workspace_calendar_access_level = access_level
EVAL-workspace_calendar_grantee_email = grantee_email
EVAL-workspace_saml_application = saml_application_name
EVAL-workspace_saml_failure_type = saml_failure_type
FIELDALIAS-google_marker = marker AS marker
EXTRACT-google_gcp_authorization_fields = \"authorizationInfo\"\s*:\s*\[\s*\{.*?\"permission\"\s*:\s*\"(?<gcp_authorization_permission>[^\"]+)\".*?\"granted\"\s*:\s*(?<gcp_authorization_granted>true|false)
EXTRACT-google_workspace_token_fields = \"name\"\s*:\s*\"app_name\"\s*,\s*\"value\"\s*:\s*\"(?<app_name>[^\"]+)\".*?\"name\"\s*:\s*\"client_id\"\s*,\s*\"value\"\s*:\s*\"(?<client_id>[^\"]+)\".*?\"name\"\s*:\s*\"client_type\"\s*,\s*\"value\"\s*:\s*\"(?<client_type>[^\"]+)\"
EXTRACT-google_workspace_group_fields = \"name\"\s*:\s*\"group_email\"\s*,\s*\"value\"\s*:\s*\"(?<group_email>[^\"]+)\".*?\"name\"\s*:\s*\"user_email\"\s*,\s*\"value\"\s*:\s*\"(?<user_email>[^\"]+)\".*?\"name\"\s*:\s*\"member_role\"\s*,\s*\"value\"\s*:\s*\"(?<member_role>[^\"]+)\"
EXTRACT-google_workspace_calendar_fields = \"name\"\s*:\s*\"calendar_id\"\s*,\s*\"value\"\s*:\s*\"(?<calendar_id>[^\"]+)\".*?\"name\"\s*:\s*\"access_level\"\s*,\s*\"value\"\s*:\s*\"(?<access_level>[^\"]+)\".*?\"name\"\s*:\s*\"grantee_email\"\s*,\s*\"value\"\s*:\s*\"(?<grantee_email>[^\"]+)\"
EXTRACT-google_workspace_saml_fields = \"name\"\s*:\s*\"application_name\"\s*,\s*\"value\"\s*:\s*\"(?<saml_application_name>[^\"]+)\".*?\"name\"\s*:\s*\"failure_type\"\s*,\s*\"value\"\s*:\s*\"(?<saml_failure_type>[^\"]+)\"
