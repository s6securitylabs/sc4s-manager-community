EXTRACT-http_access_marker = marker=(?<marker>SC4S_NGINX_APACHE_HTTP_TEST_[A-Z_]+_\d{3})
EXTRACT-http_access_combined = ^(?<src_ip>\S+)\s+(?<ident>\S+)\s+(?<user>\S+)\s+\[(?<http_time>[^\]]+)\]\s+"(?<http_method>\S+)\s+(?<uri_path>[^\s"]+)\s+HTTP/(?<http_version>[^"]+)"\s+(?<status>\d{3})\s+(?<bytes>\S+)\s+"(?<http_referrer>[^"]*)"\s+"(?<http_user_agent>[^"]*)"
