[nginx:access:combined]
SHOULD_LINEMERGE = false
KV_MODE = none
TRUNCATE = 200000
TIME_PREFIX = \[
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
MAX_TIMESTAMP_LOOKAHEAD = 32
EXTRACT-http_access_marker = marker=(?<marker>SC4S_NGINX_APACHE_HTTP_TEST_[A-Z_]+_\d{3})
EXTRACT-http_access_combined = ^(?<src_ip>\S+)\s+(?<ident>\S+)\s+(?<user>\S+)\s+\[(?<http_time>[^\]]+)\]\s+"(?<http_method>\S+)\s+(?<uri_path>[^\s"]+)\s+HTTP/(?<http_version>[^"]+)"\s+(?<status>\d{3})\s+(?<bytes>\S+)\s+"(?<http_referrer>[^"]*)"\s+"(?<http_user_agent>[^"]*)"
EVAL-vendor = "nginx"
EVAL-product = "http_server"
EVAL-vendor_product = "nginx:http_server"
EVAL-src = src_ip
EVAL-url = uri_path
EVAL-bytes_out = if(bytes="-", null(), bytes)
EVAL-action = lower(http_method)
EVAL-signature = status
EVAL-signature_id = marker

