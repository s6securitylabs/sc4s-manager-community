[nginx:error]
SHOULD_LINEMERGE = false
KV_MODE = none
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %Y/%m/%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 20
EXTRACT-http_error_marker = marker=(?<marker>SC4S_NGINX_APACHE_HTTP_TEST_[A-Z_]+_\d{3})
EXTRACT-nginx_error_core = ^(?<http_time>\d{4}/\d{2}/\d{2}\s+\d{2}:\d{2}:\d{2})\s+\[(?<error_level>[^\]]+)\]\s+(?<process_id>\d+)#(?<tid>\d+):\s+\*(?<connection_id>\d+)\s+(?<error_message>.*?)(?:,\s+client:\s+(?<client_ip>[^,]+))?(?:,\s+server:\s+(?<server>[^,]+))?(?:,\s+request:\s+"(?<request>[^"]+)")?(?:,\s+host:\s+"(?<host_header>[^"]+)")?(?:,\s+referrer:\s+"(?<http_referrer>[^"]+)")?\s+marker=
EVAL-vendor = "nginx"
EVAL-product = "http_server"
EVAL-vendor_product = "nginx:http_server"
EVAL-src_ip = client_ip
EVAL-src = client_ip
EVAL-action = "error"
EVAL-signature = error_level
EVAL-signature_id = marker

[apache:httpd:error]
SHOULD_LINEMERGE = false
KV_MODE = none
TRUNCATE = 200000
TIME_PREFIX = ^\[
TIME_FORMAT = %a %b %d %H:%M:%S.%6N %Y
MAX_TIMESTAMP_LOOKAHEAD = 32
EXTRACT-http_error_marker = marker=(?<marker>SC4S_NGINX_APACHE_HTTP_TEST_[A-Z_]+_\d{3})
EXTRACT-apache_error_core = ^\[(?<http_time>[^\]]+)\]\s+\[(?<module>[^:]+):(?<error_level>[^\]]+)\]\s+\[pid\s+(?<process_id>\d+)(?::tid\s+(?<tid>\d+))?\]\s+\[client\s+(?<client_ip>[^:\] ]+)(?::(?<client_port>\d+))?\]\s+(?<error_code>AH\d+):\s+(?<error_message>.*?)(?:,\s+referer:\s+(?<http_referrer>\S+))?\s+marker=
EVAL-vendor = "apache"
EVAL-product = "httpd"
EVAL-vendor_product = "apache:httpd"
EVAL-src_ip = client_ip
EVAL-src = client_ip
EVAL-action = "error"
EVAL-signature = coalesce(error_code, error_level)
EVAL-signature_id = marker
