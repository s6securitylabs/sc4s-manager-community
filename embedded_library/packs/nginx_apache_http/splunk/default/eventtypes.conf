[nginx_apache_http_nginx_combined]
search = sourcetype="nginx:access:combined" vendor=nginx product=http_server http_method=* status=*

[nginx_apache_http_apache_common]
search = sourcetype="apache:httpd:access:common" vendor=apache product=httpd http_method=* status=*

[nginx_apache_http_apache_combined]
search = sourcetype="apache:httpd:access:combined" vendor=apache product=httpd http_method=* status=*

[nginx_apache_http_client_error]
search = (sourcetype="nginx:access:combined" OR sourcetype="apache:httpd:access:common" OR sourcetype="apache:httpd:access:combined") status=4*

[nginx_apache_http_server_error]
search = (sourcetype="nginx:access:combined" OR sourcetype="apache:httpd:access:common" OR sourcetype="apache:httpd:access:combined") status=5*

[nginx_apache_http_nginx_error]
search = sourcetype="nginx:error" vendor=nginx product=http_server error_level=*

[nginx_apache_http_apache_error]
search = sourcetype="apache:httpd:error" vendor=apache product=httpd error_level=*
