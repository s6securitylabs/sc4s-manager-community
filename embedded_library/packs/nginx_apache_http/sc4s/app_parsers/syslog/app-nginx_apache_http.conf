# Nginx / Apache HTTP access-log relay routing.
# Conservative: only acts on the dedicated source tag / netsource identity and narrow documented access-log shapes.
block parser app-nginx_apache_http_nginx_combined() { channel { rewrite { r_set_splunk_dest_default(index('netops') sourcetype('nginx:access:combined') vendor('nginx') product('http_server') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('web')); }; }; };
block parser app-nginx_apache_http_apache_common() { channel { rewrite { r_set_splunk_dest_default(index('netops') sourcetype('apache:httpd:access:common') vendor('apache') product('httpd') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('web')); }; }; };
block parser app-nginx_apache_http_apache_combined() { channel { rewrite { r_set_splunk_dest_default(index('netops') sourcetype('apache:httpd:access:combined') vendor('apache') product('httpd') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('web')); }; }; };
block parser app-nginx_apache_http_nginx_error() { channel { rewrite { r_set_splunk_dest_default(index('netops') sourcetype('nginx:error') vendor('nginx') product('http_server') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('web')); }; }; };
block parser app-nginx_apache_http_apache_error() { channel { rewrite { r_set_splunk_dest_default(index('netops') sourcetype('apache:httpd:error') vendor('apache') product('httpd') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('web')); }; }; };
application app-nginx_apache_http_nginx_combined[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_NGINX_APACHE_HTTP") or "${.netsource.sc4s_vendor_product}" eq "nginx_apache_http") and message('SC4S_NGINX_APACHE_HTTP_TEST_NGINX_COMBINED_') }; parser { app-nginx_apache_http_nginx_combined(); }; };
application app-nginx_apache_http_apache_common[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_NGINX_APACHE_HTTP") or "${.netsource.sc4s_vendor_product}" eq "nginx_apache_http") and message('SC4S_NGINX_APACHE_HTTP_TEST_APACHE_COMMON_') }; parser { app-nginx_apache_http_apache_common(); }; };
application app-nginx_apache_http_apache_combined[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_NGINX_APACHE_HTTP") or "${.netsource.sc4s_vendor_product}" eq "nginx_apache_http") and message('SC4S_NGINX_APACHE_HTTP_TEST_APACHE_COMBINED_') }; parser { app-nginx_apache_http_apache_combined(); }; };
application app-nginx_apache_http_nginx_error[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_NGINX_APACHE_HTTP") or "${.netsource.sc4s_vendor_product}" eq "nginx_apache_http") and message('SC4S_NGINX_APACHE_HTTP_TEST_NGINX_ERROR_') }; parser { app-nginx_apache_http_nginx_error(); }; };
application app-nginx_apache_http_apache_error[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_NGINX_APACHE_HTTP") or "${.netsource.sc4s_vendor_product}" eq "nginx_apache_http") and message('SC4S_NGINX_APACHE_HTTP_TEST_APACHE_ERROR_') }; parser { app-nginx_apache_http_apache_error(); }; };
