[microsoft:defender:cloud:regulatory_compliance]
SHOULD_LINEMERGE = false
KV_MODE = json
AUTO_KV_JSON = true
TRUNCATE = 300000
TIME_PREFIX = "timeGenerated"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 35
EVAL-vendor = "Microsoft"
EVAL-product = "defender_for_cloud"
EVAL-vendor_product = "microsoft:defender_for_cloud"
EVAL-action = 'properties.state'
EVAL-compliance_state = 'properties.state'
EVAL-compliance_standard = if(match(id, "/regulatoryComplianceStandards/"), replace(id, "^.*/regulatoryComplianceStandards/([^/]+)/.*$", "\\1"), null())
FIELDALIAS-mdfc_common = id AS event_id, name AS resource_name, resourceType AS resource_type, subscriptionId AS subscription_id, resourceGroup AS resource_group, resourceId AS resource_id, marker AS marker
FIELDALIAS-mdfc_regulatory = name AS compliance_control, properties.description AS signature, properties.description AS compliance_control_description, properties.state AS status, properties.passedAssessments AS passed_assessments, properties.failedAssessments AS failed_assessments, properties.skippedAssessments AS skipped_assessments
