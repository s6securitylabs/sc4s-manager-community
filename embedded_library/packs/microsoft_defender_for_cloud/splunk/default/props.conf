FIELDALIAS-mdfc_common = id AS event_id, name AS resource_name, resourceType AS resource_type, subscriptionId AS subscription_id, resourceGroup AS resource_group, resourceId AS resource_id, marker AS marker
FIELDALIAS-mdfc_rec = recommendationDisplayName AS signature, recommendationDisplayName AS recommendation, recommendationTypeId AS recommendation_type_id, recommendationCategory AS category, recommendationSeverity AS severity, state AS status, statusCode AS status_code, assessmentKey AS assessment_key, complianceControl AS compliance_control, policyDefinitionId AS policy_definition_id
FIELDALIAS-mdfc_rec_score = secureScoreControl AS secure_score_control, scoreImpact AS score_impact

