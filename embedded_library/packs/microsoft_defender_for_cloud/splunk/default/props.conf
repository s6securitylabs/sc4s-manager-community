[microsoft:defender:cloud:security_alert]
SHOULD_LINEMERGE = false
KV_MODE = json
AUTO_KV_JSON = true
TRUNCATE = 300000
TIME_PREFIX = "timeGenerated"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 35
EVAL-vendor = "Microsoft"
EVAL-product = "defender_for_cloud"
EVAL-vendor_product = "microsoft:defender_for_cloud"
EVAL-action = status
FIELDALIAS-mdfc_common = id AS event_id, name AS resource_name, resourceType AS resource_type, subscriptionId AS subscription_id, resourceGroup AS resource_group, resourceId AS resource_id, marker AS marker
FIELDALIAS-mdfc_alert = alertDisplayName AS signature, alertDisplayName AS alert_name, alertType AS alert_type, severity AS severity, status AS status, compromisedEntity AS dest, compromisedEntity AS affected_resource, confidenceScore AS confidence, confidenceReasons AS confidence_reasons, tactics AS tactics, techniques AS techniques, entities AS entities, remediationSteps AS remediation_steps, vendorName AS provider
FIELDALIAS-mdfc_alert_time = timeGenerated AS event_time, startTimeUtc AS start_time, endTimeUtc AS end_time

