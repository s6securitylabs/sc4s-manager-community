[sc4s_sql_database_postgresql_auth]
search = sourcetype=postgresql:server:log vendor=postgresql product=postgresql action=connection_authorized

[sc4s_sql_database_postgresql_errors]
search = sourcetype=postgresql:server:log vendor=postgresql product=postgresql severity=ERROR

[sc4s_sql_database_postgresql_statement_duration]
search = sourcetype=postgresql:server:log vendor=postgresql product=postgresql action=statement_duration query_duration_ms=*

[sc4s_sql_database_mysql_errors]
search = sourcetype=mysql:error:log vendor=mysql product=mysql_server severity=Warning

[sc4s_sql_database_mariadb_errors]
search = sourcetype=mariadb:error:log vendor=mariadb product=mariadb_server severity=Warning

[sc4s_sql_database_mysql_slow_queries]
search = sourcetype=mysql:slowquery:log vendor=mysql product=mysql_server action=slow_query query_time=*

[sc4s_sql_database_mariadb_general]
search = sourcetype=mariadb:general:log vendor=mariadb product=mariadb_server db_command=*
