[postgresql:server:log]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S.%3N %Z
MAX_TIMESTAMP_LOOKAHEAD = 28
EXTRACT-sql_db_marker = marker=(?<marker>SC4S_SQL_DATABASE_LOGS_TEST_[A-Z_]+_\d{3})
EXTRACT-postgresql_prefix = ^(?<db_time>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d+\s+\S+)\s+\[(?<process_id>\d+)\]\s+(?<db_user>[^@\s]+)@(?<database>\S+)\s+(?<severity>[A-Z]+):\s+(?<db_message>.*?)(?:\s+marker=|$)
EXTRACT-postgresql_duration = duration:\s+(?<query_duration_ms>\d+(?:\.\d+)?)\s+ms\s+statement:\s+(?<db_statement>.*?)(?:\s+marker=|$)
EVAL-vendor = "postgresql"
EVAL-product = "postgresql"
EVAL-vendor_product = "postgresql:postgresql"
EVAL-user = db_user
EVAL-src_user = db_user
EVAL-action = case(match(db_message,"connection authorized"),"connection_authorized", isnotnull(query_duration_ms),"statement_duration", match(severity,"ERROR|FATAL|PANIC"),"error", true(), lower(severity))
EVAL-query_time = query_duration_ms
EVAL-signature = case(isnotnull(query_duration_ms),"statement_duration", true(), severity)
EVAL-signature_id = marker
EVAL-process = process_id

[mysql:error:log]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 28
EXTRACT-sql_db_marker = marker=(?<marker>SC4S_SQL_DATABASE_LOGS_TEST_[A-Z_]+_\d{3})
EXTRACT-mysql_error = ^(?<db_time>\S+)\s+(?<thread_id>\d+)\s+\[(?<severity>[^\]]+)\]\s+(?:\[(?<error_code>[^\]]+)\]\s+)?(?:\[(?<component>[^\]]+)\]\s+)?(?<db_message>.*?)(?:\s+marker=|$)
EVAL-vendor = "mysql"
EVAL-product = "mysql_server"
EVAL-vendor_product = "mysql:mysql_server"
EVAL-action = if(match(db_message,"Access denied"),"access_denied", lower(severity))
EVAL-signature = coalesce(error_code, severity)
EVAL-signature_id = marker

[mysql:slowquery:log]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^# Time:\s+
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 28
EXTRACT-sql_db_marker = marker=(?<marker>SC4S_SQL_DATABASE_LOGS_TEST_[A-Z_]+_\d{3})
EXTRACT-mysql_slow = ^# Time:\s+(?<db_time>\S+)\s+# User@Host:\s+(?<db_user>[^\[]+)\[[^\]]*\]\s+@\s+(?<db_host>[^\[]*)\[(?<src_ip>[^\]]+)\]\s+# Query_time:\s+(?<query_time>\S+)\s+Lock_time:\s+(?<lock_time>\S+)\s+Rows_sent:\s+(?<rows_sent>\d+)\s+Rows_examined:\s+(?<rows_examined>\d+)
EVAL-vendor = "mysql"
EVAL-product = "mysql_server"
EVAL-vendor_product = "mysql:mysql_server"
EVAL-user = db_user
EVAL-src = src_ip
EVAL-action = "slow_query"
EVAL-signature = "slow_query"
EVAL-signature_id = marker

[mariadb:error:log]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 19
EXTRACT-sql_db_marker = marker=(?<marker>SC4S_SQL_DATABASE_LOGS_TEST_[A-Z_]+_\d{3})
EXTRACT-mariadb_error = ^(?<db_time>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+(?<thread_id>\d+)\s+\[(?<severity>[^\]]+)\]\s+(?<db_message>.*?)(?:\s+marker=|$)
EXTRACT-mariadb_error_user = user '(?<db_user>[^']+)'@'(?<src_ip>[^']+)'
EVAL-vendor = "mariadb"
EVAL-product = "mariadb_server"
EVAL-vendor_product = "mariadb:mariadb_server"
EVAL-user = db_user
EVAL-src = src_ip
EVAL-action = if(match(db_message,"Access denied"),"access_denied", lower(severity))
EVAL-signature = severity
EVAL-signature_id = marker

[mariadb:general:log]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 19
EXTRACT-sql_db_marker = marker=(?<marker>SC4S_SQL_DATABASE_LOGS_TEST_[A-Z_]+_\d{3})
EXTRACT-mariadb_general = ^(?<db_time>\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})\s+(?<thread_id>\d+)\s+(?<db_command>\S+)\s+(?<db_message>.*?)(?:\s+marker=|$)
EXTRACT-mariadb_general_user = (?<db_user>[^@\s]+)@(?<src_ip>\d{1,3}(?:\.\d{1,3}){3})\s+on\s+(?<database>\S+)
EVAL-vendor = "mariadb"
EVAL-product = "mariadb_server"
EVAL-vendor_product = "mariadb:mariadb_server"
EVAL-user = db_user
EVAL-src = src_ip
EVAL-action = lower(db_command)
EVAL-signature = db_command
EVAL-signature_id = marker
