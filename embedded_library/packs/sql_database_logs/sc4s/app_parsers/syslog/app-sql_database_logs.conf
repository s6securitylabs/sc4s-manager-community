# SQL database logs relay routing.
# Conservative: only acts on the dedicated source tag / netsource identity and synthetic fixture markers.
block parser app-sql_database_logs_postgresql_text() { channel { rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('postgresql:server:log') vendor('postgresql') product('postgresql') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('database')); }; }; };
block parser app-sql_database_logs_mysql_error() { channel { rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('mysql:error:log') vendor('mysql') product('mysql_server') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('database')); }; }; };
block parser app-sql_database_logs_mysql_slow() { channel { rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('mysql:slowquery:log') vendor('mysql') product('mysql_server') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('database')); }; }; };
block parser app-sql_database_logs_mariadb_error() { channel { rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('mariadb:error:log') vendor('mariadb') product('mariadb_server') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('database')); }; }; };
block parser app-sql_database_logs_mariadb_general() { channel { rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('mariadb:general:log') vendor('mariadb') product('mariadb_server') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('database')); }; }; };
application app-sql_database_logs_postgresql_text[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_SQL_DATABASE_LOGS") or "${.netsource.sc4s_vendor_product}" eq "sql_database_logs") and (message('SC4S_SQL_DATABASE_LOGS_TEST_POSTGRES_AUTH_') or message('SC4S_SQL_DATABASE_LOGS_TEST_POSTGRES_ERROR_') or message('SC4S_SQL_DATABASE_LOGS_TEST_POSTGRES_DURATION_')) }; parser { app-sql_database_logs_postgresql_text(); }; };
application app-sql_database_logs_mysql_error[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_SQL_DATABASE_LOGS") or "${.netsource.sc4s_vendor_product}" eq "sql_database_logs") and message('SC4S_SQL_DATABASE_LOGS_TEST_MYSQL_ERROR_') }; parser { app-sql_database_logs_mysql_error(); }; };
application app-sql_database_logs_mysql_slow[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_SQL_DATABASE_LOGS") or "${.netsource.sc4s_vendor_product}" eq "sql_database_logs") and message('SC4S_SQL_DATABASE_LOGS_TEST_MYSQL_SLOW_') }; parser { app-sql_database_logs_mysql_slow(); }; };
application app-sql_database_logs_mariadb_error[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_SQL_DATABASE_LOGS") or "${.netsource.sc4s_vendor_product}" eq "sql_database_logs") and message('SC4S_SQL_DATABASE_LOGS_TEST_MARIADB_ERROR_') }; parser { app-sql_database_logs_mariadb_error(); }; };
application app-sql_database_logs_mariadb_general[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_SQL_DATABASE_LOGS") or "${.netsource.sc4s_vendor_product}" eq "sql_database_logs") and message('SC4S_SQL_DATABASE_LOGS_TEST_MARIADB_GENERAL_') }; parser { app-sql_database_logs_mariadb_general(); }; };
