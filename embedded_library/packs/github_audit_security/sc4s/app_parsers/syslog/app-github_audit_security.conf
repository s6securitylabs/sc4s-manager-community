# Conservative GitHub audit/security JSON parser for SecHub Resources.
# Match only audit-log JSON records carrying GitHub audit base fields.
# Do not treat upstream SC4S GitHub parser presence as validation.

block parser app_github_audit_security() {
    channel {
        if {
            filter {
                match('"action"\s*:\s*"(repo|org|team|business|org_credential_authorization|personal_access_token|fine_grained_personal_access_token|oauth|github_app|actions_|audit_log_streaming|hook|secret_scanning|code_scanning_alert|dependabot_alert|protected_branch|repo_ruleset|ssh_certificate_authority)' value('MESSAGE'))
                and match('"actor"\s*:\s*"' value('MESSAGE'))
                and match('"org"\s*:\s*"' value('MESSAGE'))
                and match('"created_at"\s*:' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('github') product('audit_security')) };
            rewrite { r_set_splunk_dest_default(index('gitops') sourcetype('github:audit:json')) };
            rewrite { set('github_audit_security', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
