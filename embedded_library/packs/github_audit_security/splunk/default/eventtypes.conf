[sechub_github_audit_security]
search = sourcetype=github:audit:json vendor=github product=audit_security

[sechub_github_repo_changes]
search = sourcetype=github:audit:json vendor=github product=audit_security action=repo.*

[sechub_github_org_membership]
search = sourcetype=github:audit:json vendor=github product=audit_security (action=org.* OR action=team.*)

[sechub_github_enterprise_admin]
search = sourcetype=github:audit:json vendor=github product=audit_security action=business.*

[sechub_github_sso_credentials]
search = sourcetype=github:audit:json vendor=github product=audit_security action=org_credential_authorization.*

[sechub_github_token_app_access]
search = sourcetype=github:audit:json vendor=github product=audit_security (action=personal_access_token.* OR action=fine_grained_personal_access_token* OR action=oauth* OR action=github_app*)

[sechub_github_actions_admin]
search = sourcetype=github:audit:json vendor=github product=audit_security action=actions_*

[sechub_github_audit_streaming]
search = sourcetype=github:audit:json vendor=github product=audit_security action=audit_log_streaming.*

[sechub_github_webhooks]
search = sourcetype=github:audit:json vendor=github product=audit_security action=hook.*

[sechub_github_secret_scanning]
search = sourcetype=github:audit:json vendor=github product=audit_security action=secret_scanning*

[sechub_github_security_alerts]
search = sourcetype=github:audit:json vendor=github product=audit_security (action=code_scanning_alert.* OR action=dependabot_alert.*)

[sechub_github_branch_rules]
search = sourcetype=github:audit:json vendor=github product=audit_security (action=protected_branch.* OR action=repo_ruleset.*)

[sechub_github_ssh_certificate_authorities]
search = sourcetype=github:audit:json vendor=github product=audit_security action=ssh_certificate_authority.*
