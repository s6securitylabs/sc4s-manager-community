[github:audit:json]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "created_at"\s*:\s*
TIME_FORMAT = %s%3N
MAX_TIMESTAMP_LOOKAHEAD = 13
EVAL-vendor = "github"
EVAL-product = "audit_security"
EVAL-vendor_product = "github:audit_security"
EVAL-github_audit_family = case(match(action,"^(repo|repository)\."),"repo", match(action,"^(org|team)\."),"org_membership", match(action,"^business\."),"enterprise_admin", match(action,"^org_credential_authorization\."),"sso_credential_authorization", match(action,"^(personal_access_token|fine_grained_personal_access_token|oauth|github_app|integration)"),"token_app_access", match(action,"^actions_"),"actions", match(action,"^audit_log_streaming\."),"audit_streaming", match(action,"^hook\."),"webhooks", match(action,"^secret_scanning"),"secret_scanning", match(action,"^(code_scanning_alert|dependabot_alert)\."),"security_alerts", match(action,"^(protected_branch|repo_ruleset)\."),"branch_rules", match(action,"^ssh_certificate_authority\."),"ssh_certificate_authority", true(),"audit")
EVAL-user = coalesce(user, actor)
EVAL-src_user = actor
EVAL-action = action
EVAL-signature = action
EVAL-signature_id = coalesce(tostring(alert_number), security_advisory_ghsa_id, rule_id, tostring(ssh_certificate_authority_id), fingerprint, tostring(audit_log_stream_id), tostring(hook_id), request_id, tostring(token_id), business, invitee, inviter, repo, org, action)
EVAL-src = 'actor_location.country_code'
EVAL-object = coalesce(repo, org, business, branch, secret_name, workflow_name, name, tostring(ssh_certificate_authority_id), fingerprint, tostring(audit_log_stream_id), audit_log_stream_sink, new_s3_bucket, old_s3_bucket, tostring(hook_id), invitee, inviter)
EVAL-status = coalesce(resolution, alert_state, dismissed_reason, operation_type, visibility, permission, tostring(audit_log_stream_enabled))
EVAL-result = status
EVAL-enterprise_role = permission
FIELDALIAS-github_marker = marker AS marker
