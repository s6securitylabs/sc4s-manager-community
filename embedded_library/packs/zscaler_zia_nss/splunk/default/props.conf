[zscaler:zia:web]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 60000
TIME_PREFIX = "time"\s*:\s*"
TIME_FORMAT = %a %b %d %H:%M:%S %Y
MAX_TIMESTAMP_LOOKAHEAD = 24
EVAL-vendor = "Zscaler"
EVAL-product = "ZIA"
EVAL-vendor_product = "zscaler:zia"
FIELDALIAS-zia_web_src = event.cltip AS src_ip, event.cltip AS src
FIELDALIAS-zia_web_src_port = event.cltsourceport AS src_port
FIELDALIAS-zia_web_dest = event.serverip AS dest_ip, event.serverip AS dest
FIELDALIAS-zia_web_transport = event.proto AS transport
FIELDALIAS-zia_web_user = event.login AS user
FIELDALIAS-zia_web_action = event.action AS action
FIELDALIAS-zia_web_url_host = event.host AS url_host
FIELDALIAS-zia_web_app = event.appname AS app
FIELDALIAS-zia_web_severity = event.threatseverity AS severity

[zscaler:zia:firewall]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 60000
TIME_PREFIX = "datetime"\s*:\s*"
TIME_FORMAT = %a %b %d %H:%M:%S %Y
MAX_TIMESTAMP_LOOKAHEAD = 24
EVAL-vendor = "Zscaler"
EVAL-product = "ZIA"
EVAL-vendor_product = "zscaler:zia"
FIELDALIAS-zia_fw_src = event.csip AS src_ip, event.csip AS src
FIELDALIAS-zia_fw_src_port = event.csport AS src_port
FIELDALIAS-zia_fw_dest = event.cdip AS dest_ip, event.cdip AS dest
FIELDALIAS-zia_fw_user = event.user AS user
FIELDALIAS-zia_fw_action = event.action AS action
FIELDALIAS-zia_fw_transport = event.proto AS transport
FIELDALIAS-zia_fw_dest_port = event.cdport AS dest_port
FIELDALIAS-zia_fw_rule = event.rulelabel AS rule
FIELDALIAS-zia_fw_app = event.nwapp AS app
