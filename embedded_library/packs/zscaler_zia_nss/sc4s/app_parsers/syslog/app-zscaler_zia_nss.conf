# Zscaler Internet Access NSS JSON/syslog routing. Conservative dedicated-listener/source-tag matching only.
block parser app-zscaler_zia_nss_web() {
    channel {
        rewrite { r_set_splunk_dest_default(index('netproxy') sourcetype('zscaler:zia:web') vendor('zscaler') product('zia') template('t_hdr_msg')); };
        rewrite { r_set_splunk_dest_update_v2(class('web')); };
    };
};

block parser app-zscaler_zia_nss_firewall() {
    channel {
        rewrite { r_set_splunk_dest_default(index('netfw') sourcetype('zscaler:zia:firewall') vendor('zscaler') product('zia') template('t_hdr_msg')); };
        rewrite { r_set_splunk_dest_update_v2(class('firewall')); };
    };
};

application app-zscaler_zia_nss_web[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (tags(".source.s_ZSCALER_ZIA_NSS") or "${.netsource.sc4s_vendor_product}" eq "zscaler_zia_nss")
        and message('\"sourcetype\":\"zscalernss-web\"')
    };
    parser { app-zscaler_zia_nss_web(); };
};

application app-zscaler_zia_nss_firewall[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (tags(".source.s_ZSCALER_ZIA_NSS") or "${.netsource.sc4s_vendor_product}" eq "zscaler_zia_nss")
        and message('\"sourcetype\"') and message('zscalernss-fw')
    };
    parser { app-zscaler_zia_nss_firewall(); };
};
