# Conservative HashiCorp Vault audit JSON parser for SecHub Resources.
# Match only default Vault audit JSON entries that carry the documented
# time/type/request object shape. Do not match arbitrary JSON logs.

block parser app_hashicorp_vault_audit() {
    channel {
        if {
            filter {
                match('"time"\s*:\s*"' value('MESSAGE'))
                and match('"type"\s*:\s*"(request|response)"' value('MESSAGE'))
                and match('"request"\s*:' value('MESSAGE'))
                and match('"operation"\s*:' value('MESSAGE'))
                and match('"path"\s*:' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('hashicorp') product('vault_audit')) };
            rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('hashicorp:vault:audit')) };
            rewrite { set('hashicorp_vault_audit', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
