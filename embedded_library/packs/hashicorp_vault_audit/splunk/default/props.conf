[hashicorp:vault:audit]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-vendor = "hashicorp"
EVAL-product = "vault_audit"
EVAL-vendor_product = "hashicorp:vault_audit"
EVAL-vault_type = type
EVAL-vault_namespace = 'request.namespace.path'
EVAL-vault_namespace_id = 'request.namespace.id'
EVAL-vault_mount_type = 'request.mount_type'
EVAL-vault_mount_accessor = 'request.mount_accessor'
EVAL-vault_client_id = 'request.client_id'
EVAL-vault_request_uri = 'request.request_uri'
EVAL-vault_policy_allowed = lower(tostring('auth.policy_results.allowed'))
EVAL-vault_policy_override = lower(tostring('request.policy_override'))
EVAL-vault_wrap_ttl = 'request.wrap_ttl'
EVAL-vault_audit_device = if(match('request.path', "^sys/audit"), replace('request.path', "^sys/audit/?", ""), null())
EVAL-vault_token_lifecycle = if(match('request.path', "^auth/token/(create|create-orphan|renew|renew-self|revoke|revoke-self|revoke-accessor|lookup|lookup-self)"), replace('request.path', "^auth/token/", ""), null())
EVAL-vault_token_type = 'response.auth.token_type'
EVAL-vault_token_ttl = 'response.auth.lease_duration'
EVAL-vault_token_renewable = lower(tostring('response.auth.renewable'))
EVAL-vault_token_policies = 'response.auth.policies'
EVAL-vault_token_orphan = lower(tostring('response.auth.orphan'))
EVAL-vault_audit_family = if(vault_policy_allowed="false", "policy_denied", if(isnotnull(error), "response_error", if(isnotnull(vault_namespace), "namespace", if(match('request.path', "^sys/audit"), "audit_device", if(isnotnull(vault_token_lifecycle), "token_lifecycle", if(match('request.path', "^auth/"), "auth", if(match('request.path', "^(secret|kv)/"), "secret", if(match('request.path', "^sys/(policies|policy|auth|mounts)"), "policy", type))))))))
EVAL-request_id = 'request.id'
EVAL-action = 'request.operation'
EVAL-signature = coalesce('request.path', 'request.request_uri')
EVAL-signature_id = 'request.id'
EVAL-src_ip = 'request.remote_address'
EVAL-src = src_ip
EVAL-src_port = 'request.remote_port'
EVAL-user = coalesce('auth.display_name', 'auth.metadata.username', 'auth.entity_id')
EVAL-src_user = user
EVAL-status = if(isnotnull(error), "failure", "success")
EVAL-result = coalesce(error, status)
EVAL-error_detail = error
EVAL-object = 'request.path'
FIELDALIAS-vault_marker = marker AS marker
