[proxmox:ve:auth]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
MAX_TIMESTAMP_LOOKAHEAD = 25
EXTRACT-proxmox_marker = marker=(?<marker>SC4S_PROXMOX_TEST_[A-Z_]+_\d{3})
EXTRACT-proxmox_program = ^\S+\s+(?<host>[^\s]+)\s+(?<process>[^\[]+)\[(?<process_id>\d+)\]:\s+(?<proxmox_message>.*?)(?:\s+marker=SC4S_PROXMOX_TEST_[A-Z_]+_\d{3})?$
EXTRACT-proxmox_upid = (?<upid>UPID:(?<proxmox_node>[^:]+):[A-Fa-f0-9]+:[A-Fa-f0-9]+:[A-Fa-f0-9]+:(?<task_type>[^:]+):(?<task_object>[^:]+):(?<user>[^:]+):)
EVAL-vendor = "proxmox"
EVAL-product = "proxmox_ve"
EVAL-vendor_product = "proxmox:proxmox_ve"
EVAL-src_user = user
EVAL-dest = host
EVAL-signature = coalesce(task_type, process)
EVAL-signature_id = coalesce(upid, marker)
EXTRACT-proxmox_auth_failure = authentication failure; rhost=(?<src_ip>[^\s]+) user=(?<auth_user>[^\s]+) msg=(?<result>.*?)(?:\s+marker=|$)
EXTRACT-proxmox_auth_success = successful auth for user '(?<success_user>[^']+)'
EVAL-user = coalesce(auth_user, success_user)
EVAL-action = if(match(proxmox_message, "authentication failure"), "authentication_failure", "authentication_success")
EVAL-result = if(match(proxmox_message, "authentication failure"), coalesce(result, "failure"), "success")

[proxmox:ve:service:task]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
MAX_TIMESTAMP_LOOKAHEAD = 25
EXTRACT-proxmox_marker = marker=(?<marker>SC4S_PROXMOX_TEST_[A-Z_]+_\d{3})
EXTRACT-proxmox_program = ^\S+\s+(?<host>[^\s]+)\s+(?<process>[^\[]+)\[(?<process_id>\d+)\]:\s+(?<proxmox_message>.*?)(?:\s+marker=SC4S_PROXMOX_TEST_[A-Z_]+_\d{3})?$
EXTRACT-proxmox_upid = (?<upid>UPID:(?<proxmox_node>[^:]+):[A-Fa-f0-9]+:[A-Fa-f0-9]+:[A-Fa-f0-9]+:(?<task_type>[^:]+):(?<task_object>[^:]+):(?<user>[^:]+):)
EVAL-vendor = "proxmox"
EVAL-product = "proxmox_ve"
EVAL-vendor_product = "proxmox:proxmox_ve"
EVAL-src_user = user
EVAL-dest = host
EVAL-signature = coalesce(task_type, process)
EVAL-signature_id = coalesce(upid, marker)
EXTRACT-proxmox_service_action = (?<service_action>starting|stopping|re-starting|reloading) service (?<service>[^:]+):
EVAL-action = coalesce(service_action, task_type)
EVAL-result = "started"

[proxmox:ve:task:summary]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%Z
MAX_TIMESTAMP_LOOKAHEAD = 25
EXTRACT-proxmox_marker = marker=(?<marker>SC4S_PROXMOX_TEST_[A-Z_]+_\d{3})
EXTRACT-proxmox_program = ^\S+\s+(?<host>[^\s]+)\s+(?<process>[^\[]+)\[(?<process_id>\d+)\]:\s+(?<proxmox_message>.*?)(?:\s+marker=SC4S_PROXMOX_TEST_[A-Z_]+_\d{3})?$
EXTRACT-proxmox_upid = (?<upid>UPID:(?<proxmox_node>[^:]+):[A-Fa-f0-9]+:[A-Fa-f0-9]+:[A-Fa-f0-9]+:(?<task_type>[^:]+):(?<task_object>[^:]+):(?<user>[^:]+):)
EVAL-vendor = "proxmox"
EVAL-product = "proxmox_ve"
EVAL-vendor_product = "proxmox:proxmox_ve"
EVAL-src_user = user
EVAL-dest = host
EVAL-signature = coalesce(task_type, process)
EVAL-signature_id = coalesce(upid, marker)
EXTRACT-proxmox_task_end = end task (?<upid>UPID:(?<proxmox_node>[^:]+):[A-Fa-f0-9]+:[A-Fa-f0-9]+:[A-Fa-f0-9]+:(?<task_type>[^:]+):(?<task_object>[^:]+):(?<user>[^:]+):)
EVAL-action = case(match(proxmox_message, "end task UPID:"), "task_end", match(proxmox_message, "all VMs and CTs stopped"), "node_shutdown_summary", true(), "task_summary")
EVAL-result = if(match(proxmox_message, "all VMs and CTs stopped"), "completed", "ended")
