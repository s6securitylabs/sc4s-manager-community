# Proxmox VE control-plane syslog relay routing.
# Conservative: only acts on the dedicated source tag / netsource identity and narrow evidence-backed Proxmox message shapes.
block parser app-proxmox_auth() { channel { rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('proxmox:ve:auth') vendor('proxmox') product('proxmox_ve') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('infra')); }; }; };
block parser app-proxmox_service_task() { channel { rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('proxmox:ve:service:task') vendor('proxmox') product('proxmox_ve') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('infra')); }; }; };
block parser app-proxmox_task_summary() { channel { rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('proxmox:ve:task:summary') vendor('proxmox') product('proxmox_ve') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('infra')); }; }; };
application app-proxmox_auth[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_PROXMOX") or "${.netsource.sc4s_vendor_product}" eq "proxmox") and (message('authentication failure;') or message('successful auth for user')) }; parser { app-proxmox_auth(); }; };
application app-proxmox_service_task[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_PROXMOX") or "${.netsource.sc4s_vendor_product}" eq "proxmox") and (message('starting service ') or message('stopping service ') or message('re-starting service ') or message('reloading service ')) and message('UPID:') }; parser { app-proxmox_service_task(); }; };
application app-proxmox_task_summary[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_PROXMOX") or "${.netsource.sc4s_vendor_product}" eq "proxmox") and (message('end task UPID:') or message('all VMs and CTs stopped')) }; parser { app-proxmox_task_summary(); }; };
