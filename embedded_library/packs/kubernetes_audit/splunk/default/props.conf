[kubernetes:audit]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "requestReceivedTimestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = "kubernetes"
EVAL-product = "audit"
EVAL-vendor_product = "kubernetes:audit"
EVAL-kubernetes_audit_family = case(isnotnull('impersonatedUser.username'), "impersonated_request", objectRef.resource="serviceaccounts" AND objectRef.subresource="token", "serviceaccount_token_request", objectRef.resource="rolebindings" OR objectRef.resource="clusterrolebindings" OR objectRef.apiGroup="rbac.authorization.k8s.io", "rbac_change", objectRef.resource="secrets", "secret_access", objectRef.resource="deployments" OR objectRef.resource="daemonsets" OR objectRef.resource="statefulsets" OR objectRef.resource="pods", if(objectRef.subresource="exec", "exec_subresource", "workload_change"), responseStatus.code=403 OR responseStatus.reason="Forbidden" OR 'annotations.authorization.k8s.io/decision'="forbid", "authz_forbidden", true(), kubernetes_audit_family)
EVAL-action = verb
EVAL-signature = coalesce(objectRef.subresource, objectRef.resource)
EVAL-signature_id = auditID
EVAL-src = mvindex(sourceIPs, 0)
EVAL-src_ip = mvindex(sourceIPs, 0)
EVAL-user = user.username
EVAL-src_user = user.username
EVAL-status = coalesce(responseStatus.reason, responseStatus.status, responseStatus.code)
FIELDALIAS-k8s_marker = marker AS marker
FIELDALIAS-k8s_namespace = objectRef.namespace AS kubernetes_namespace
FIELDALIAS-k8s_resource = objectRef.resource AS kubernetes_resource
FIELDALIAS-k8s_resource_name = objectRef.name AS kubernetes_resource_name
FIELDALIAS-k8s_subresource = objectRef.subresource AS kubernetes_subresource
FIELDALIAS-k8s_audit_id = auditID AS kubernetes_audit_id
FIELDALIAS-k8s_request_uri = requestURI AS url
FIELDALIAS-k8s_user_agent = userAgent AS user_agent
FIELDALIAS-k8s_stage = stage AS audit_stage
FIELDALIAS-k8s_level = level AS audit_level
FIELDALIAS-k8s_response_code = responseStatus.code AS response_code
FIELDALIAS-k8s_authorization_decision = annotations.authorization.k8s.io/decision AS authorization_decision
FIELDALIAS-k8s_impersonated_user = impersonatedUser.username AS impersonated_user
FIELDALIAS-k8s_request_kind = requestObject.kind AS request_kind
FIELDALIAS-k8s_request_api_version = requestObject.apiVersion AS request_api_version
FIELDALIAS-k8s_token_audience = requestObject.spec.audiences{} AS token_audience
FIELDALIAS-k8s_token_expiration = requestObject.spec.expirationSeconds AS token_expiration_seconds
FIELDALIAS-k8s_bound_object_kind = requestObject.spec.boundObjectRef.kind AS bound_object_kind
FIELDALIAS-k8s_bound_object_name = requestObject.spec.boundObjectRef.name AS bound_object_name
