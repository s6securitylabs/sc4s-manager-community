# Conservative Kubernetes audit parser for SecHub Resources.
# Dedicated listener/source tag is recommended; pattern is tied to Kubernetes audit.k8s.io records.

block parser app_kubernetes_audit() {
    channel {
        if {
            filter {
                match('"apiVersion"\s*:\s*"audit\.k8s\.io/v[0-9]+"' value('MESSAGE'))
                and match('"kind"\s*:\s*"Event"' value('MESSAGE'))
                and match('"verb"\s*:' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('kubernetes') product('audit')) };
            rewrite { r_set_splunk_dest_default(index('main') sourcetype('kubernetes:audit')) };
            rewrite { set('kubernetes_audit', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
