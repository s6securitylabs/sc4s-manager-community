[vmware:esxlog:hostd]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EVAL-vendor = "vmware"
EVAL-product = "vsphere"
EVAL-vendor_product = "vmware:vsphere"
EVAL-action = coalesce(op, action)
EVAL-signature = coalesce(signature, result, "esx_host_event")
FIELDALIAS-vmware_esx_user = user AS src_user
FIELDALIAS-vmware_esx_target = target AS dest

[vmware:esxlog:vmkernel]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EVAL-vendor = "vmware"
EVAL-product = "vsphere"
EVAL-vendor_product = "vmware:vsphere"
EVAL-action = coalesce(action, "kernel_event")
EVAL-severity = case(match(_raw, "(?i)\\bWARNING\\b"), "warning", match(_raw, "(?i)\\bERROR\\b"), "error", match(_raw, "(?i)\\bNOTICE\\b"), "notice", true(), severity)
EVAL-signature = coalesce(signature, if(match(_raw, "(?i)Storage path.*APD timeout"), "Storage path APD timeout", null()))

[vmware:esxlog:sdata]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EVAL-vendor = "vmware"
EVAL-product = "vsphere"
EVAL-vendor_product = "vmware:vsphere"
EVAL-action = coalesce(action, "structured_data_event")
EVAL-signature_id = coalesce(signature_id, eventID)
EVAL-severity = case(match(_raw, "(?i)\\bWARNING\\b"), "warning", match(_raw, "(?i)\\bERROR\\b"), "error", match(_raw, "(?i)\\bNOTICE\\b"), "notice", true(), severity)
EVAL-signature = coalesce(signature, eventID, "structured_data_event")

[vmware:vclog:vpxd]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EVAL-vendor = "vmware"
EVAL-product = "vsphere"
EVAL-vendor_product = "vmware:vsphere"
EVAL-action = coalesce(op, action, "vcenter_event")
EVAL-signature = coalesce(signature, result)
FIELDALIAS-vmware_vc_user = user AS src_user
FIELDALIAS-vmware_vc_target = target AS dest

[vmware:nsxlog:dfwpktlogs]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EXTRACT-vmware_nsx_dfw_packet = INET\s+(?:match|TERM)\s+(?<vmware_nsx_raw_action>PASS|DROP|REJECT)(?:\s+SC4S_\S+)?\s+(?<rule>\S+)\s+(?<vmware_nsx_raw_direction>IN|OUT)\s+(?:\d+\s+)?(?<proto>TCP|UDP|ICMP)\s+(?:[A-Z]+\s+)?(?<src>\d{1,3}(?:\.\d{1,3}){3})/(?<sport>\d+)->(?<dst>\d{1,3}(?:\.\d{1,3}){3})/(?<dport>\d+)
EVAL-vendor = "vmware"
EVAL-product = "vsphere"
EVAL-vendor_product = "vmware:vsphere"
EVAL-action = case(vmware_nsx_raw_action="PASS", "allowed", vmware_nsx_raw_action="DROP", "blocked", vmware_nsx_raw_action="REJECT", "blocked", match(_raw, "\\bPASS\\b"), "allowed", match(_raw, "\\bDROP\\b"), "blocked", match(_raw, "\\bREJECT\\b"), "blocked", true(), coalesce(action, "firewall_packet"))
EVAL-direction = lower(vmware_nsx_raw_direction)
EVAL-signature = coalesce(signature, rule)
EVAL-signature_id = coalesce(signature_id, rule)
FIELDALIAS-vmware_nsx_src = src AS src_ip
FIELDALIAS-vmware_nsx_dest = dst AS dest_ip
FIELDALIAS-vmware_nsx_dest_common = dst AS dest
FIELDALIAS-vmware_nsx_sport = sport AS src_port
FIELDALIAS-vmware_nsx_dport = dport AS dest_port
FIELDALIAS-vmware_nsx_proto = proto AS transport
