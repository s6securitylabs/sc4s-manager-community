[vmware_vsphere_esx]
search = sourcetype=vmware:esxlog:*

[vmware_vsphere_vcenter]
search = sourcetype=vmware:vclog:*

[vmware_vsphere_vcenter_tasks]
search = sourcetype=vmware:vclog:vpxd op=TaskEvent target=* result=completed

[vmware_vsphere_vmkernel_storage_warning]
search = sourcetype=vmware:esxlog:vmkernel severity=warning signature="Storage path APD timeout"

[vmware_vsphere_structured_data]
search = sourcetype=vmware:esxlog:sdata eventID=*

[vmware_vsphere_structured_data_warning]
search = sourcetype=vmware:esxlog:sdata eventID=* severity=warning signature_id=*

[vmware_vsphere_authentication_success]
search = (sourcetype=vmware:esxlog:hostd OR sourcetype=vmware:vclog:vpxd) user=* (op=Login OR action=Login) result=success

[vmware_vsphere_nsx]
search = sourcetype=vmware:nsxlog:*

[vmware_vsphere_nsx_firewall]
search = sourcetype=vmware:nsxlog:dfwpktlogs

[vmware_vsphere_nsx_firewall_allowed]
search = sourcetype=vmware:nsxlog:dfwpktlogs rule=* (action=allowed OR vmware_nsx_raw_action=PASS OR _raw="* PASS *")

[vmware_vsphere_nsx_firewall_blocked]
search = sourcetype=vmware:nsxlog:dfwpktlogs rule=* (action=blocked OR vmware_nsx_raw_action=DROP OR vmware_nsx_raw_action=REJECT OR _raw="* DROP *" OR _raw="* REJECT *")
