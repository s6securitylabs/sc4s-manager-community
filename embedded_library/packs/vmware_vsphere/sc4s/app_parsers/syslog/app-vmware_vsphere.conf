# VMware vSphere / ESXi / vCenter dedicated-listener parser.
# Grounded in upstream SC4S v3.43.0 VMware vSphere routing semantics but kept
# conservative: no default drops, no lossy reduction, and no multiline grouping
# unless the operator explicitly enables and validates upstream options.

filter sechub_resources_vmware_vsphere_esx_programs {
    program("hostd", type(string) flags(ignore-case,prefix))
    or program("vmkernel", type(string) flags(ignore-case,prefix))
    or program("vpxa", type(string) flags(ignore-case,prefix))
    or program("vobd", type(string) flags(ignore-case,prefix))
    or program("vmauthd", type(string) flags(ignore-case,prefix));
};

filter sechub_resources_vmware_vsphere_vcenter_programs {
    program("vpxd", type(string) flags(ignore-case,prefix))
    or program("vcenter-server", type(string) flags(ignore-case,prefix))
    or program("applmgmt", type(string) flags(ignore-case,prefix))
    or program("sso", type(string) flags(ignore-case,prefix));
};

filter sechub_resources_vmware_vsphere_nsx_programs {
    program("nsx", type(string) flags(ignore-case,prefix))
    or program("dfwpktlogs", type(string) flags(ignore-case));
};

filter sechub_resources_vmware_vsphere_sdata {
    match('[Originator@6876' value('SDATA') type(string))
    or message('[Originator@6876' type(string) flags(substring));
};

block parser app-vmware_vsphere() {
    channel {
        rewrite {
            r_set_splunk_dest_default(
                index('infraops')
                source('vmware:esxlog:$(lowercase ${PROGRAM})')
                sourcetype('vmware:esxlog:$(lowercase ${PROGRAM})')
                vendor('vmware')
                product('vsphere')
                template('t_5424_hdr_sdata_compact')
            );
        };
        rewrite { r_set_source_identified() };
        rewrite {
            r_set_splunk_dest_update(
                source('vmware:vclog:$(lowercase ${PROGRAM})')
                sourcetype('vmware:vclog:$(lowercase ${PROGRAM})')
                class('vc')
                condition(filter(sechub_resources_vmware_vsphere_vcenter_programs))
            );
        };
        rewrite {
            r_set_splunk_dest_update(
                source('vmware:nsxlog:$(lowercase ${PROGRAM})')
                sourcetype('vmware:nsxlog:$(lowercase ${PROGRAM})')
                class('nsx')
                condition(filter(sechub_resources_vmware_vsphere_nsx_programs))
            );
        };
        rewrite {
            r_set_splunk_dest_update(
                index('netfw')
                source('vmware:nsxlog:dfwpktlogs')
                sourcetype('vmware:nsxlog:dfwpktlogs')
                class('nsxfw')
                condition(program('dfwpktlogs', type(string) flags(ignore-case)))
            );
        };
        rewrite {
            r_set_splunk_dest_update(
                source('vmware:esxlog:sdata')
                sourcetype('vmware:esxlog:sdata')
                class('esx')
                condition(filter(sechub_resources_vmware_vsphere_sdata))
            );
        };
    };
};

application app-vmware_vsphere[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_VMWARE_VSPHERE")
            or tags(".source.s_VMWARE_VCENTER")
            or tags(".source.s_VMWARE_ESX")
            or "${.netsource.sc4s_vendor_product}" eq "vmware_vsphere"
            or "${.netsource.sc4s_vendor_product}" eq "vmware_vcenter"
            or "${.netsource.sc4s_vendor_product}" eq "vmware_esx"
            or filter(sechub_resources_vmware_vsphere_esx_programs)
            or filter(sechub_resources_vmware_vsphere_vcenter_programs)
            or filter(sechub_resources_vmware_vsphere_nsx_programs)
            or filter(sechub_resources_vmware_vsphere_sdata)
        )
    };
    parser { app-vmware_vsphere(); };
};
