application app-ubiquiti_unifi_firewall[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_UBIQUITI_UNIFI") or "${.netsource.sc4s_vendor_product}" eq "ubiquiti") and message('firewall event') }; parser { app-ubiquiti_unifi_firewall(); }; };
