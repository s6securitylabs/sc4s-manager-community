# Ubiquiti UniFi network telemetry syslog relay routing. Conservative synthetic-equivalent matching only.
block parser app-ubiquiti_unifi_firewall() { channel { rewrite { r_set_splunk_dest_default(index('netops') sourcetype('ubiquiti:unifi:firewall') vendor('ubiquiti') product('unifi') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('infra')); }; }; };
block parser app-ubiquiti_unifi_client() { channel { rewrite { r_set_splunk_dest_default(index('netops') sourcetype('ubiquiti:unifi:client') vendor('ubiquiti') product('unifi') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('infra')); }; }; };
