[ubiquiti:unifi:firewall]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
EXTRACT-marker = marker=(?<marker>SC4S_UNIFI_TEST_[A-Z0-9_]+_\d{3})
EVAL-vendor = "ubiquiti"
EVAL-product = "unifi"
EVAL-vendor_product = "ubiquiti:unifi"
EXTRACT-unifi_firewall = action=(?<action>\w+) rule="(?<rule>[^"]+)" src=(?<src>\S+) dst=(?<dst>\S+) proto=(?<protocol>\w+) dpt=(?<dest_port>\d+)
EVAL-result=action

[ubiquiti:unifi:client]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
EXTRACT-marker = marker=(?<marker>SC4S_UNIFI_TEST_[A-Z0-9_]+_\d{3})
EVAL-vendor = "ubiquiti"
EVAL-product = "unifi"
EVAL-vendor_product = "ubiquiti:unifi"
EXTRACT-unifi_client = client (?<action>connected|disconnected) user="(?<client>[^"]+)" mac=(?<mac>\S+) ap="(?<ap>[^"]+)" ssid="(?<ssid>[^"]+)"
EVAL-result=action

[ubiquiti:unifi:admin]
SHOULD_LINEMERGE = false
