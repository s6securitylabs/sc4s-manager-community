# Conservative Microsoft Sysmon for Linux parser for SecHub Resources.
# Dedicated source/listener to avoid hijacking generic Linux syslog XML.

block parser app_linux_sysmon() {
    channel {
        if {
            filter { match('<Provider Name="Linux-Sysmon"' value('MESSAGE')) and match('<EventID>1</EventID>' value('MESSAGE')); };
            parser { app-parser-template(vendor('microsoft') product('linux_sysmon')) };
            rewrite { r_set_splunk_dest_default(index('osnix') sourcetype('linux:sysmon:process')) };
            rewrite { set('linux_sysmon', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        } elif {
