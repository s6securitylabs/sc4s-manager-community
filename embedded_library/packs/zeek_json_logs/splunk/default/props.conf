[zeek:json]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "ts"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6NZ
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-vendor = "zeek"
EVAL-product = "json_logs"
EVAL-vendor_product = "zeek:json_logs"
EVAL-zeek_log_type = coalesce(log_type, if(isnotnull(conn_state), "conn", if(isnotnull(query), "dns", if(isnotnull(method), "http", if(isnotnull(server_name), "ssl", if(isnotnull(note), "notice", if(isnotnull(filename), "files", if(isnotnull('certificate.subject'), "x509", if(isnotnull(auth_success), "ssh", if(isnotnull(client_addr) OR isnotnull(assigned_addr), "dhcp", if(isnotnull(cookie) OR isnotnull(security_protocol), "rdp", if(isnotnull(name) AND isnotnull(addl), "weird", if(isnotnull(software_type) OR isnotnull(unparsed_version), "software", if(isnotnull('seen.indicator'), "intel", if(isnotnull(host), "known_hosts", null()))))))))))))))
EVAL-src_ip = coalesce('id.orig_h', src, client_addr, mvindex(tx_hosts, 0), if(zeek_log_type="known_hosts" OR zeek_log_type="software", host, null()))
EVAL-src = src_ip
EVAL-src_port = coalesce('id.orig_p', p, client_port, host_p)
EVAL-dest_ip = coalesce('id.resp_h', dst, server_addr, assigned_addr, mvindex(rx_hosts, 0))
EVAL-dest = dest_ip
EVAL-dest_port = coalesce('id.resp_p', p, server_port)
EVAL-transport = coalesce(upper(proto), if(zeek_log_type="dhcp", "UDP", if(zeek_log_type="rdp" OR zeek_log_type="intel", "TCP", null())))
EVAL-intel_indicator = 'seen.indicator'
EVAL-intel_indicator_type = 'seen.indicator_type'
EVAL-intel_seen_where = 'seen.where'
EVAL-intel_matched_types = matched
EVAL-intel_sources = sources
EVAL-smtp_helo = helo
EVAL-smtp_mailfrom = mailfrom
EVAL-smtp_rcptto = rcptto
EVAL-smtp_subject = subject
EVAL-smtp_last_reply = last_reply
EVAL-action = coalesce(conn_state, method, note, result, name, software_type, intel_indicator_type, if(zeek_log_type="smtp", last_reply, if(zeek_log_type="dhcp", mvindex(msg_types, -1), if(zeek_log_type="ssh", if(auth_success="true" OR auth_success=1, "auth_success", "auth_failure"), zeek_log_type))))
EVAL-signature = coalesce(note, msg, query, server_name, filename, 'certificate.subject', client, host_name, result, name, unparsed_version, intel_indicator, subject, host, conn_state)
EVAL-signature_id = coalesce(uid, fuid, id, mvindex(uids, 0), identifier, intel_indicator, host)
EVAL-dns_query = query
EVAL-dns_query_type = qtype_name
EVAL-http_method = method
EVAL-http_status = status_code
EVAL-url = uri
EVAL-tls_sni = server_name
EVAL-tls_version = version
EVAL-bytes_in = resp_bytes
EVAL-bytes_out = orig_bytes
EVAL-file_id = fuid
EVAL-file_name = filename
EVAL-file_mime_type = mime_type
EVAL-file_seen_bytes = seen_bytes
EVAL-file_total_bytes = total_bytes
EVAL-file_md5 = md5
EVAL-x509_id = id
EVAL-x509_subject = 'certificate.subject'
EVAL-x509_issuer = 'certificate.issuer'
EVAL-x509_serial = 'certificate.serial'
EVAL-x509_not_valid_before = 'certificate.not_valid_before'
EVAL-x509_not_valid_after = 'certificate.not_valid_after'
EVAL-ssh_auth_success = auth_success
EVAL-ssh_client = client
EVAL-ssh_server = server
EVAL-ssh_cipher_alg = cipher_alg
EVAL-ssh_host_key_alg = host_key_alg
EVAL-dhcp_client_addr = client_addr
EVAL-dhcp_server_addr = server_addr
EVAL-dhcp_mac = mac
EVAL-dhcp_host_name = host_name
EVAL-dhcp_assigned_addr = assigned_addr
EVAL-dhcp_msg_types = msg_types
EVAL-rdp_cookie = cookie
EVAL-rdp_result = result
EVAL-rdp_security_protocol = security_protocol
EVAL-rdp_client_name = client_name
EVAL-weird_name = if(zeek_log_type="weird", name, null())
EVAL-weird_addl = addl
EVAL-weird_notice = notice
EVAL-weird_source = source
EVAL-software_host = if(zeek_log_type="software", host, null())
EVAL-software_port = host_p
EVAL-software_type = software_type
EVAL-software_name = if(zeek_log_type="software", name, null())
EVAL-software_version = coalesce(unparsed_version, tostring('version.major'))
EVAL-known_host = if(zeek_log_type="known_hosts", host, null())
FIELDALIAS-zeek_marker = marker AS marker
FIELDALIAS-zeek_uid = uid AS uid
