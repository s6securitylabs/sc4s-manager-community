# Conservative Zeek JSON log parser for SecHub Resources.
# Match only JSON records that carry Zeek-style ts plus uid/fuid/id/uids
# identifiers and either log_type or stable Zeek family-specific fields from documented base log records.

block parser app_zeek_json_logs() {
    channel {
        if {
            filter {
                match('"ts"\s*:\s*"' value('MESSAGE'))
                and (
                    match('"uid"\s*:\s*"' value('MESSAGE'))
                    or match('"fuid"\s*:\s*"' value('MESSAGE'))
                    or match('"id"\s*:\s*"' value('MESSAGE'))
                    or match('"uids"\s*:\s*\[' value('MESSAGE'))
                    or match('"log_type"\s*:\s*"(software|known_hosts|intel|smtp)"' value('MESSAGE'))
                )
                and (
                    match('"log_type"\s*:\s*"(conn|dns|http|ssl|notice|files|x509|ssh|dhcp|rdp|weird|software|known_hosts|intel|smtp)"' value('MESSAGE'))
                    or match('"conn_state"\s*:' value('MESSAGE'))
                    or match('"query"\s*:' value('MESSAGE'))
                    or match('"method"\s*:' value('MESSAGE'))
                    or match('"server_name"\s*:' value('MESSAGE'))
                    or match('"note"\s*:' value('MESSAGE'))
                    or match('"auth_success"\s*:' value('MESSAGE'))
                    or match('"client_addr"\s*:' value('MESSAGE'))
                    or match('"assigned_addr"\s*:' value('MESSAGE'))
                    or match('"security_protocol"\s*:' value('MESSAGE'))
                    or match('"cookie"\s*:' value('MESSAGE'))
                );
            };
            parser { app-parser-template(vendor('zeek') product('json_logs')) };
            rewrite { r_set_splunk_dest_default(index('netids') sourcetype('zeek:json')) };
            rewrite { set('zeek_json_logs', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
