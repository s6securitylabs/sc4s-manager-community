[sc4s_crowdstrike_falcon_fdr_process]
search = sourcetype="crowdstrike:falcon:fdr:process" vendor="CrowdStrike" product="falcon_platform_json_relay" (crowdstrike_event_simpleName="ProcessRollup2" OR crowdstrike_event_simpleName="EndOfProcess")

[sc4s_crowdstrike_falcon_fdr_network]
search = sourcetype="crowdstrike:falcon:fdr:network" vendor="CrowdStrike" product="falcon_platform_json_relay" (crowdstrike_event_simpleName="NetworkConnectIP4" OR crowdstrike_event_simpleName="NetworkListenIP4" OR crowdstrike_event_simpleName="NetworkReceiveAcceptIP4")

[sc4s_crowdstrike_falcon_fdr_dns]
search = sourcetype="crowdstrike:falcon:fdr:dns" vendor="CrowdStrike" product="falcon_platform_json_relay" (crowdstrike_event_simpleName="DnsRequest" OR crowdstrike_event_simpleName="SuspiciousDnsRequest")

[sc4s_crowdstrike_falcon_fdr_file]
search = sourcetype="crowdstrike:falcon:fdr:file" vendor="CrowdStrike" product="falcon_platform_json_relay" (crowdstrike_event_simpleName="NewExecutableWritten" OR crowdstrike_event_simpleName="ExecutableDeleted" OR crowdstrike_event_simpleName="OoxmlFileWritten" OR crowdstrike_event_simpleName="PdfFileWritten" OR crowdstrike_event_simpleName="NewScriptWritten" OR crowdstrike_event_simpleName="CriticalFileAccessed")

[sc4s_crowdstrike_falcon_fdr_asset]
search = sourcetype="crowdstrike:falcon:fdr:asset" vendor="CrowdStrike" product="falcon_platform_json_relay" (crowdstrike_event_simpleName="SensorHeartbeat" OR crowdstrike_event_simpleName="UserIdentity" OR crowdstrike_event_simpleName="ConfigStateUpdate")

[sc4s_crowdstrike_falcon_api_devices]
search = sourcetype="crowdstrike:falcon:api:devices" vendor="CrowdStrike" product="falcon_platform_json_relay" device_id=* agent_version=*

[sc4s_crowdstrike_falcon_api_spotlight]
search = sourcetype="crowdstrike:falcon:api:spotlight" vendor="CrowdStrike" product="falcon_platform_json_relay" vulnerability_id=*

[sc4s_crowdstrike_falcon_eventstream_audit]
search = sourcetype="crowdstrike:falcon:eventstream:audit" vendor="CrowdStrike" product="falcon_platform_json_relay" (crowdstrike_event_simpleName="AuthActivityAuditEvent" OR crowdstrike_event_simpleName="UserActivityAuditEvent")

[sc4s_crowdstrike_falcon_eventstream_rtr]
search = sourcetype="crowdstrike:falcon:eventstream:rtr" vendor="CrowdStrike" product="falcon_platform_json_relay" (crowdstrike_event_simpleName="RemoteResponseSessionStartEvent" OR crowdstrike_event_simpleName="RemoteResponseSessionEndEvent")

[sc4s_crowdstrike_falcon_api_intel]
search = sourcetype="crowdstrike:falcon:api:intel" vendor="CrowdStrike" product="falcon_platform_json_relay" indicator_value=* indicator_type=*

[sc4s_crowdstrike_falcon_eventstream_identity]
search = sourcetype="crowdstrike:falcon:eventstream:identity" vendor="CrowdStrike" product="falcon_platform_json_relay" (crowdstrike_event_simpleName="IdentityProtectionEvent" OR crowdstrike_event_simpleName="IdpDetectionSummaryEvent")

[sc4s_crowdstrike_falcon_eventstream_detection]
search = sourcetype="crowdstrike:falcon:eventstream:detection" vendor="CrowdStrike" product="falcon_platform_json_relay" (crowdstrike_event_simpleName="DetectionSummaryEvent" OR crowdstrike_event_simpleName="EppDetectionSummaryEvent" OR crowdstrike_event_simpleName="DataProtectionDetectionSummaryEvent")

[sc4s_crowdstrike_falcon_eventstream_policy]
search = sourcetype="crowdstrike:falcon:eventstream:policy" vendor="CrowdStrike" product="falcon_platform_json_relay" crowdstrike_event_simpleName="FirewallMatchEvent"
