# Conservative Hermes Agent / OpenClaw audit JSON relay parser for SecHub Resources.
# Match only normalized audit JSON records; collectors own credential and channel state.

block parser app_legacy_openclaw_audit() {
    channel {
        if {
            filter {
                match('\"event\.dataset\"\s*:\s*\"hermes\.openclaw\.audit\"' value('MESSAGE'))
                or (match('\"component\"\s*:\s*\"(hermes|hermes-gateway|hermes-agent|openclaw)' value('MESSAGE'))
                    and match('\"event\.action\"\s*:' value('MESSAGE')));
            };
            parser { app-parser-template(vendor('nousresearch') product('legacy_openclaw_audit')) };
            rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('openclaw:legacy:audit')) };
            rewrite { set('legacy_openclaw_audit', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
