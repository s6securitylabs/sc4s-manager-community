[openclaw:legacy:audit]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%z
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = coalesce(vendor, "nousresearch")
EVAL-product = coalesce(product, "legacy_openclaw_audit")
EVAL-vendor_product = "openclaw:legacy_openclaw"
EVAL-event_action = coalesce('event.action', action)
EVAL-action = event_action
EVAL-hermes_openclaw_family = case(match(event_action, "(?i)(login|logout|session|oauth|sso|auth)"), "identity_session", match(event_action, "(?i)(channel|handoff|delivery|telegram|slack|signal|webhook)"), "gateway_channel", match(event_action, "(?i)(cutover|migration|dual_polling|gateway_port|owner_allowlist|require_mention|command_logger|session_memory|openclaw)"), "legacy_cutover_runtime", match(event_action, "(?i)(tool|terminal|browser|file|cron|process|delegate)"), "tool_execution", match(event_action, "(?i)(credential|token|secret|provider|model|api_key)"), "credential_secret", match(event_action, "(?i)(config|profile|skill|plugin|cron|admin)"), "admin_config", match(event_action, "(?i)(safety|policy|blocked|prompt_injection|permission|approval)"), "safety_policy", true(), "audit")
EVAL-event_id = coalesce('event.id', id, trace_id, request_id)
EVAL-actor_user = coalesce('actor.user.name', 'user.name', user, actor)
EVAL-user = actor_user
EVAL-src_user = actor_user
EVAL-target_user = coalesce('target.user.name', target_user)
EVAL-src_ip = coalesce('client.ip', src_ip, 'source.ip', ip)
EVAL-src = src_ip
EVAL-user_agent = coalesce('user_agent.original', user_agent, 'http.user_agent')
EVAL-platform = coalesce('channel.platform', platform)
EVAL-channel_id = coalesce('channel.id', channel_id)
EVAL-thread_id = coalesce('channel.thread_id', thread_id)
EVAL-object = coalesce('object.name', object, channel_id, tool_name)
EVAL-object_type = coalesce('object.type', object_type)
EVAL-tool_name = coalesce('tool.name', tool_name)
EVAL-tool_result = coalesce('tool.result', tool_result, result)
EVAL-provider = coalesce('ai.provider', provider)
EVAL-model = coalesce('ai.model', model)
EVAL-policy_decision = coalesce('policy.decision', policy_decision)
EVAL-risk_reason = coalesce('risk.reason', risk_reason, reason)
EVAL-signature = coalesce(event_action, risk_reason)
EVAL-signature_id = coalesce(event_id, trace_id, request_id, marker)
FIELDALIAS-hermes_marker = marker AS marker
EVAL-runtime = coalesce(runtime, component)
EVAL-legacy_component = coalesce('legacy.component', legacy_component)
EVAL-gateway_port = coalesce('gateway.port', gateway_port)
EVAL-gateway_bind = coalesce('gateway.bind', gateway_bind)
EVAL-owner_allowlist_state = coalesce('owner_allowlist.state', owner_allowlist_state)
EVAL-require_mention = coalesce('channel.require_mention', require_mention)
EVAL-dual_polling_risk = coalesce('migration.dual_polling_risk', dual_polling_risk)
EVAL-migration_phase = coalesce('migration.phase', migration_phase)
EVAL-hook_name = coalesce('hook.name', hook_name)
