# Check Point Log Exporter SecHub Resources profile parser.
# Conservative extension of upstream SC4S checkpoint_syslog behavior for RFC5424
# structured-data records beginning with [sc4s@2620 ...]. Preserves _raw.
block parser app-checkpoint_log_exporter() {
    channel {
        # Keep the timezone-qualified RFC5424 header as the primary timestamp in this
        # curated pack. The Check Point structured-data `time` value is retained in
        # _raw/Splunk fields for reviewer read-back until live Check Point replay
        # proves whether it should override the header timestamp.
        rewrite {
            set("${.SDATA.sc4s@2620.hostname}" value("HOST") condition("${.SDATA.sc4s@2620.hostname}" ne ""));
            set("checkpoint", value("fields.vendor"));
            set("log-exporter", value("fields.product"));
            r_set_splunk_dest_default(
                index('netfw')
                sourcetype('cp_log:syslog')
                vendor('checkpoint')
                product('log-exporter')
                template('t_5424_hdr_sdata_compact')
            );
        };
    };
};
application app-checkpoint_log_exporter[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_CHECKPOINT_LOG_EXPORTER")
            or "${.netsource.sc4s_vendor_product}" eq "checkpoint_log_exporter"
            or match("checkpoint", value('.netsource.sc4s_vendor'), type(string))
            or match("\[sc4s@2620 .*action=", value("MESSAGE"), flags(ignore-case))
        );
    };
    parser { app-checkpoint_log_exporter(); };
};
