[checkpoint_log_exporter]
search = sourcetype=cp_log:syslog vendor="Check Point" product="Log Exporter"

[checkpoint_log_exporter_network]
search = sourcetype=cp_log:syslog (src=* OR dst=* OR service=*)

[checkpoint_log_exporter_firewall_drop]
search = sourcetype=cp_log:syslog action=drop blade=Firewall

[checkpoint_log_exporter_ips]
search = sourcetype=cp_log:syslog product=IPS (protection_name=* OR attack=*)

[checkpoint_log_exporter_audit]
search = sourcetype=cp_log:syslog (product=SmartConsole OR blade=Audit OR administrator=*)

[checkpoint_log_exporter_email_security]
search = sourcetype=cp_log:syslog (product="Anti Phishing" OR blade=Email OR ifname=MTA)
