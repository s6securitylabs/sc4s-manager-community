[cp_log:syslog]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
TIME_PREFIX = ^<\d+>\d\s+
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
MAX_TIMESTAMP_LOOKAHEAD = 35
KV_MODE = auto
EVAL-vendor = "Check Point"
EVAL-product = "Log Exporter"
EVAL-vendor_product = "checkpoint:log-exporter"
EVAL-vendor_raw_action = action
EVAL-action = lower(action)
EVAL-src_ip = coalesce(src_ip, src, client_ip)
EVAL-dest_ip = coalesce(dest_ip, dst)
EVAL-dest_port = coalesce(dest_port, service)
EVAL-src_port = coalesce(src_port, s_port)
FIELDALIAS-checkpoint-proto = proto AS transport
FIELDALIAS-checkpoint-rule = rule_name AS signature
EVAL-signature_id = coalesce(rule_uid, protection_id, layer_uuid, loguid)
EVAL-signature = coalesce(rule_name, protection_name, blade, attack, action)
EVAL-user = coalesce(user, administrator)
