# QNAP NAS qulogd parser. Conservative dedicated-listener/source-tag routing only.
block parser app-qnap_nas_event() {
    channel {
        parser {
            regexp-parser(
                prefix(".tmp.qnap_nas.")
                patterns('qulogd\[[0-9]+\]: event log: Users: (?<user>[^,]+), Source IP: (?<src>[^,]+), Computer name: (?<computer_name>[^,]+), Application: (?<application>[^,]+), Category: (?<category>[^,]+), Content: (?<content>.*)$')
            );
        };
        rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('qnap:nas:event') vendor('qnap') product('nas') template('t_hdr_msg')); };
        rewrite { r_set_splunk_dest_update_v2(class('event_log')); };
    };
};

block parser app-qnap_nas_conn() {
    channel {
        parser {
            regexp-parser(
                prefix(".tmp.qnap_nas.")
                patterns('qulogd\[[0-9]+\]: conn log: Users: (?<user>[^,]+), Source IP: (?<src>[^,]+), Computer name: (?<computer_name>[^,]+), Connection type: (?<connection_type>[^,]+), Accessed resources: (?<resource>[^,]+), Action: (?<action>.*)$')
            );
        };
        rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('qnap:nas:conn') vendor('qnap') product('nas') template('t_hdr_msg')); };
        rewrite { r_set_splunk_dest_update_v2(class('conn_log')); };
    };
};

application app-qnap_nas_event[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (tags(".source.s_QNAP_NAS") or "${.netsource.sc4s_vendor_product}" eq "qnap_nas")
        and message("qulogd[") and message("event log: Users:")
    };
    parser { app-qnap_nas_event(); };
};

application app-qnap_nas_conn[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (tags(".source.s_QNAP_NAS") or "${.netsource.sc4s_vendor_product}" eq "qnap_nas")
        and message("qulogd[") and message("conn log: Users:")
    };
    parser { app-qnap_nas_conn(); };
};
