[qnap:nas:event]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
TIME_PREFIX = ^<\d+>
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 16
KV_MODE = none
EVAL-vendor = "QNAP"
EVAL-product = "NAS"
EVAL-vendor_product = "qnap:nas"
EXTRACT-qnap_event_fields = qulogd\[\d+\]:\s+event log:\s+Users:\s+(?<user>[^,]+),\s+Source IP:\s+(?<src>[^,]+),\s+Computer name:\s+(?<qnap_computer_name>[^,]+),\s+Application:\s+(?<qnap_application>[^,]+),\s+Category:\s+(?<qnap_category>[^,]+),\s+Content:\s+(?<message>.*)$
EVAL-action = lower(coalesce(action, qnap_category))
EVAL-signature = coalesce(qnap_category, qnap_application, "qnap_event")
EVAL-signature_id = signature

[qnap:nas:conn]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
TIME_PREFIX = ^<\d+>
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 16
KV_MODE = none
EVAL-vendor = "QNAP"
EVAL-product = "NAS"
EVAL-vendor_product = "qnap:nas"
EXTRACT-qnap_conn_fields = qulogd\[\d+\]:\s+conn log:\s+Users:\s+(?<user>[^,]+),\s+Source IP:\s+(?<src>[^,]+),\s+Computer name:\s+(?<qnap_computer_name>[^,]+),\s+Connection type:\s+(?<qnap_connection_type>[^,]+),\s+Accessed resources:\s+(?<qnap_resource>[^,]+),\s+Action:\s+(?<action>.*)$
EVAL-action = lower(replace(action, "\s+", "_"))
EVAL-signature = coalesce(action, qnap_connection_type, "qnap_conn")
EVAL-signature_id = signature
