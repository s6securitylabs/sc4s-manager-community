# Conservative Suricata EVE JSON parser for SecHub Resources.
# Match only EVE JSON records that carry event_type plus stable Suricata network tuple/context fields.

block parser app_suricata_eve_json() {
    channel {
        if {
            filter {
                match('"event_type"\s*:\s*"(alert|dns|http|tls|flow|fileinfo|anomaly|ssh|dhcp|rdp|ftp|krb5|smb|mqtt|http2|pgsql|netflow|arp|ike|modbus|quic|pop3)"' value('MESSAGE'))
                and match('"src_ip"\s*:' value('MESSAGE'))
                and match('"dest_ip"\s*:' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('suricata') product('eve_json')) };
            rewrite { r_set_splunk_dest_default(index('netids') sourcetype('suricata:eve')) };
            rewrite { set('suricata_eve_json', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
