[suricata:eve]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%z
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-vendor = "suricata"
EVAL-product = "eve_json"
EVAL-vendor_product = "suricata:eve_json"
EVAL-suricata_eve_family = event_type
EVAL-action = coalesce(alert.action, flow.action, event_type)
EVAL-signature = coalesce(alert.signature, dns.rrname, http.hostname, tls.sni, fileinfo.filename, anomaly.event, ssh.client.software_version, dhcp.hostname, dhcp.assigned_ip, rdp.event_type, rdp.protocol, ftp.command_data, ftp.command, krb5.sname, krb5.cname, smb.filename, smb.command, mqtt.publish.topic, http2_path, http2_authority, pgsql.response.command_completed, pgsql.request.simple_query, netflow.bytes, flow.reason, arp.opcode, ike.exchange_type_verbose, ike.init_spi, modbus.request.function_code, modbus.response.function_code, quic.ja4, quic.sni, quic.ja3.hash, pop3.request.command, pop3.response.status, event_type)
EVAL-signature_id = coalesce(alert.signature_id, fileinfo.tx_id, dhcp.id, rdp.tx_id, smb.id, mqtt.publish.message_id, pgsql.tx_id, modbus.id, quic.ja4, quic.ja3.hash, pop3.request.command, flow_id)
EXTRACT-suricata_http2_authority = \"name\"\s*:\s*\":authority\"\s*,\s*\"value\"\s*:\s*\"(?<http2_authority>[^\"]+)\"
EXTRACT-suricata_http2_method = \"name\"\s*:\s*\":method\"\s*,\s*\"value\"\s*:\s*\"(?<http2_method>[^\"]+)\"
EXTRACT-suricata_http2_path = \"name\"\s*:\s*\":path\"\s*,\s*\"value\"\s*:\s*\"(?<http2_path>[^\"]+)\"
EXTRACT-suricata_http2_status = \"name\"\s*:\s*\":status\"\s*,\s*\"value\"\s*:\s*\"(?<http2_status>[^\"]+)\"
EXTRACT-suricata_http2_user_agent = \"name\"\s*:\s*\"user-agent\"\s*,\s*\"value\"\s*:\s*\"(?<http2_user_agent>[^\"]+)\"
EVAL-src = src_ip
EVAL-dest = dest_ip
EVAL-transport = upper(proto)
EVAL-url = http.url
EVAL-http_method = http.http_method
EVAL-http_status = http.status
EVAL-dns_query = dns.rrname
EVAL-dns_query_type = dns.rrtype
EVAL-tls_sni = tls.sni
EVAL-tls_version = tls.version
EVAL-severity = alert.severity
EVAL-bytes_in = flow.bytes_toclient
EVAL-bytes_out = flow.bytes_toserver
EVAL-file_name = fileinfo.filename
EVAL-file_state = fileinfo.state
EVAL-file_size = fileinfo.size
EVAL-anomaly_type = anomaly.type
EVAL-anomaly_event = anomaly.event
EVAL-ssh_client_software = ssh.client.software_version
EVAL-ssh_server_software = ssh.server.software_version
EVAL-ssh_client_hassh = ssh.client.hassh.hash
EVAL-ssh_server_hassh = ssh.server.hassh.hash
EVAL-dhcp_type = coalesce(dhcp.dhcp_type, dhcp.type)
EVAL-dhcp_client_mac = dhcp.client_mac
EVAL-dhcp_assigned_ip = dhcp.assigned_ip
EVAL-dhcp_requested_ip = dhcp.requested_ip
EVAL-dhcp_hostname = dhcp.hostname
EVAL-dhcp_lease_time = dhcp.lease_time
EVAL-rdp_tx_id = rdp.tx_id
EVAL-rdp_type = rdp.event_type
EVAL-rdp_protocol = rdp.protocol
EVAL-rdp_cookie = rdp.cookie
EVAL-rdp_client_name = rdp.client.client_name
EVAL-ftp_command = ftp.command
EVAL-ftp_command_data = ftp.command_data
EVAL-ftp_completion_code = ftp.completion_code
EVAL-ftp_reply = ftp.reply
EVAL-krb5_msg_type = krb5.msg_type
EVAL-krb5_client = krb5.cname
EVAL-krb5_service = krb5.sname
EVAL-krb5_realm = krb5.realm
EVAL-krb5_encryption = krb5.encryption
EVAL-krb5_error_code = krb5.error_code
EVAL-smb_command = smb.command
EVAL-smb_status = smb.status
EVAL-smb_status_code = smb.status_code
EVAL-smb_filename = smb.filename
EVAL-smb_share = smb.share
EVAL-smb_share_type = smb.share_type
EVAL-mqtt_topic = mqtt.publish.topic
EVAL-mqtt_message_id = mqtt.publish.message_id
EVAL-mqtt_qos = mqtt.publish.qos
EVAL-mqtt_retain = mqtt.publish.retain
EVAL-mqtt_client_id = mqtt.connect.client_id
EVAL-pgsql_tx_id = pgsql.tx_id
EVAL-pgsql_query = pgsql.request.simple_query
EVAL-pgsql_command_completed = pgsql.response.command_completed
EVAL-pgsql_data_rows = pgsql.response.data_rows
EVAL-pgsql_data_size = pgsql.response.data_size
EVAL-netflow_pkts = netflow.pkts
EVAL-netflow_bytes = netflow.bytes
EVAL-netflow_age = netflow.age
EVAL-netflow_min_ttl = netflow.min_ttl
EVAL-netflow_max_ttl = netflow.max_ttl
EVAL-arp_hw_type = arp.hw_type
EVAL-arp_proto_type = arp.proto_type
EVAL-arp_opcode = arp.opcode
EVAL-arp_src_mac = arp.src_mac
EVAL-arp_dest_mac = arp.dest_mac
EVAL-ike_init_spi = ike.init_spi
EVAL-ike_resp_spi = ike.resp_spi
EVAL-ike_version_major = ike.version_major
EVAL-ike_version_minor = ike.version_minor
EVAL-ike_exchange_type = ike.exchange_type
EVAL-ike_exchange_type_verbose = ike.exchange_type_verbose
EVAL-ike_alg_enc = ike.alg_enc
EVAL-ike_alg_hash = ike.alg_hash
EVAL-ike_alg_auth = ike.alg_auth
EVAL-ike_alg_dh = ike.alg_dh
EVAL-modbus_id = modbus.id
EVAL-modbus_request_function = modbus.request.function_code
EVAL-modbus_response_function = modbus.response.function_code
EVAL-modbus_access_type = coalesce(modbus.request.access_type, modbus.response.access_type)
EVAL-modbus_category = coalesce(modbus.request.category, modbus.response.category)
EVAL-modbus_error_flags = coalesce(modbus.response.error_flags, modbus.request.error_flags)
EVAL-modbus_unit_id = modbus.request.unit_id
EVAL-modbus_transaction_id = modbus.request.transaction_id
EVAL-quic_version = quic.version
EVAL-quic_sni = quic.sni
EVAL-quic_ja3_hash = quic.ja3.hash
EVAL-quic_ja3_string = quic.ja3.string
EVAL-quic_ja3s_hash = quic.ja3s.hash
EVAL-quic_ja3s_string = quic.ja3s.string
EVAL-quic_ja4 = quic.ja4
EXTRACT-suricata_quic_cyu_hash = \"cyu\"\s*:\s*\[\s*\{[^}]*\"hash\"\s*:\s*\"(?<quic_cyu_hash>[^\"]+)\"
EXTRACT-suricata_quic_cyu_string = \"cyu\"\s*:\s*\[\s*\{[^}]*\"string\"\s*:\s*\"(?<quic_cyu_string>[^\"]+)\"
EVAL-pop3_command = pop3.request.command
EVAL-pop3_args = pop3.request.args
EVAL-pop3_success = pop3.response.success
EVAL-pop3_status = pop3.response.status
EVAL-pop3_header = pop3.response.header
FIELDALIAS-suricata_marker = marker AS marker
FIELDALIAS-suricata_src_port = src_port AS src_port
FIELDALIAS-suricata_dest_port = dest_port AS dest_port
FIELDALIAS-suricata_app_proto = app_proto AS app
