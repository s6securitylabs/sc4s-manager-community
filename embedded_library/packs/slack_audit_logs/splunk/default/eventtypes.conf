[slack_audit_user_session]
search = sourcetype="slack:audit" vendor=slack product=audit_logs slack_audit_family="user_session" action=*

[slack_audit_anomaly]
search = sourcetype="slack:audit" vendor=slack product=audit_logs slack_audit_family="anomaly" reason=*

[slack_audit_app_security]
search = sourcetype="slack:audit" vendor=slack product=audit_logs slack_audit_family="app_security" action=app_*

[slack_audit_file_security]
search = sourcetype="slack:audit" vendor=slack product=audit_logs slack_audit_family="file_security" action=file_*

[slack_audit_workspace_admin]
search = sourcetype="slack:audit" vendor=slack product=audit_logs slack_audit_family="workspace_admin" action=workspace_*

[slack_audit_user_admin_role]
search = sourcetype="slack:audit" vendor=slack product=audit_logs slack_audit_family="user_admin_role" action=user_role*
