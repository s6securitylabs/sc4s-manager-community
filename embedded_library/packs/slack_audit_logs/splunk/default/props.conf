[slack:audit]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "date_create"\s*:\s*
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 10
EVAL-vendor = "slack"
EVAL-product = "audit_logs"
EVAL-vendor_product = "slack:audit_logs"
EVAL-slack_audit_family = case(action="anomaly","anomaly", match(action,"^(user_login|user_logout|user_session)"),"user_session", match(action,"^app_"),"app_security", match(action,"^file_"),"file_security", match(action,"^workspace_"),"workspace_admin", match(action,"^user_role"),"user_admin_role", true(),"audit")
EVAL-event_id = id
EVAL-action = action
EVAL-signature = action
EVAL-signature_id = coalesce(id, action)
EVAL-user = coalesce('actor.user.name','actor.user.email','actor.user.id')
EVAL-src_user = user
EVAL-actor_id = 'actor.user.id'
EVAL-actor_name = 'actor.user.name'
EVAL-actor_email = 'actor.user.email'
EVAL-actor_type = 'actor.type'
EVAL-target_user = coalesce('entity.user.name','entity.user.email','entity.user.id')
EVAL-target_user_id = 'entity.user.id'
EVAL-target_user_email = 'entity.user.email'
EVAL-object_type = 'entity.type'
EVAL-object = coalesce('entity.user.id','entity.app.id','entity.file.id','entity.workspace.id','entity.type')
EVAL-src_ip = 'context.ip_address'
EVAL-src = src_ip
EVAL-user_agent = 'context.ua'
EVAL-session_id = 'context.session_id'
EVAL-workspace_id = coalesce('context.location.id','actor.user.team','entity.user.team')
EVAL-workspace_name = 'context.location.name'
EVAL-workspace_domain = 'context.location.domain'
EVAL-reason = 'details.reason'
EVAL-previous_ip_address = 'details.previous_ip_address'
EVAL-previous_user_agent = 'details.previous_ua'
EVAL-file_hash = 'details.md5'
EVAL-file_url_private = 'details.url_private'
FIELDALIAS-slack_marker = marker AS marker
