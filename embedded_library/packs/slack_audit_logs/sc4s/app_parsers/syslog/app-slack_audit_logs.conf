# Conservative Slack Audit Logs JSON relay parser for SecHub Resources.
# Match only Slack Audit Logs API entries relayed one JSON object per line.
# The collector must unwrap native API entries[] responses and own token/cursor/checkpoint state.

block parser app_slack_audit_logs() {
    channel {
        if {
            filter {
                match('"action"\s*:\s*"(user_login|anomaly|app_approved|file_downloaded|workspace_settings_changed|user_role_changed)"' value('MESSAGE'))
                and match('"actor"\s*:' value('MESSAGE'))
                and match('"entity"\s*:' value('MESSAGE'))
                and match('"context"\s*:' value('MESSAGE'))
                and match('"date_create"\s*:' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('slack') product('audit_logs')) };
            rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('slack:audit')) };
            rewrite { set('slack_audit_logs', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
