[fortinet:fortigate]
SHOULD_LINEMERGE = false
KV_MODE = json
AUTO_KV_JSON = true
TRUNCATE = 30000
category = Network
pulldown_type = true
EVAL-vendor = coalesce(vendor, "Fortinet")
EVAL-product = coalesce(product, "fortigate-fortios")
EVAL-vendor_product = coalesce(vendor_product, "fortinet:fortigate-fortios")
EVAL-src = coalesce(src, srcip, remip)
EVAL-src_port = coalesce(src_port, srcport)
EVAL-dest = coalesce(dest, dstip)
EVAL-dest_port = coalesce(dest_port, dstport)
EVAL-src_interface = coalesce(src_interface, srcintf)
EVAL-dest_interface = coalesce(dest_interface, dstintf)
EVAL-transport = case(proto=="6", "tcp", proto=="17", "udp", proto=="1", "icmp", true(), coalesce(transport, proto))
EVAL-action = coalesce(action, status)
EVAL-signature = coalesce(signature, threat, virus, msg)
EVAL-signature_id = coalesce(signature_id, logid, eventid)
EVAL-user = coalesce(user, srcuser, unauthuser)
FIELDALIAS-fortigate_device = devname AS dvc
FIELDALIAS-fortigate_serial = devid AS serial
