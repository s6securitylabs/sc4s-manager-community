block parser app-fortinet_fortigate_fortios() {
    channel {
        # FortiGate/FortiOS syslog payloads are Fortinet key=value records.
        # Preserve the original message and normalize conservative metadata only.
        parser {
            kv-parser(
                prefix(".values.")
                pair-separator(" ")
                template("${MESSAGE}")
            );
        };

        parser {
            # Fixture-backed FortiOS records carry date=YYYY-MM-DD and time=HH:MM:SS.
            # Apply the timestamp parser directly; Splunk props retain the same payload
            # date/time fields for read-back checks and source-time review.
            date-parser-nofilter(
                format("%Y-%m-%d %H:%M:%S")
                template("${.values.date} ${.values.time}")
            );
        };

        rewrite {
            r_set_splunk_dest_default(
                index("netfw")
                sourcetype("fortinet:fortigate")
                vendor("fortinet")
                product("fortigate-fortios")
                source("fortinet_fortigate_fortios")
                template("t_json_values_msg")
            );
            set("${.values.devname}" value("HOST") condition("${.values.devname}" ne ""));
        };
    };
};

application app-netsource-fortinet_fortigate_fortios[sc4s-network-source] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_FORTINET_FORTIGATE_FORTIOS")
            or tags("source.s_FORTINET_FORTIGATE_FORTIOS")
            or "${SOURCE}" eq "s_FORTINET_FORTIGATE_FORTIOS"
            or "${.netsource.sc4s_vendor_product}" eq "fortinet_fortigate_fortios"
            or (
                match("^fortinet$" value(".netsource.sc4s_vendor") type(pcre) flags(ignore-case))
                and match("^(fortigate|fortios|fortigate-fortios)$" value(".netsource.sc4s_product") type(pcre) flags(ignore-case))
            )
        )
    };
    parser { app-fortinet_fortigate_fortios(); };
};

application app-syslog-fortinet_fortigate_fortios[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_FORTINET_FORTIGATE_FORTIOS")
            or tags("source.s_FORTINET_FORTIGATE_FORTIOS")
            or program("^(FortiGate|Fortinet|fortigate|fortinet)$" type(pcre))
            or (message("(^| )date=" type(pcre)) and message("(^| )time=" type(pcre)) and message("(^| )logid=" type(pcre)) and message("(^| )type=" type(pcre)))
        )
    };
    parser { app-fortinet_fortigate_fortios(); };
};

application app-raw-fortinet_fortigate_fortios[sc4s-raw-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_FORTINET_FORTIGATE_FORTIOS")
            or tags("source.s_FORTINET_FORTIGATE_FORTIOS")
            or (message("(^| )date=" type(pcre)) and message("(^| )time=" type(pcre)) and message("(^| )logid=" type(pcre)) and message("(^| )type=" type(pcre)))
        )
    };
    parser { app-fortinet_fortigate_fortios(); };
};
