[oracle:weblogic:server]
SHOULD_LINEMERGE = false
TRUNCATE = 200000
KV_MODE = none
TIME_PREFIX = ^####<
TIME_FORMAT = %b %d, %Y %I:%M:%S,%3N %p %Z
MAX_TIMESTAMP_LOOKAHEAD = 32
EXTRACT-wls_marker = (?<sechub_fixture_marker>SC4S_ORACLE_WEBLOGIC_TEST_SERVER_[A-Z_]+_\d{3})
EXTRACT-wls_header = ^####<(?<wls_time>[^>]+)>\s+<(?<severity>[^>]+)>\s+<(?<subsystem>[^>]+)>\s+<(?<machine_name>[^>]+)>\s+<(?<server_name>[^>]*)>\s+<(?<thread_id>[^>]+)>\s+<(?<user_id>[^>]*)>\s+<(?<transaction_id>[^>]*)>\s+<(?<diagnostic_context_id>[^>]*)>\s+<(?<raw_time_ms>\d+)>\s+<(?<message_attributes>[^>]*)>\s+<(?<message_id>[^>]+)>\s+<(?<message>.*)>\s*$
EXTRACT-wls_partition = \[partition-name:\s*(?<partition_name>[^\]]+)\]
EXTRACT-wls_severity_value = \[severity-value:\s*(?<severity_value>\d+)\]
EVAL-vendor = "oracle"
EVAL-product = "weblogic"
EVAL-vendor_product = "oracle:weblogic"
EVAL-action = case(match(message,"state changed to"),"server_state_change", match(message,"Unable to connect"),"admin_server_connect_retry", true(), lower(severity))
EVAL-status = case(match(severity,"(?i)Error|Warning|Critical|Alert|Emergency"),"attention", true(),"informational")
EVAL-signature = coalesce(message_id, subsystem)
EVAL-signature_id = sechub_fixture_marker
FIELDALIAS-oracle_weblogic_marker = sechub_fixture_marker AS marker

[oracle:weblogic:access]
SHOULD_LINEMERGE = false
TRUNCATE = 200000
KV_MODE = none
TIME_PREFIX = \[
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
MAX_TIMESTAMP_LOOKAHEAD = 32
EXTRACT-wls_access_marker = (?<sechub_fixture_marker>SC4S_ORACLE_WEBLOGIC_TEST_ACCESS_[A-Z_]+_\d{3})
EXTRACT-wls_access_common = ^(?<src_ip>\S+)\s+\S+\s+(?<user>\S+)\s+\[(?<access_time>[^\]]+)\]\s+"(?<http_method>\S+)\s+(?<uri_path>[^\s?]+)(?:\?(?<uri_query>[^\s]*))?\s+HTTP/(?<http_version>[^"]+)"\s+(?<status>\d{3})\s+(?<bytes>\d+)
EVAL-vendor = "oracle"
EVAL-product = "weblogic"
EVAL-vendor_product = "oracle:weblogic"
EVAL-src = src_ip
EVAL-action = lower(http_method)
EVAL-severity = if(tonumber(status)>=400,"medium","informational")
EVAL-signature = status
EVAL-signature_id = sechub_fixture_marker
FIELDALIAS-oracle_weblogic_access_marker = sechub_fixture_marker AS marker
