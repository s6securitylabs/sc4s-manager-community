# Conservative Oracle WebLogic relay routing for SecHub Resources.
# This classifies fixture-backed server/access log relay records on the dedicated source.

block parser app_oracle_weblogic_server() {
    channel {
        if {
            filter {
                (tags(".source.s_ORACLE_WEBLOGIC") or "${.netsource.sc4s_vendor_product}" eq "oracle_weblogic")
                and match('SC4S_ORACLE_WEBLOGIC_TEST_SERVER_' value('MESSAGE'))
                and match('####<' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('oracle') product('weblogic')) };
            rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('oracle:weblogic:server')) };
            rewrite { set('oracle_weblogic', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};

