[gitlab:audit:json]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "created_at"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3NZ
MAX_TIMESTAMP_LOOKAHEAD = 24
EVAL-vendor = "gitlab"
EVAL-product = "audit_events"
EVAL-vendor_product = "gitlab:audit_events"
EVAL-gitlab_audit_family = case(entity_type="Project", "project_admin_change", entity_type="Group", "group_admin_change", entity_type="User", "user_account_change", like(event_type, "audit_events_streaming%"), "audit_streaming_config_change", true(), "generic_audit_event")
EVAL-event_id = tostring(id)
EVAL-signature = coalesce(event_type, 'details.custom_message', 'details.change')
EVAL-signature_id = coalesce(tostring(id), event_type)
EVAL-custom_message = 'details.custom_message'
EVAL-change = 'details.change'
EVAL-from = 'details.from'
EVAL-to = 'details.to'
EVAL-author_email = 'details.author_email'
EVAL-src_user = coalesce(author_name, 'details.author_name', author_email, tostring(author_id))
EVAL-user = src_user
EVAL-target_id = coalesce(tostring(target_id), tostring('details.target_id'))
EVAL-target_type = coalesce(target_type, 'details.target_type')
EVAL-target_details = coalesce(target_details, 'details.target_details')
EVAL-object = coalesce(target_details, 'details.target_details', entity_path, 'details.entity_path')
EVAL-src_ip = coalesce(ip_address, 'details.ip_address')
EVAL-src = src_ip
FIELDALIAS-gitlab_marker = marker AS marker
