# Conservative GitLab Audit Events JSON relay parser for SecHub Resources.
# Match only collector-relayed GitLab Audit Events API / audit-event-streaming JSON objects.
# A collector/webhook receiver must poll or receive GitLab, own credentials/checkpoints, and relay one JSON object per line.

block parser app_gitlab_audit_security() {
    channel {
        if {
            filter {
                match('"created_at"\s*:' value('MESSAGE'))
                and match('"entity_type"\s*:' value('MESSAGE'))
                and match('"details"\s*:' value('MESSAGE'))
                and (
                    match('"event_type"\s*:\s*"(project_archived|group_marked_for_deletion|user_email_changed|audit_events_streaming_instance_headers_create)"' value('MESSAGE'))
                    or match('"custom_message"\s*:\s*"(Project archived|Group marked for deletion|Audit event streaming header created)"' value('MESSAGE'))
                    or match('"change"\s*:\s*"email address"' value('MESSAGE'))
                );
            };
            parser { app-parser-template(vendor('gitlab') product('audit_events')) };
            rewrite { r_set_splunk_dest_default(index('gitops') sourcetype('gitlab:audit:json')) };
            rewrite { set('gitlab_audit_security', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
