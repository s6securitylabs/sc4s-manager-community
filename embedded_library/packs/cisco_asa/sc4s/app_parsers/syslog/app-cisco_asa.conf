# Cisco ASA / FTD conservative SecHub Resources parser.
# Extends upstream SC4S Lite routing for Cisco ASA/FTD message-id tokens.
# No reduction/drop behavior is enabled by default.
block parser app-cisco_asa() {
    channel {
        rewrite {
            r_set_splunk_dest_default(
                index("netfw")
                sourcetype("cisco:asa")
                vendor("cisco")
                product("asa")
            );
        };
        rewrite(r_set_source_identified);
    };
};

application app-cisco_asa[sc4s-raw-syslog] {
    filter {
        # Dedicated SecHub Resources listeners tag this source with CISCO_ASA. Keep
        # the token match strict so unrelated events containing loose "%ASA-"
        # text are not stolen from another parser.
        not filter(f_is_source_identified)
        and (
            tags(".source.s_CISCO_ASA")
            or tags("source.s_CISCO_ASA")
            or program("^(CiscoASA|CiscoFTD)$" type(pcre))
            or message("%(ASA|FTD)-[0-7]-[0-9]{6}:" type(pcre))
        );
    };
    parser { app-cisco_asa(); };
};

application app-cisco_asa[sc4s-network-source] {
    filter {
        # Parsed syslog traffic may carry the ASA/FTD token in MESSAGE after
        # header parsing. Do not override a source already identified upstream.
        not filter(f_is_source_identified)
        and (
            tags(".source.s_CISCO_ASA")
            or tags("source.s_CISCO_ASA")
            or program("^(CiscoASA|CiscoFTD)$" type(pcre))
            or message("%(ASA|FTD)-[0-7]-[0-9]{6}:" type(pcre))
        );
    };
    parser { app-cisco_asa(); };
};
