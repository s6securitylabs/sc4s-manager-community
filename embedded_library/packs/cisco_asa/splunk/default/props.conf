[cisco:asa]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = none
TIME_PREFIX = ^
TIME_FORMAT = %b %d %Y %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 32
EXTRACT-cisco_asa_header = %(?<cisco_facility>ASA|FTD)-(?<cisco_severity>[0-7])-(?<cisco_msg_id>\d{6}):\s*(?<cisco_message>.*)$
EXTRACT-cisco_asa_conn = (?i)\b(?<vendor_raw_action>Built|Teardown)\s+(?:(?<direction>outbound|inbound)\s+)?(?<transport>TCP|UDP|ICMP)\s+connection\s+(?:(?<connection_id>\d+)\s+)?(?:for|from)\s+(?<src_interface>[A-Za-z0-9_-]+):(?<src_ip>\d{1,3}(?:\.\d{1,3}){3})/(?<src_port>\d+).*?\bto\s+(?<dest_interface>[A-Za-z0-9_-]+):(?<dest_ip>\d{1,3}(?:\.\d{1,3}){3})/(?<dest_port>\d+)
EXTRACT-cisco_asa_translation = (?i)\b(?<vendor_raw_action>Built)\s+dynamic\s+(?<transport>TCP|UDP)\s+translation\s+from\s+(?<nat_original_interface>[A-Za-z0-9_-]+):(?<nat_original_ip>\d{1,3}(?:\.\d{1,3}){3})/(?<nat_original_port>\d+)\s+to\s+(?<nat_translated_interface>[A-Za-z0-9_-]+):(?<nat_translated_ip>\d{1,3}(?:\.\d{1,3}){3})/(?<nat_translated_port>\d+)
EXTRACT-cisco_asa_teardown_metrics = (?i)\bTeardown\s+(?:TCP|UDP|ICMP)\s+connection\s+\d+\s+.*?\sduration\s+(?<duration>\d+:\d{2}:\d{2})\s+bytes\s+(?<bytes>\d+)\b
EXTRACT-cisco_asa_deny = (?i)\b(?<vendor_raw_action>Deny)\s+(?<transport>TCP|UDP|ICMP)\s+src\s+(?<src_interface>[A-Za-z0-9_-]+):(?<src_ip>\d{1,3}(?:\.\d{1,3}){3})(?:/(?<src_port>\d+))?\s+dst\s+(?<dest_interface>[A-Za-z0-9_-]+):(?<dest_ip>\d{1,3}(?:\.\d{1,3}){3})(?:/(?<dest_port>\d+))?(?:\s+\(type\s+(?<icmp_type>\d+),\s+code\s+(?<icmp_code>\d+)\))?\s+by\s+access-group\s+\"(?<access_group>[^\"]+)\"
EVAL-vendor = "Cisco"
EVAL-product = "ASA"
EVAL-vendor_product = "cisco:asa"
EVAL-action = case(vendor_raw_action=="Deny", "blocked", vendor_raw_action=="Built", "allowed", vendor_raw_action=="Teardown", "teardown", true(), vendor_raw_action)
EVAL-signature = cisco_msg_id
EVAL-signature_id = cisco_msg_id
EVAL-severity = cisco_severity
EVAL-severity_label = case(cisco_severity=="0", "emergency", cisco_severity=="1", "alert", cisco_severity=="2", "critical", cisco_severity=="3", "error", cisco_severity=="4", "warning", cisco_severity=="5", "notice", cisco_severity=="6", "informational", cisco_severity=="7", "debug", true(), null())
EVAL-transport = upper(transport)
EVAL-src = src_ip
EVAL-dest = dest_ip
