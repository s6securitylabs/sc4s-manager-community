[sc4s_cisco_asa]
search = sourcetype="cisco:asa" vendor="Cisco" product="ASA"

[sc4s_cisco_asa_connections]
search = sourcetype="cisco:asa" cisco_msg_id IN (302013,302014,302015)

[sc4s_cisco_asa_denies]
search = sourcetype="cisco:asa" cisco_msg_id=106023 action="blocked"

[sc4s_cisco_asa_icmp_denies]
search = sourcetype="cisco:asa" cisco_msg_id=106023 action="blocked" transport="ICMP" icmp_type=* icmp_code=* access_group=*

[sc4s_cisco_asa_connection_builds]
search = sourcetype="cisco:asa" cisco_msg_id IN (302013,302015) action="allowed"

[sc4s_cisco_asa_dynamic_translations]
search = sourcetype="cisco:asa" cisco_msg_id=305011 vendor_raw_action="Built" nat_original_ip=* nat_translated_ip=*

[sc4s_cisco_asa_ftd_udp_connections]
search = sourcetype="cisco:asa" cisco_facility="FTD" cisco_msg_id=302015 action="allowed" transport="UDP"

[sc4s_cisco_asa_connection_teardowns]
search = sourcetype="cisco:asa" cisco_msg_id=302014 action="teardown"

[sc4s_cisco_asa_connection_teardown_metrics]
search = sourcetype="cisco:asa" cisco_msg_id=302014 action="teardown" duration=* bytes=*
