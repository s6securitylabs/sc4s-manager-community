# Linux common OS syslog routing.
# Conservative: only acts on the dedicated source tag / netsource identity and explicit program/message tokens.
block parser app-linux_os_syslog_sshd() { channel { rewrite { r_set_splunk_dest_default(index('osnix') sourcetype('linux:os:auth:sshd') vendor('linux') product('os_syslog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('auth')); }; }; };
