[linux:os:kernel]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EXTRACT-linux_os_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+(?<program>kernel):\s+(?<message>.*)\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-linux_os_kernel_packet = SRC=(?<src_ip>\d+\.\d+\.\d+\.\d+) DST=(?<dest_ip>\d+\.\d+\.\d+\.\d+).*PROTO=(?<transport>\S+) SPT=(?<src_port>\d+) DPT=(?<dest_port>\d+)
EVAL-vendor = "Linux"
EVAL-product = "os_syslog"
EVAL-vendor_product = "linux:os_syslog"
EVAL-action = "kernel_warning"
EVAL-signature_id = program
EVAL-signature = "kernel_message"
EVAL-src = src_ip
EVAL-dest = dest_ip

