[linux:os:auth:sshd]
SHOULD_LINEMERGE = false
KV_MODE = none
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EXTRACT-linux_os_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+(?<program>sshd)\[(?<process_id>\d+)\]:\s+(?<message>.*)\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-linux_os_sshd_failed = Failed password for (?:invalid user )?(?<user>\S+) from (?<src_ip>\d+\.\d+\.\d+\.\d+) port (?<src_port>\d+) (?<transport>\S+)
EXTRACT-linux_os_sshd_accepted = Accepted (?<auth_method>password|publickey|keyboard-interactive/pam) for (?<user>\S+) from (?<src_ip>\d+\.\d+\.\d+\.\d+) port (?<src_port>\d+) (?<transport>\S+)
EVAL-vendor = "Linux"
EVAL-product = "os_syslog"
EVAL-vendor_product = "linux:os_syslog"
EVAL-action = case(match(message,"^Accepted "),"ssh_login_success",match(message,"^Failed password"),"ssh_login_failed",true(),"ssh_auth")
EVAL-result = case(match(message,"^Accepted "),"success",match(message,"^Failed password"),"failure",true(),"unknown")
EVAL-signature_id = program
EVAL-signature = case(match(message,"^Accepted "),"sshd_accepted_login",match(message,"^Failed password"),"sshd_failed_password",true(),"sshd_auth")
EVAL-src = src_ip

[linux:os:auth:sudo]
SHOULD_LINEMERGE = false
KV_MODE = none
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EXTRACT-linux_os_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+(?<program>sudo):\s+(?<message>.*)\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-linux_os_sudo = ^[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2}\s+\S+\s+sudo:\s+(?<user>\S+)\s+:\s+TTY=(?<terminal>[^;]+) ; PWD=(?<working_directory>[^;]+) ; USER=(?<dest_user>[^;]+) ; COMMAND=(?<command>.*?)\s+sc4s_marker=
EVAL-vendor = "Linux"
EVAL-product = "os_syslog"
EVAL-vendor_product = "linux:os_syslog"
EVAL-action = "sudo_command"
EVAL-result = "success"
EVAL-signature_id = program
EVAL-signature = "sudo_command"

