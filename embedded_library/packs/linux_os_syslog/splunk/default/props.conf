[linux:os:auth:su]
SHOULD_LINEMERGE = false
KV_MODE = none
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EXTRACT-linux_os_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+(?<program>su)\[(?<process_id>\d+)\]:\s+(?<message>.*)\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-linux_os_su_pam_session = pam_unix\((?<pam_service>[^)]+)\): session (?<pam_event>opened|closed) for user (?<dest_user>\S+)(?:\(uid=(?<dest_user_uid>\d+)\))?(?: by (?<user>\S+)(?:\(uid=(?<user_uid>\d+)\))?)?
EXTRACT-linux_os_su_pam_auth_failure = pam_unix\((?<pam_auth_service>su:auth)\): authentication failure; logname=(?<pam_logname>\S*) uid=(?<pam_auth_uid>\d+) euid=(?<effective_uid>\d+) tty=(?<terminal>\S*) ruser=(?<ruser>\S*) rhost=(?<rhost>\S*) user=(?<dest_user>\S+)
EVAL-vendor = "Linux"
EVAL-product = "os_syslog"
EVAL-vendor_product = "linux:os_syslog"
EVAL-action = case(match(message,"authentication failure;"),"su_auth_failure",pam_event="opened","su_session_opened",pam_event="closed","su_session_closed",true(),"su_pam_session")
EVAL-result = case(match(message,"authentication failure;"),"failure",true(),"success")
EVAL-pam_service = coalesce(pam_service,pam_auth_service)
EVAL-user = coalesce(user,ruser,pam_logname)
EVAL-user_uid = coalesce(user_uid,pam_auth_uid)
EVAL-src_ip = rhost
EVAL-src = src_ip
EVAL-signature_id = pam_service
EVAL-signature = action

[linux:os:package]
SHOULD_LINEMERGE = false
KV_MODE = none
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EXTRACT-linux_os_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+(?<program>apt|apt-get|dpkg|dnf|yum|rpm)\[(?<process_id>\d+)\]:\s+(?<message>.*)\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-linux_os_package_change = (?<package_action>Installed|Upgraded|Removed) package (?<package_name>\S+) version (?<package_version>\S+)(?: architecture (?<package_arch>\S+))?
EVAL-vendor = "Linux"
EVAL-product = "os_syslog"
EVAL-vendor_product = "linux:os_syslog"
EVAL-action = lower(package_action)
EVAL-result = "success"
EVAL-signature_id = package_name
EVAL-signature = package_action

[linux:os:account]
SHOULD_LINEMERGE = false
KV_MODE = none
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EXTRACT-linux_os_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+(?<program>useradd|groupadd|userdel|usermod)\[(?<process_id>\d+)\]:\s+(?<message>.*)\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-linux_os_account_useradd = new user: name=(?<account_name>[^,]+), UID=(?<account_uid>\d+), GID=(?<account_gid>\d+), home=(?<account_home>[^,]+), shell=(?<account_shell>[^,]+), from=(?<account_source>\S+)
EXTRACT-linux_os_account_groupadd = new group: name=(?<account_name>[^,]+), GID=(?<account_gid>\d+)
EXTRACT-linux_os_account_userdel = delete user '(?<account_name>[^']+)'
EXTRACT-linux_os_account_usermod_change = change user '(?<account_name>[^']+)' (?<account_attribute>shell|home|UID|GID|password|inactive|expiration) from '(?<account_old_value>[^']*)' to '(?<account_new_value>[^']*)'
EVAL-vendor = "Linux"
EVAL-product = "os_syslog"
EVAL-vendor_product = "linux:os_syslog"
EVAL-account_action = case(program="useradd","new_user",program="groupadd","new_group",program="userdel","delete_user",program="usermod" AND isnotnull(account_attribute),"change_".lower(account_attribute),program="usermod","change_user",true(),"account_change")
EVAL-action = account_action
EVAL-result = "success"
EVAL-user = if(program="groupadd", null(), account_name)
EVAL-dest_user = if(program="groupadd", null(), account_name)
EVAL-signature_id = program
EVAL-signature = account_action
