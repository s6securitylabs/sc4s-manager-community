[linux_os_syslog_sshd_auth_failures]
search = sourcetype="linux:os:auth:sshd" vendor="Linux" product="os_syslog" action="ssh_login_failed" result="failure"

[linux_os_syslog_sudo_commands]
search = sourcetype="linux:os:auth:sudo" vendor="Linux" product="os_syslog" action="sudo_command" command=*

[linux_os_syslog_cron_commands]
search = sourcetype="linux:os:cron" vendor="Linux" product="os_syslog" action="cron_command" command=*

[linux_os_syslog_kernel_messages]
search = sourcetype="linux:os:kernel" vendor="Linux" product="os_syslog" program="kernel"

[linux_os_syslog_systemd_services]
search = sourcetype="linux:os:systemd" vendor="Linux" product="os_syslog" service=*

[linux_os_syslog_sshd_auth_successes]
search = sourcetype="linux:os:auth:sshd" vendor="Linux" product="os_syslog" action="ssh_login_success" result="success"

[linux_os_syslog_su_pam_sessions]
search = sourcetype="linux:os:auth:su" vendor="Linux" product="os_syslog" action="su_session_*"

[linux_os_syslog_package_changes]
search = sourcetype="linux:os:package" vendor="Linux" product="os_syslog" package_name=*

[linux_os_syslog_su_pam_auth_failures]
search = sourcetype="linux:os:auth:su" vendor="Linux" product="os_syslog" action="su_auth_failure" result="failure"

[linux_os_syslog_account_admin]
search = sourcetype="linux:os:account" vendor="Linux" product="os_syslog" account_action=* account_name=*
