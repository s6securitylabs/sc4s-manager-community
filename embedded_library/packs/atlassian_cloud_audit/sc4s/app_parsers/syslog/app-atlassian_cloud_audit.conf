# Conservative Atlassian Cloud audit JSON relay parser for SecHub Resources.
# Match only collector-relayed Atlassian Cloud audit records as one JSON object per line.
# The collector must poll Jira/Confluence/Admin APIs, unwrap arrays or JSON:API pages, own OAuth/API tokens and checkpoints, and relay one record per event.

block parser app_atlassian_cloud_audit() {
    channel {
        if {
            filter {
                match('"source_product"\s*:\s*"(jira_cloud|confluence_cloud|atlassian_admin_org)"' value('MESSAGE'))
                and match('"marker"\s*:\s*"SC4S_ATLASSIAN_CLOUD_AUDIT_TEST_|"(summary|attributes|creationDate|created)"\s*:' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('atlassian') product('cloud_audit')) };
            rewrite { r_set_splunk_dest_default(index('gitops') sourcetype('atlassian:cloud:audit:json')) };
            rewrite { set('atlassian_cloud_audit', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
