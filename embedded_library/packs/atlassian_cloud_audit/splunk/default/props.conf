[atlassian:cloud:audit:json]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "(?:created|creationDate|time)"\s*:\s*"
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = "atlassian"
EVAL-product = "cloud_audit"
EVAL-vendor_product = "atlassian:cloud_audit"
EVAL-atlassian_audit_family = case(source_product="jira_cloud", "jira_cloud_audit", source_product="confluence_cloud", "confluence_cloud_audit", source_product="atlassian_admin_org", "organization_audit_event", true(), "atlassian_cloud_audit")
EVAL-event_id = coalesce(id, 'attributes.id')
EVAL-action = coalesce(summary, 'attributes.action', category)
EVAL-signature = coalesce(action, summary, 'attributes.action', category)
EVAL-signature_id = coalesce(event_id, signature)
EVAL-user = coalesce(authorKey, authorAccountId, 'author.displayName', 'author.accountId', 'attributes.actor.email', 'attributes.actor.name')
EVAL-src_user = user
EVAL-src_ip = coalesce(remoteAddress, 'attributes.location.ip')
EVAL-src = src_ip
EVAL-object = coalesce('objectItem.name', 'affectedObject.name', 'attributes.object.attributes.name', 'attributes.object.id')
EVAL-object_type = coalesce('objectItem.typeName', 'affectedObject.objectType', 'attributes.object.type')
EVAL-change = coalesce('changedValues{}.fieldName', 'changedValues{}.name')
EVAL-from = coalesce('changedValues{}.changedFrom', 'changedValues{}.oldValue')
EVAL-to = coalesce('changedValues{}.changedTo', 'changedValues{}.newValue')
EVAL-location_country = 'attributes.location.countryName'
EVAL-location_region = 'attributes.location.regionName'
EVAL-location_city = 'attributes.location.city'
FIELDALIAS-atlassian_marker = marker AS marker
