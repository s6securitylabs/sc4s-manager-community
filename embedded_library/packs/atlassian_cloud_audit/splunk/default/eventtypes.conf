[atlassian_cloud_audit_jira]
search = sourcetype=atlassian:cloud:audit:json vendor=atlassian product=cloud_audit source_product=jira_cloud

[atlassian_cloud_audit_confluence]
search = sourcetype=atlassian:cloud:audit:json vendor=atlassian product=cloud_audit source_product=confluence_cloud

[atlassian_cloud_audit_org]
search = sourcetype=atlassian:cloud:audit:json vendor=atlassian product=cloud_audit source_product=atlassian_admin_org

[atlassian_cloud_audit_security_relevant]
search = sourcetype=atlassian:cloud:audit:json vendor=atlassian product=cloud_audit (category="user management" OR category="permissions" OR action="user_login_failed" OR summary="*permission*" OR summary="*User*")
