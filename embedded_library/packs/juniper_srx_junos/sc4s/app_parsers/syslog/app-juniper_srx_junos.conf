# Juniper SRX/Junos structured syslog conservative parser.
# Routes high-signal SRX RFC5424 structured events without default drops/reduction.
block parser app-juniper_srx_junos() {
    channel {
        if (program("RT_FLOW" type(string) flags(prefix))) {
            rewrite {
                r_set_splunk_dest_default(
                    index("netfw")
                    sourcetype("juniper:junos:firewall")
                    vendor("juniper")
                    product("srx")
                );
            };
        } elif (program("RT_IDP" type(string) flags(prefix))) {
            rewrite {
                r_set_splunk_dest_default(
                    index("netfw")
                    sourcetype("juniper:junos:idp")
                    vendor("juniper")
                    product("srx")
                );
            };
        } elif (program("RT_UTM" type(string) flags(prefix))) {
            rewrite {
                r_set_splunk_dest_default(
                    index("netfw")
                    sourcetype("juniper:junos:utm")
                    vendor("juniper")
                    product("srx")
                );
            };
        } else {
            rewrite {
                r_set_splunk_dest_default(
                    index("netfw")
                    sourcetype("juniper:junos:structured")
                    vendor("juniper")
                    product("junos_structured")
                );
            };
        };
    };
};

application app-juniper_srx_junos[sechub_resources] {
    filter {
        program("RT_FLOW" type(string) flags(prefix))
        or program("RT_IDP" type(string) flags(prefix))
        or program("RT_UTM" type(string) flags(prefix));
    };
    parser { app-juniper_srx_junos(); };
};
