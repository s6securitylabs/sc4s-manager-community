[juniper:junos:firewall]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = none
TIME_PREFIX = ^<\d+>1\s+
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 40
EXTRACT-juniper_rfc5424_flow = ^<\d+>1\s+\S+\s+\S+\s+(?<juniper_program>RT_FLOW)\s+-\s+(?<juniper_event>RT_FLOW_[A-Z_]+)\s+\[junos@\S+\s+(?<juniper_kv>.*)\]$
EXTRACT-juniper_kv_common = source-address="(?<src_ip>[^"]+)"\s+source-port="(?<src_port>[^"]+)"\s+destination-address="(?<dest_ip>[^"]+)"\s+destination-port="(?<dest_port>[^"]+)"
EXTRACT-juniper_flow_fields = protocol-id="(?<protocol_id>[^"]+)".*?policy-name="(?<policy_name>[^"]+)"\s+source-zone-name="(?<source_zone>[^"]+)"\s+destination-zone-name="(?<destination_zone>[^"]+)"
EXTRACT-juniper_marker = marker="(?<sc4s_marker>[^"]+)"
EVAL-vendor = "Juniper"
EVAL-product = "SRX"
EVAL-vendor_product = "juniper:srx"
EVAL-action = case(match(juniper_event,"SESSION_CREATE"),"allowed", match(juniper_event,"SESSION_DENY"),"blocked", true(), lower(juniper_event))
EVAL-signature = juniper_event
EVAL-signature_id = juniper_event
EVAL-severity = null()
EVAL-src = src_ip
EVAL-dest = dest_ip
EVAL-transport = protocol_id

[juniper:junos:idp]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = none
TIME_PREFIX = ^<\d+>1\s+
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 40
EXTRACT-juniper_rfc5424_idp = ^<\d+>1\s+\S+\s+\S+\s+(?<juniper_program>RT_IDP)\s+-\s+(?<juniper_event>IDP_[A-Z_]+)\s+\[junos@\S+\s+(?<juniper_kv>.*)\]$
EXTRACT-juniper_kv_common = source-address="(?<src_ip>[^"]+)"\s+source-port="(?<src_port>[^"]+)"\s+destination-address="(?<dest_ip>[^"]+)"\s+destination-port="(?<dest_port>[^"]+)"
EXTRACT-juniper_idp_fields = protocol-name="(?<transport>[^"]+)".*?application-name="(?<app>[^"]+)".*?action="(?<action>[^"]+)"\s+threat-severity="(?<severity>[^"]+)"\s+attack-name="(?<signature>[^"]+)"
EXTRACT-juniper_user = username="(?<user>[^"]+)"
EXTRACT-juniper_marker = marker="(?<sc4s_marker>[^"]+)"
EVAL-vendor = "Juniper"
EVAL-product = "SRX"
EVAL-vendor_product = "juniper:srx"
EVAL-signature_id = signature
EVAL-src = src_ip
EVAL-dest = dest_ip

[juniper:junos:utm]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = none
TIME_PREFIX = ^<\d+>1\s+
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%:z
MAX_TIMESTAMP_LOOKAHEAD = 40
EXTRACT-juniper_rfc5424_utm = ^<\d+>1\s+\S+\s+\S+\s+(?<juniper_program>RT_UTM)\s+-\s+(?<juniper_event>[A-Z_]+)\s+\[junos@\S+\s+(?<juniper_kv>.*)\]$
EXTRACT-juniper_kv_common = source-address="(?<src_ip>[^"]+)"\s+source-port="(?<src_port>[^"]+)"\s+destination-address="(?<dest_ip>[^"]+)"\s+destination-port="(?<dest_port>[^"]+)"
EXTRACT-juniper_utm_fields = category="(?<category>[^"]+)"\s+reason="(?<reason>[^"]+)"\s+profile="(?<profile>[^"]+)"\s+url="(?<url>[^"]+)"\s+obj="(?<uri_path>[^"]+)"\s+username="(?<user>[^"]+)"
EXTRACT-juniper_marker = marker="(?<sc4s_marker>[^"]+)"
EVAL-vendor = "Juniper"
EVAL-product = "SRX"
EVAL-vendor_product = "juniper:srx"
EVAL-action = if(match(juniper_event,"BLOCKED"),"blocked","allowed")
EVAL-signature = juniper_event
EVAL-signature_id = juniper_event
EVAL-severity = null()
EVAL-src = src_ip
EVAL-dest = dest_ip
