[sc4s_juniper_srx]
search = sourcetype IN ("juniper:junos:firewall","juniper:junos:idp","juniper:junos:utm") vendor="Juniper" product="SRX"

[sc4s_juniper_srx_flow]
search = sourcetype="juniper:junos:firewall" juniper_program="RT_FLOW"

[sc4s_juniper_srx_idp]
search = sourcetype="juniper:junos:idp" juniper_program="RT_IDP"

[sc4s_juniper_srx_utm]
search = sourcetype="juniper:junos:utm" juniper_program="RT_UTM"
