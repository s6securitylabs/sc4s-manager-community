block parser app-dell_powerstore() {
    channel {
        # PowerStore events are routed conservatively using the upstream SC4S
        # structured-data-like marker: [PowerStore_<name>@1139.
        rewrite {
            r_set_splunk_dest_default(
                index("`SC4S_OPTION_DELL_POWERSTORE_INDEX`")
                sourcetype("dell:emc:powerstore")
                vendor("dellemc")
                product("powerstore")
                source("dell_powerstore")
            );
        };
    };
};

application app-netsource-dell_powerstore[sc4s-network-source] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_DELL_POWERSTORE")
            or tags("source.s_DELL_POWERSTORE")
            or "${SOURCE}" eq "s_DELL_POWERSTORE"
            or "${.netsource.sc4s_vendor_product}" eq "dell_powerstore"
        )
    };
    parser { app-dell_powerstore(); };
};

application app-syslog-dell_powerstore[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and match("\[PowerStore_[A-Za-z_]+@1139" value("MESSAGE") type(pcre));
    };
    parser { app-dell_powerstore(); };
};
