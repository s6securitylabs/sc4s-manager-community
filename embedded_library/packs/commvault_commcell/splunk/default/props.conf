[commvault:commcell]
SHOULD_LINEMERGE = false
KV_MODE = json
AUTO_KV_JSON = true
TRUNCATE = 20000
TIME_PREFIX = "Utctimestamp":"
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 10
REPORT-commvault_braced_kv = commvault_braced_kv
category = Custom
pulldown_type = true
EVAL-vendor = coalesce(vendor, "Commvault")
EVAL-product = coalesce(product, "CommCell")
EVAL-vendor_product = coalesce(vendor_product, "commvault:commcell")
EVAL-action = coalesce(action, cv_event_type)
EVAL-signature = coalesce(signature, Operation, Description, Alertname)
EVAL-signature_id = coalesce(signature_id, Opid, Eventid, Alertid)
EVAL-severity = coalesce(severity, Severitylevel, Eventseverity, Alertseverity)
EVAL-user = coalesce(user, Username)
EVAL-dest = coalesce(dest, Computer, Clientname)
EVAL-process = coalesce(process, Program)
EVAL-process_id = coalesce(process_id, Jobid)
EVAL-app = coalesce(app, AgentType, "backup")
EVAL-message = coalesce(message, Details, Description, Alertdescription)
EVAL-Commcellname = coalesce(Commcellname, Companyname)
FIELDALIAS-commvault_audit_time = Audittime AS audit_time
FIELDALIAS-commvault_alert_time = Alerttime AS alert_time
FIELDALIAS-commvault_occurrence_time = Occurrencetime AS occurrence_time
# Login telemetry inside AuditTrail Details, e.g.
#   "Login success: username:[dom\\user], host/ device:[10.0.0.1], logged in from: [AdminConsole]"
#   "Login Name: dom\\user Machine: HOST01"
EXTRACT-cv_login_src = host/\s*device:\[(?<cv_login_src>[^\]]+)\] in Details
EXTRACT-cv_login_from = logged in from:\s*\[(?<cv_login_from>[^\]]+)\] in Details
EXTRACT-cv_login_machine = Machine:\s+(?<cv_login_machine>\S+) in Details
EXTRACT-cv_login_reason = Reason:\s+(?<cv_login_reason>.+)$ in Details
EVAL-src = coalesce(src, cv_login_src, cv_login_machine)
EVAL-Commcellname = coalesce(Commcellname, Companyname)
EXTRACT-cv_login_src_raw = host/\s*device:\[(?<cv_login_src>[^\]]+)\]
EXTRACT-cv_login_from_raw = logged in from:\s*\[(?<cv_login_from>[^\]]+)\]
EXTRACT-cv_login_machine_raw = Machine:\s+(?<cv_login_machine>\S+)
LOOKUP-commvault_eventcode = commvault_eventcodes event_code AS Eventcode OUTPUTNEW event_string AS eventcode_description

