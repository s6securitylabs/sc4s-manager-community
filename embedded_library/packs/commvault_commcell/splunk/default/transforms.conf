# Commvault CommCell SC4S JSON events normally arrive as normalized JSON.
# The fixture harness also covers headerless Commvault examples that carry
# key/value pairs in the form `Field = {value}` so dashboard SPL can be tested
# without a live Commvault feed.

[commvault_braced_kv]
REGEX = (?m)\b([A-Za-z][A-Za-z0-9]*)\s*=\s*\{([^}]*)\}
FORMAT = $1::$2
MV_ADD = true

# Eventcode -> documented event string enrichment for the Events family.
# Regenerate the CSV from the official documentation page with
# scripts/build_commvault_eventcode_lookup.py (see pack README).
[commvault_eventcodes]
filename = commvault_eventcodes.csv
case_sensitive_match = false
