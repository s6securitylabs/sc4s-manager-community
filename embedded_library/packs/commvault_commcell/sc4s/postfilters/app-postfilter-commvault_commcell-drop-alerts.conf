# Optional enhanced reduction only. Do not include this postfilter in a basic
# or standard deployment: matching Commvault Alert/Alerts events are routed to
# the Splunk null queue before indexing. Enable only after reviewing alert-family
# volume and confirming that alert evidence is intentionally discarded.
#
# Validation before enabling: replay a marked Alert fixture without this postfilter
# and confirm it indexes with sourcetype=commvault:commcell:alert, then enable the
# postfilter and confirm the same marker is absent from index=commvault.
# Rollback: remove this postfilter from the active SC4S postfilter include set and
# reload/restart SC4S; basic and standard presets do not reference this file.
application app-postfilter-commvault_commcell-drop-alerts[sc4s-postfilter] {
    filter {
        message("^Alerts?:" type(pcre));
    };
    rewrite {
        r_set_dest_splunk_null_queue();
    };
};
