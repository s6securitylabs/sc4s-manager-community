# Conservative Cloudflare security/access Logpush relay parser for SecHub Resources.
# Use a dedicated listener/source tag. Patterns are tied to documented Cloudflare dataset keys.

block parser app_cloudflare_security_access() {
    channel {
        if {
            filter {
                match('"Dataset"\s*:\s*"(http_requests|firewall_events|access_requests|gateway_dns|gateway_http|gateway_network|audit_logs)"' value('MESSAGE'))
                or match('"RayID"\s*:' value('MESSAGE'))
                or match('"QueryName"\s*:' value('MESSAGE'))
                or match('"SessionID"\s*:' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('cloudflare') product('security_access')) };
            rewrite { r_set_splunk_dest_default(index('netwaf') sourcetype('cloudflare:security_access')) };
            rewrite { set('cloudflare_security_access', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
