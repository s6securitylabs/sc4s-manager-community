FIELDALIAS-cf_http_common = Marker AS marker RayID AS ray_id ClientIP AS src_ip ClientRequestHost AS dest ClientRequestURI AS uri ClientRequestMethod AS http_method ClientRequestUserAgent AS http_user_agent EdgeResponseStatus AS status CacheCacheStatus AS cache_status

