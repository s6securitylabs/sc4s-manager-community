[cloudflare:security_access]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "(?:EdgeStartTimestamp|Datetime|Timestamp|When)"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = "cloudflare"
EVAL-product = "security_access"
EVAL-vendor_product = "cloudflare:security_access"
EVAL-cloudflare_family = lower(Dataset)
EVAL-action = coalesce(Action, SecurityAction, ResolverDecision)
EVAL-signature = coalesce(RuleID, PolicyID, ID, RayID, QueryName, SessionID, ClientRequestHost)
EVAL-signature_id = coalesce(RuleID, PolicyID, ID, RayID, SessionID)
FIELDALIAS-cloudflare_marker = Marker AS marker
FIELDALIAS-cloudflare_ray = RayID AS ray_id
FIELDALIAS-cloudflare_src_ip = ClientIP AS src_ip SourceIP AS src_ip IPAddress AS src_ip ActorIP AS src_ip DestinationIP AS dest_ip DestinationPort AS dest_port SourcePort AS src_port TransportProtocol AS transport DetectedProtocol AS app SNI AS sni
FIELDALIAS-cloudflare_user = UserEmail AS user Email AS user ActorEmail AS user
FIELDALIAS-cloudflare_http = ClientRequestHost AS dest ClientRequestURI AS uri ClientRequestMethod AS http_method Host AS dest URL AS url Method AS http_method
FIELDALIAS-cloudflare_policy = PolicyID AS policy_id PolicyName AS policy_name SessionID AS session_id DeviceID AS device_id DeviceName AS device_name
FIELDALIAS-cloudflare_rule = RuleID AS rule_id RuleMessage AS rule_message
FIELDALIAS-cloudflare_audit = ResourceID AS resource_id ResourceType AS resource_type ResourceName AS resource_name

