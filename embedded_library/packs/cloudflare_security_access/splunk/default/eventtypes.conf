[cloudflare_security_access_http_requests]
search = sourcetype=cloudflare:http:request vendor=cloudflare product=http_requests ray_id=*

[cloudflare_security_access_waf_events]
search = sourcetype=cloudflare:waf:event vendor=cloudflare product=waf_firewall_events rule_id=* action=*

[cloudflare_security_access_access_requests]
search = sourcetype=cloudflare:access:request vendor=cloudflare product=access_requests user=* action=*

[cloudflare_security_access_gateway_dns]
search = sourcetype=cloudflare:gateway:dns vendor=cloudflare product=gateway_dns query=* action=*

[cloudflare_security_access_gateway_http]
search = sourcetype=cloudflare:gateway:http vendor=cloudflare product=gateway_http url=* action=*

[cloudflare_security_access_audit_logs]
search = sourcetype=cloudflare:audit vendor=cloudflare product=audit_logs event_id=* action=*

[cloudflare_security_access_gateway_network]
search = sourcetype=cloudflare:gateway:network vendor=cloudflare product=gateway_network session_id=* action=*
