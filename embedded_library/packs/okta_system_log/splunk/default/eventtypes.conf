[okta_system_log_authn]
search = sourcetype=okta:system:authn vendor=Okta product=system_log (event_type="user.authentication.*" OR event_type="user.session.*")

[okta_system_log_mfa]
search = sourcetype=okta:system:mfa vendor=Okta product=system_log event_type="user.mfa.*"

[okta_system_log_lifecycle]
search = sourcetype=okta:system:lifecycle vendor=Okta product=system_log event_type="user.lifecycle.*"

[okta_system_log_policy]
search = sourcetype=okta:system:policy vendor=Okta product=system_log event_type="policy.*"

[okta_system_log_api_token]
search = sourcetype=okta:system:api_token vendor=Okta product=system_log (event_type="system.api_token.*" OR event_type="app.oauth2.*")

[okta_system_log_oauth]
search = sourcetype=okta:system:api_token vendor=Okta product=system_log event_type="app.oauth2.*"

[okta_system_log_app_membership]
search = sourcetype=okta:system:app vendor=Okta product=system_log event_type="application.user_membership.*"

[okta_system_log_risk]
search = sourcetype=okta:system:risk vendor=Okta product=system_log event_type="user.risk.*"
