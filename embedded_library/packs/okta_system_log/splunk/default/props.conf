[okta:system:authn]
SHOULD_LINEMERGE = false
KV_MODE = json
AUTO_KV_JSON = true
TRUNCATE = 200000
TIME_PREFIX = "published"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 35
EVAL-vendor = "Okta"
EVAL-product = "system_log"
EVAL-vendor_product = "okta:system_log"
FIELDALIAS-okta_event = eventType AS event_type, uuid AS event_id, displayMessage AS signature, severity AS severity
FIELDALIAS-okta_actor = actor.alternateId AS user, actor.displayName AS actor_display_name, actor.id AS actor_id
FIELDALIAS-okta_client = client.ipAddress AS src_ip, client.ipAddress AS src
FIELDALIAS-okta_result = outcome.result AS result, outcome.result AS action, outcome.reason AS result_reason
FIELDALIAS-okta_target = target{}.displayName AS object, target{}.type AS object_type, target{}.id AS object_id
FIELDALIAS-okta_request = debugContext.debugData.requestId AS request_id
FIELDALIAS-okta_session = transaction.id AS session_id, client.userAgent.rawUserAgent AS user_agent

