# Okta System Log JSON routing.
# Conservative: only acts on the dedicated source tag / netsource identity and explicit System Log eventType families.
block parser app-okta_system_log_authn() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('okta:system:authn') vendor('okta') product('system_log') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('authentication')); }; }; };
block parser app-okta_system_log_mfa() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('okta:system:mfa') vendor('okta') product('system_log') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('authentication')); }; }; };
block parser app-okta_system_log_lifecycle() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('okta:system:lifecycle') vendor('okta') product('system_log') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('audit')); }; }; };
block parser app-okta_system_log_policy() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('okta:system:policy') vendor('okta') product('system_log') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('audit')); }; }; };
block parser app-okta_system_log_token() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('okta:system:api_token') vendor('okta') product('system_log') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('audit')); }; }; };
block parser app-okta_system_log_app() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('okta:system:app') vendor('okta') product('system_log') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('audit')); }; }; };
block parser app-okta_system_log_risk() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('okta:system:risk') vendor('okta') product('system_log') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('authentication')); }; }; };
application app-okta_system_log_mfa[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_OKTA_SYSTEM_LOG") or "${.netsource.sc4s_vendor_product}" eq "okta_system_log") and (message('"eventType":"user.mfa.') or message('"eventType":"user.authentication.factor.')) }; parser { app-okta_system_log_mfa(); }; };
application app-okta_system_log_authn[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_OKTA_SYSTEM_LOG") or "${.netsource.sc4s_vendor_product}" eq "okta_system_log") and (message('"eventType":"user.authentication.') or message('"eventType":"user.session.')) }; parser { app-okta_system_log_authn(); }; };
application app-okta_system_log_lifecycle[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_OKTA_SYSTEM_LOG") or "${.netsource.sc4s_vendor_product}" eq "okta_system_log") and message('"eventType":"user.lifecycle.') }; parser { app-okta_system_log_lifecycle(); }; };
application app-okta_system_log_policy[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_OKTA_SYSTEM_LOG") or "${.netsource.sc4s_vendor_product}" eq "okta_system_log") and message('"eventType":"policy.') }; parser { app-okta_system_log_policy(); }; };
application app-okta_system_log_token[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_OKTA_SYSTEM_LOG") or "${.netsource.sc4s_vendor_product}" eq "okta_system_log") and (message('"eventType":"system.api_token.') or message('"eventType":"app.oauth2.')) }; parser { app-okta_system_log_token(); }; };
application app-okta_system_log_app[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_OKTA_SYSTEM_LOG") or "${.netsource.sc4s_vendor_product}" eq "okta_system_log") and message('"eventType":"application.user_membership.') }; parser { app-okta_system_log_app(); }; };
application app-okta_system_log_risk[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_OKTA_SYSTEM_LOG") or "${.netsource.sc4s_vendor_product}" eq "okta_system_log") and message('"eventType":"user.risk.') }; parser { app-okta_system_log_risk(); }; };
