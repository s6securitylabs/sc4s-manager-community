block parser app-pfsense_filterlog() {
    channel {
        # pfSense filterlog payloads are comma-delimited packet-filter records.
        # Parse the stable common + IPv4/IPv6 transport fields documented by Netgate.
        # MESSAGE is preserved; parsed values are used for routing and JSON export.
        parser {
            csv-parser(
                columns(
                    ".values.rule_number",
                    ".values.sub_rule_number",
                    ".values.anchor",
                    ".values.tracker",
                    ".values.interface",
                    ".values.reason",
                    ".values.action",
                    ".values.direction",
                    ".values.ip_version",
                    ".values.tos_or_class",
                    ".values.ecn_or_flow_label",
                    ".values.ttl_or_hop_limit",
                    ".values.ip_id_or_protocol",
                    ".values.offset_or_protocol_id",
                    ".values.flags",
                    ".values.protocol_id",
                    ".values.protocol",
                    ".values.length",
                    ".values.src_ip",
                    ".values.dest_ip",
                    ".values.src_port",
                    ".values.dest_port",
                    ".values.data_length",
                    ".values.tcp_flags",
                    ".values.tcp_sequence",
                    ".values.tcp_ack",
                    ".values.tcp_window",
                    ".values.tcp_urg",
                    ".values.tcp_options"
                )
                delimiters(",")
                flags(greedy)
                template("${MESSAGE}")
            );
        };

        rewrite {
            r_set_splunk_dest_default(
                index("netfw")
                sourcetype("pfsense:filterlog")
                vendor("pfsense")
                product("filterlog")
                source("pfsense_filterlog")
                template("t_json_values_msg")
            );
        };

        if (match("^6$" value(".values.protocol_id") type(pcre)) or match("^tcp$" value(".values.protocol") type(pcre) flags(ignore-case))) {
            rewrite { r_set_splunk_dest_update_v2(sourcetype("pfsense:filterlog:tcp")); };
        } elif (match("^17$" value(".values.protocol_id") type(pcre)) or match("^udp$" value(".values.protocol") type(pcre) flags(ignore-case))) {
            rewrite { r_set_splunk_dest_update_v2(sourcetype("pfsense:filterlog:udp")); };
        } elif (match("^(1|58)$" value(".values.protocol_id") type(pcre)) or match("^icmp" value(".values.protocol") type(pcre) flags(ignore-case))) {
            rewrite { r_set_splunk_dest_update_v2(sourcetype("pfsense:filterlog:icmp")); };
        };
    };
};

application app-netsource-pfsense_filterlog[sc4s-network-source] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_PFSENSE_FILTERLOG")
            or tags("source.s_PFSENSE_FILTERLOG")
            or "${SOURCE}" eq "s_PFSENSE_FILTERLOG"
            or "${.netsource.sc4s_vendor_product}" eq "pfsense_filterlog"
            or (
                match("^(pfsense|netgate)$" value(".netsource.sc4s_vendor") type(pcre) flags(ignore-case))
                and match("^(filterlog|firewall)$" value(".netsource.sc4s_product") type(pcre) flags(ignore-case))
            )
        )
    };
    parser { app-pfsense_filterlog(); };
};

application app-syslog-pfsense_filterlog[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_PFSENSE_FILTERLOG")
            or tags("source.s_PFSENSE_FILTERLOG")
            or program("^filterlog$" type(pcre))
            or message("^[0-9]+,[0-9]*,[^,]*,[0-9]+,[^,]+,(match|block|pass)," type(pcre))
        )
    };
    parser { app-pfsense_filterlog(); };
};

application app-raw-pfsense_filterlog[sc4s-raw-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_PFSENSE_FILTERLOG")
            or tags("source.s_PFSENSE_FILTERLOG")
            or message("^[0-9]+,[0-9]*,[^,]*,[0-9]+,[^,]+,(match|block|pass)," type(pcre))
        )
    };
    parser { app-pfsense_filterlog(); };
};
