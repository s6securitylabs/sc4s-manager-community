[pfsense:filterlog]
SHOULD_LINEMERGE = false
KV_MODE = json
AUTO_KV_JSON = true
TRUNCATE = 20000
EXTRACT-pfsense_filterlog_csv = ^(?<rule_number>[^,]*),(?<sub_rule>[^,]*),(?<anchor>[^,]*),(?<tracker>[^,]*),(?<interface>[^,]*),(?<reason>[^,]*),(?<action>[^,]*),(?<direction>[^,]*),(?<ip_version>[^,]*),(?<tos>[^,]*),(?<ecn>[^,]*),(?<ttl>[^,]*),(?<packet_id>[^,]*),(?<offset>[^,]*),(?<ip_flags>[^,]*),(?<protocol_id>[^,]*),(?<protocol>[^,]*),(?<length>[^,]*),(?<src_ip>[^,]*),(?<dest_ip>[^,]*),(?<src_port>[^,]*),(?<dest_port>[^,\s]*)
category = Network
pulldown_type = true
EVAL-vendor = coalesce(vendor, "pfSense")
EVAL-product = coalesce(product, "filterlog")
EVAL-vendor_product = coalesce(vendor_product, "pfsense:filterlog")
EVAL-action = coalesce(action, action)
EVAL-src = coalesce(src, src_ip)
EVAL-dest = coalesce(dest, dest_ip)
EVAL-dest_port = coalesce(dest_port, dest_port)
EVAL-transport = coalesce(transport, lower(protocol))
EVAL-signature_id = coalesce(signature_id, tracker)
EVAL-signature = coalesce(signature, reason)
EVAL-direction = coalesce(direction, direction)
FIELDALIAS-pfsense_interface = interface AS src_interface
FIELDALIAS-pfsense_rule = rule_number AS rule

