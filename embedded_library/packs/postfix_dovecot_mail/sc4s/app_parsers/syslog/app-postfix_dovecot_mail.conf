# Postfix / Dovecot mail syslog routing.
# Conservative: only routes dedicated source-tag/netsource traffic with explicit Postfix/Dovecot program tokens.
block parser app-postfix_dovecot_mail_delivery() { channel { rewrite { r_set_splunk_dest_default(index('email') sourcetype('mail:postfix:delivery') vendor('postfix_dovecot') product('mail_syslog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('email')); }; }; };
block parser app-postfix_dovecot_mail_reject() { channel { rewrite { r_set_splunk_dest_default(index('email') sourcetype('mail:postfix:reject') vendor('postfix_dovecot') product('mail_syslog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('email')); }; }; };
block parser app-postfix_dovecot_mail_cleanup() { channel { rewrite { r_set_splunk_dest_default(index('email') sourcetype('mail:postfix:cleanup') vendor('postfix_dovecot') product('mail_syslog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('email')); }; }; };
block parser app-postfix_dovecot_mail_login() { channel { rewrite { r_set_splunk_dest_default(index('email') sourcetype('mail:dovecot:login') vendor('postfix_dovecot') product('mail_syslog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('email')); }; }; };
block parser app-postfix_dovecot_mail_auth_failure() { channel { rewrite { r_set_splunk_dest_default(index('email') sourcetype('mail:dovecot:auth_failure') vendor('postfix_dovecot') product('mail_syslog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('email')); }; }; };
block parser app-postfix_dovecot_mail_session() { channel { rewrite { r_set_splunk_dest_default(index('email') sourcetype('mail:dovecot:session') vendor('postfix_dovecot') product('mail_syslog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('email')); }; }; };
block parser app-postfix_dovecot_mail_logout() { channel { rewrite { r_set_splunk_dest_default(index('email') sourcetype('mail:dovecot:logout') vendor('postfix_dovecot') product('mail_syslog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('email')); }; }; };
application app-postfix_dovecot_mail_delivery[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_POSTFIX_DOVECOT_MAIL") or "${.netsource.sc4s_vendor_product}" eq "postfix_dovecot_mail") and message('postfix/smtp[') and message('status=sent') }; parser { app-postfix_dovecot_mail_delivery(); }; };
application app-postfix_dovecot_mail_reject[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_POSTFIX_DOVECOT_MAIL") or "${.netsource.sc4s_vendor_product}" eq "postfix_dovecot_mail") and message('postfix/postscreen[') and message('NOQUEUE: reject:') }; parser { app-postfix_dovecot_mail_reject(); }; };
application app-postfix_dovecot_mail_cleanup[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_POSTFIX_DOVECOT_MAIL") or "${.netsource.sc4s_vendor_product}" eq "postfix_dovecot_mail") and message('postfix/cleanup[') and message('message-id=') }; parser { app-postfix_dovecot_mail_cleanup(); }; };
application app-postfix_dovecot_mail_login[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_POSTFIX_DOVECOT_MAIL") or "${.netsource.sc4s_vendor_product}" eq "postfix_dovecot_mail") and message('dovecot: imap-login: Login:') }; parser { app-postfix_dovecot_mail_login(); }; };
application app-postfix_dovecot_mail_auth_failure[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_POSTFIX_DOVECOT_MAIL") or "${.netsource.sc4s_vendor_product}" eq "postfix_dovecot_mail") and message('dovecot: imap-login: Disconnected: auth failed') }; parser { app-postfix_dovecot_mail_auth_failure(); }; };
application app-postfix_dovecot_mail_session[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_POSTFIX_DOVECOT_MAIL") or "${.netsource.sc4s_vendor_product}" eq "postfix_dovecot_mail") and message('dovecot: imap(') and (message('): copy:') or message('): delete:') or message('): expunged:') or message('): save:')) }; parser { app-postfix_dovecot_mail_session(); }; };
application app-postfix_dovecot_mail_logout[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_POSTFIX_DOVECOT_MAIL") or "${.netsource.sc4s_vendor_product}" eq "postfix_dovecot_mail") and message('dovecot: imap(') and message('): Logged out') }; parser { app-postfix_dovecot_mail_logout(); }; };
