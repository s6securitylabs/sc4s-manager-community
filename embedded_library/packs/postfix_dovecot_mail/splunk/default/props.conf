SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EVAL-vendor = "Postfix/Dovecot"
EVAL-product = "mail_syslog"
EVAL-vendor_product = "postfix_dovecot:mail_syslog"
EXTRACT-mail_dovecot_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+dovecot:\s+(?<dovecot_program>imap-login):\s+(?<message>.*)\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-mail_dovecot_login = Login: user=<(?<user>[^>]+)>,\s+method=(?<auth_method>[^,]+),\s+rip=(?<rip>\d+\.\d+\.\d+\.\d+),\s+lip=(?<lip>\d+\.\d+\.\d+\.\d+),\s+mpid=(?<mail_pid>\d+),\s+(?<tls_state>TLS),\s+session=<(?<session>[^>]+)>
EVAL-action = "login"
EVAL-result = "success"
EVAL-signature_id = dovecot_program
EVAL-signature = "dovecot_imap_login"
EVAL-src = rip
EVAL-src_ip = rip
EVAL-dest = lip
EVAL-dest_ip = lip

