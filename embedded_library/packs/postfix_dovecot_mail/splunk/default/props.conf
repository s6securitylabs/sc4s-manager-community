[mail:postfix:delivery]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EVAL-vendor = "Postfix/Dovecot"
EVAL-product = "mail_syslog"
EVAL-vendor_product = "postfix_dovecot:mail_syslog"
EXTRACT-mail_syslog_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+(?<program>postfix/(?<postfix_daemon>[^\[]+))\[(?<process_id>\d+)\]:\s+(?<queue_id>[A-F0-9]+):\s+(?<message>.*)\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-mail_postfix_delivery = to=<(?<recipient>[^>]+)>,\s+relay=(?<relay_host>[^\[]+)\[(?<relay_ip>\d+\.\d+\.\d+\.\d+)\]:(?<dest_port>\d+),\s+delay=(?<delay>[^,]+),\s+delays=(?<delays>[^,]+),\s+dsn=(?<dsn>[^,]+),\s+status=(?<vendor_raw_status>\S+)\s+\((?<status_message>[^)]+)\)
EVAL-action = "delivery_status"
EVAL-result = vendor_raw_status
EVAL-signature_id = postfix_daemon
EVAL-signature = "postfix_delivery"
EVAL-dest = relay_host
EVAL-dest_ip = relay_ip

[mail:postfix:reject]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EVAL-vendor = "Postfix/Dovecot"
EVAL-product = "mail_syslog"
EVAL-vendor_product = "postfix_dovecot:mail_syslog"
EXTRACT-mail_syslog_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+(?<program>postfix/(?<postfix_daemon>[^\[]+))\[(?<process_id>\d+)\]:\s+(?<queue_id>NOQUEUE):\s+(?<vendor_raw_action>reject):\s+(?<message>.*)\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-mail_postfix_reject = CONNECT from \[(?<src_ip>\d+\.\d+\.\d+\.\d+)\]:(?<src_port>\d+):\s+(?<reason>.*?)\s+sc4s_marker=
EVAL-action = vendor_raw_action
EVAL-result = "blocked"
EVAL-signature_id = postfix_daemon
EVAL-signature = reason
EVAL-src = src_ip

[mail:postfix:cleanup]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EVAL-vendor = "Postfix/Dovecot"
EVAL-product = "mail_syslog"
EVAL-vendor_product = "postfix_dovecot:mail_syslog"
EXTRACT-mail_syslog_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+(?<program>postfix/(?<postfix_daemon>[^\[]+))\[(?<process_id>\d+)\]:\s+(?<queue_id>[A-F0-9]+):\s+(?<message>.*)\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-mail_postfix_cleanup = message-id=<(?<message_id>[^>]+)>
EVAL-action = "message_queued"
EVAL-signature_id = postfix_daemon
EVAL-signature = "postfix_cleanup_message_id"

