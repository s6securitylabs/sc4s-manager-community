[mail:dovecot:logout]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EVAL-vendor = "Postfix/Dovecot"
EVAL-product = "mail_syslog"
EVAL-vendor_product = "postfix_dovecot:mail_syslog"
EXTRACT-mail_dovecot_logout_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<host>\S+)\s+dovecot:\s+(?<dovecot_program>imap)\((?<user>[^)]+)\):\s+(?<vendor_raw_action>Logged out)\s+(?<message>.*)\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-mail_dovecot_logout = in=(?<logout_in_bytes>\d+)\s+out=(?<logout_out_bytes>\d+)\s+deleted=(?<deleted_count>\d+)\s+expunged=(?<expunged_count>\d+)\s+trashed=(?<trashed_count>\d+)\s+hdr_count=(?<hdr_count>\d+)\s+hdr_bytes=(?<hdr_bytes>\d+)\s+body_count=(?<body_count>\d+)\s+body_bytes=(?<body_bytes>\d+)\s+session=<(?<session>[^>]+)>
EVAL-action = "logout"
EVAL-result = "success"
EVAL-signature_id = dovecot_program
EVAL-signature = "dovecot_imap_logout"
