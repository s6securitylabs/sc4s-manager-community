[postfix_dovecot_mail_postfix_delivery]
search = sourcetype=mail:postfix:delivery vendor="Postfix/Dovecot" product=mail_syslog queue_id=* recipient=* vendor_raw_status=*

[postfix_dovecot_mail_postfix_reject]
search = sourcetype=mail:postfix:reject vendor="Postfix/Dovecot" product=mail_syslog queue_id=NOQUEUE vendor_raw_action=reject src_ip=*

[postfix_dovecot_mail_postfix_cleanup]
search = sourcetype=mail:postfix:cleanup vendor="Postfix/Dovecot" product=mail_syslog queue_id=* message_id=*

[postfix_dovecot_mail_dovecot_login]
search = sourcetype=mail:dovecot:login vendor="Postfix/Dovecot" product=mail_syslog user=* rip=* session=*

[postfix_dovecot_mail_dovecot_session]
search = sourcetype=mail:dovecot:session vendor="Postfix/Dovecot" product=mail_syslog user=* uid=* message_id=*

[postfix_dovecot_mail_dovecot_auth_failure]
search = sourcetype=mail:dovecot:auth_failure vendor="Postfix/Dovecot" product=mail_syslog user=* rip=* failure_reason="auth failed"

[postfix_dovecot_mail_dovecot_logout]
search = sourcetype=mail:dovecot:logout vendor="Postfix/Dovecot" product=mail_syslog user=* session=* vendor_raw_action="Logged out"
