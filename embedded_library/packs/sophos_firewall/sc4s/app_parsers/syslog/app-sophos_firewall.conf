# Conservative Sophos Firewall SFOS syslog parser for SecHub Resources.
# Grounded in public Sophos Firewall 21.0 syslog documentation. This pack uses a
# dedicated source tag/listener and key=value signatures to avoid hijacking generic logs.

block parser app-sophos_firewall() {
    channel {
        parser {
            kv-parser(
                prefix(".values.")
                pair-separator(" ")
                template("${MESSAGE}")
            );
        };

        rewrite {
            r_set_splunk_dest_default(
                index("netfw")
                sourcetype("sophos:firewall")
                vendor("sophos")
                product("firewall")
                source("sophos_firewall")
                template("t_json_values_msg")
            );
            set("${.values.device_name}" value("HOST") condition("${.values.device_name}" ne ""));
        };

        if ("${.values.log_component}" eq "Firewall rule") {
            rewrite { r_set_splunk_dest_default(index("netfw") sourcetype("sophos:firewall:traffic") vendor("sophos") product("firewall") source("sophos_firewall") template("t_json_values_msg")); };
        } elif ("${.values.log_component}" eq "IPS") {
            rewrite { r_set_splunk_dest_default(index("netfw") sourcetype("sophos:firewall:ips") vendor("sophos") product("firewall") source("sophos_firewall") template("t_json_values_msg")); };
        } elif (match("VPN" value(".values.log_type") type(pcre) flags(ignore-case)) or match("VPN" value(".values.log_component") type(pcre) flags(ignore-case))) {
            rewrite { r_set_splunk_dest_default(index("netauth") sourcetype("sophos:firewall:vpn") vendor("sophos") product("firewall") source("sophos_firewall") template("t_json_values_msg")); };
        } elif ("${.values.log_type}" eq "System") {
            rewrite { r_set_splunk_dest_default(index("netops") sourcetype("sophos:firewall:system") vendor("sophos") product("firewall") source("sophos_firewall") template("t_json_values_msg")); };
        };
    };
};

application app-netsource-sophos_firewall[sc4s-network-source] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_SOPHOS_FIREWALL")
            or tags("source.s_SOPHOS_FIREWALL")
            or "${SOURCE}" eq "s_SOPHOS_FIREWALL"
            or "${.netsource.sc4s_vendor_product}" eq "sophos_firewall"
            or (
                match("^sophos$" value(".netsource.sc4s_vendor") type(pcre) flags(ignore-case))
                and match("^(firewall|sfos|xg|xgs)$" value(".netsource.sc4s_product") type(pcre) flags(ignore-case))
            )
        )
    };
    parser { app-sophos_firewall(); };
};

application app-syslog-sophos_firewall[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_SOPHOS_FIREWALL")
            or tags("source.s_SOPHOS_FIREWALL")
            or program("^(Sophos|SFOS|XG|XGS)$" type(pcre))
            or (message("(^| )log_id=[0-9]{12}( |$)" type(pcre)) and message("(^| )log_component=" type(pcre)) and message("(^| )device_serial_id=" type(pcre)))
        )
    };
    parser { app-sophos_firewall(); };
};

application app-raw-sophos_firewall[sc4s-raw-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_SOPHOS_FIREWALL")
            or tags("source.s_SOPHOS_FIREWALL")
            or (message("(^| )log_id=[0-9]{12}( |$)" type(pcre)) and message("(^| )log_component=" type(pcre)) and message("(^| )device_serial_id=" type(pcre)))
        )
    };
    parser { app-sophos_firewall(); };
};
