[sophos_firewall]
search = sourcetype=sophos:firewall* vendor=sophos product=firewall

[sophos_firewall_traffic]
search = sourcetype=sophos:firewall:traffic vendor=sophos product=firewall log_component="Firewall rule"

[sophos_firewall_allowed]
search = sourcetype=sophos:firewall:traffic vendor=sophos product=firewall (status=Allow OR action=Allow)

[sophos_firewall_denied]
search = sourcetype=sophos:firewall:traffic vendor=sophos product=firewall (status=Deny OR action=Deny)

[sophos_firewall_ips]
search = sourcetype=sophos:firewall:ips vendor=sophos product=firewall log_component=IPS

[sophos_firewall_vpn]
search = sourcetype=sophos:firewall:vpn vendor=sophos product=firewall

[sophos_firewall_system]
search = sourcetype=sophos:firewall:system vendor=sophos product=firewall
