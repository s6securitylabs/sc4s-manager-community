[sophos:firewall]
SHOULD_LINEMERGE = false
KV_MODE = json
AUTO_KV_JSON = true
TRUNCATE = 20000
category = Network
pulldown_type = true
EVAL-vendor = coalesce(vendor, "sophos")
EVAL-product = coalesce(product, "firewall")
EVAL-vendor_product = coalesce(vendor_product, "sophos:firewall")
EVAL-sophos_firewall_family = case(log_component="Firewall rule","traffic", log_component="IPS","ips", match(log_component,"VPN") OR match(log_type,"VPN"),"vpn", log_type="System","system", true(),"firewall")
EVAL-action = coalesce(status, log_subtype)
EVAL-vendor_raw_action = coalesce(status, log_subtype)
EVAL-signature = coalesce(message, threat, log_component)
EVAL-signature_id = log_id
EVAL-src = coalesce(src, src_ip)
EVAL-dest = coalesce(dest, dst_ip)
EVAL-transport = upper(coalesce(protocol, transport))
FIELDALIAS-sophos_src_port = src_port AS src_port
FIELDALIAS-sophos_dest_port = dst_port AS dest_port
FIELDALIAS-sophos_user = user_name AS user
FIELDALIAS-sophos_src_user = user_name AS src_user
FIELDALIAS-sophos_device = device_name AS dvc
FIELDALIAS-sophos_serial = device_serial_id AS serial

