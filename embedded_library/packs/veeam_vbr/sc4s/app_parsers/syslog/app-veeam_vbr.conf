block parser app-veeam_vbr() {
    channel {
        # Veeam Backup & Replication emits RFC5424-style syslog with APP-NAME Veeam_MP
        # and structured metadata. Parse conservative key/value pairs while preserving raw.
        parser {
            kv-parser(
                prefix(".values.")
                pair-separator(" ")
                template("${MESSAGE}")
            );
        };

        rewrite {
            r_set_splunk_dest_default(
                index("infraops")
                sourcetype("veeam:vbr:syslog")
                vendor("veeam")
                product("backup-replication")
                source("veeam_vbr")
                template("t_json_values_msg")
            );
        };
    };
};

application app-netsource-veeam_vbr[sc4s-network-source] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_VEEAM_VBR")
            or tags("source.s_VEEAM_VBR")
            or "${SOURCE}" eq "s_VEEAM_VBR"
            or "${.netsource.sc4s_vendor_product}" eq "veeam_vbr"
            or (
                match("^veeam$" value(".netsource.sc4s_vendor") type(pcre) flags(ignore-case))
                and match("^(vbr|backup-replication|backup_and_replication)$" value(".netsource.sc4s_product") type(pcre) flags(ignore-case))
            )
        )
    };
    parser { app-veeam_vbr(); };
};

application app-syslog-veeam_vbr[sc4s-syslog-pgm] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_VEEAM_VBR")
            or tags("source.s_VEEAM_VBR")
            or program("^Veeam_MP" type(pcre))
            or message("\\[categoryId=[0-9]+ instanceId=[0-9]+ .*Description=\"" type(pcre))
        )
    };
    parser { app-veeam_vbr(); };
};

application app-raw-veeam_vbr[sc4s-raw-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_VEEAM_VBR")
            or tags("source.s_VEEAM_VBR")
            or message("Veeam_MP" type(string))
        )
    };
    parser { app-veeam_vbr(); };
};
