[veeam:vbr:syslog]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 20000
EVAL-vendor = coalesce(vendor, "Veeam")
EVAL-product = coalesce(product, "Backup & Replication")
EVAL-vendor_product = "veeam:backup-replication"
EVAL-action = coalesce('values.ActivityType', 'values.Description', action)
EVAL-signature = coalesce('values.Description', signature)
EVAL-signature_id = coalesce('values.instanceId', signature_id)
EVAL-session_id = coalesce('values.JobSessionID', 'values.TaskSessionID', session_id)
EVAL-job_id = coalesce('values.JobID', job_id)
EVAL-job_type = coalesce('values.JobType', job_type)
EVAL-job_description = coalesce('values.JobDescription', job_description)
EVAL-platform = coalesce('values.Platform', platform)
EVAL-veeam_flags = coalesce('values.Flags', veeam_flags)
EVAL-veeam_event_version = coalesce('values.Version', veeam_event_version)
EVAL-result = coalesce('values.Status', result)
EVAL-user = coalesce('values.UserName', user)
EVAL-src_host = coalesce('values.SourceHostName', host)
EVAL-object = coalesce('values.ObjectName', object)
