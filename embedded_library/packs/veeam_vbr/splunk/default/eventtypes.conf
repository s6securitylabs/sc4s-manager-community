[veeam_vbr_syslog]
search = sourcetype=veeam:vbr:syslog vendor=Veeam product="Backup & Replication"

[veeam_vbr_job_activity]
search = sourcetype=veeam:vbr:syslog (session_id=* OR signature="*job*" OR action="*Job*")

[veeam_vbr_success]
search = sourcetype=veeam:vbr:syslog (result=Success OR signature="*completed successfully*" OR action="*Success*")
