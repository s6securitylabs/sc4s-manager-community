block parser app-f5_bigip() {
    channel {
        # Conservative F5 BIG-IP parser based on upstream SC4S F5 routing semantics.
        # It preserves raw events, sets default metadata, and parses simple key/value
        # payloads for iRule/ASM examples where practical.
        parser {
            kv-parser(
                prefix(".values.")
                pair-separator(",")
                value-separator("=")
                template("${MESSAGE}")
            );
        };
        rewrite {
            r_set_splunk_dest_default(
                index("netops")
                source("program:${PROGRAM}")
                sourcetype("f5:bigip:syslog")
                vendor("f5")
                product("bigip")
                template("t_json_values_msg")
            );
        };
        if {
            filter { match("^[^/]+/[^/]+" value("HOST") type(pcre)); };
            parser {
                regexp-parser(
                    prefix(".tmp.")
                    template("${HOST}")
                    patterns("^(?<slot>[^/]+)/(?<host>.+)$")
                );
            };
            rewrite {
                set("${.tmp.slot}" value("fields.slot"));
                set("${.tmp.host}" value("HOST"));
            };
        };
        if {
            filter { program("tmm" type(string) flags(prefix)); };
            rewrite {
                r_set_splunk_dest_update_v2(
                    sourcetype("f5:bigip:ltm:ssl:error")
                    condition(message("[0-9A-Fa-f]{4}\\d+:\\d{1,2}:\\sConnection\\serror:" type(pcre))
                );
            };
            rewrite {
                r_set_splunk_dest_update_v2(
                    sourcetype("f5:bigip:ltm:tcl:error")
                    condition(message("[0-9A-Fa-f]{4}\\d+:\\d{1,2}:\\sTCL\\serror:" type(pcre))
                );
            };
            rewrite {
                r_set_splunk_dest_update_v2(
                    sourcetype("f5:bigip:ltm:traffic")
                    condition(message("Limiting.+packets/sec" type(pcre))
                );
            };
        };
    };
};

application app-netsource-f5_bigip[sc4s-network-source] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_F5_BIGIP")
            or tags("source.s_F5_BIGIP")
            or "${SOURCE}" eq "s_F5_BIGIP"
            or "${.netsource.sc4s_vendor_product}" eq "f5_bigip"
            or (
                match("^f5$" value(".netsource.sc4s_vendor") type(pcre) flags(ignore-case))
                and match("^bigip$" value(".netsource.sc4s_product") type(pcre) flags(ignore-case))
            )
        )
    };
    parser { app-f5_bigip(); };
};

application app-syslog-f5_bigip[sc4s-syslog-pgm] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_F5_BIGIP")
            or tags("source.s_F5_BIGIP")
            or program("^(tmm|mcpd|tmsh|apmd|ASM|F5)" type(pcre))
            or message("f5_asm=Splunk-F5-ASM|f5_irule=Splunk-iRule-|access_json" type(pcre))
        )
    };
    parser { app-f5_bigip(); };
};

application app-syslog-f5_bigip_asm[sc4s-syslog-pgm] {
    filter {
        not filter(f_is_source_identified)
        and (
            program("ASM" type(string) flags(prefix))
            or message("^f5_asm=Splunk-F5-ASM" type(pcre))
        )
    };
    parser { app-f5_bigip(); };
    rewrite {
        r_set_splunk_dest_update_v2(
            index("netwaf")
            source("f5:asm")
            sourcetype("f5:bigip:asm:syslog")
            class("asm")
        );
    };
};

application app-syslog-f5_bigip_irule_splunk[sc4s-syslog] {
    filter { message("f5_irule=Splunk-iRule-" type(string)); };
    parser { app-f5_bigip(); };
    parser {
        regexp-parser(
            prefix(".f5.")
            patterns("^[^,]+,f5_irule=(?<irule>Splunk-[^,]+)")
        );
    };
    rewrite {
        r_set_splunk_dest_update_v2(
            source("f5:hsl")
            sourcetype("f5:bigip:irule")
            class("irule")
        );
    };
    rewrite {
        r_set_splunk_dest_update_v2(
            sourcetype("f5:bigip:gtm:dns:request:irule") condition("${.f5.irule}" eq "Splunk-iRule-DNS_REQUEST")
        );
    };
    rewrite {
        r_set_splunk_dest_update_v2(
            sourcetype("f5:bigip:gtm:dns:response:irule") condition("${.f5.irule}" eq "Splunk-iRule-DNS_RESPONSE")
        );
    };
    rewrite {
        r_set_splunk_dest_update_v2(
            sourcetype("f5:bigip:ltm:http:irule") condition("${.f5.irule}" eq "Splunk-iRule-HTTP")
        );
    };
    rewrite {
        r_set_splunk_dest_update_v2(
            sourcetype("f5:bigip:ltm:failed:irule") condition("${.f5.irule}" eq "Splunk-iRule-LB_FAILED")
        );
    };
};

application app-syslog-f5_bigip_irule_json[sc4s-syslog-pgm] {
    filter {
        program("F5" type(string) flags(prefix)) and match("access_json" value("MSGID") type(string))
    };
    parser { app-f5_bigip(); };
    rewrite {
        r_set_splunk_dest_update_v2(
            source("f5:access_json")
            sourcetype("f5:bigip:ltm:access_json")
            class("access_json")
        );
    };
};
