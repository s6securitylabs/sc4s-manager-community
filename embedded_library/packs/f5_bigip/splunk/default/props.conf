[f5:bigip:syslog]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EVAL-vendor = "f5"
EVAL-product = "bigip"
EVAL-vendor_product = "f5:bigip"
FIELDALIAS-f5_src_ip = src_ip AS src
FIELDALIAS-f5_dest_ip = dest_ip AS dest

[f5:bigip:ltm:ssl:error]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EXTRACT-f5_tmm_ssl_message_code = (?<message_code>\d{8}:\d+):\s+Connection\s+error:
EXTRACT-f5_tmm_ssl_severity = \d{8}:(?<severity>\d+):\s+Connection\s+error:
EVAL-vendor = "f5"
EVAL-product = "bigip"
EVAL-vendor_product = "f5:bigip"
EVAL-action = "ssl_error"
EVAL-signature_id = coalesce(signature_id, message_code)
EVAL-signature = coalesce(signature, message_code, "TMM SSL connection error")

[f5:bigip:ltm:tcl:error]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EXTRACT-f5_tmm_tcl_message_code = (?<message_code>\d{8}:\d+):\s+TCL\s+error:
EXTRACT-f5_tmm_tcl_severity = \d{8}:(?<severity>\d+):\s+TCL\s+error:
EVAL-vendor = "f5"
EVAL-product = "bigip"
EVAL-vendor_product = "f5:bigip"
EVAL-action = "tcl_error"
EVAL-signature_id = coalesce(signature_id, message_code)
EVAL-signature = coalesce(signature, message_code, "TMM TCL error")

[f5:bigip:ltm:traffic]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EXTRACT-f5_tmm_traffic_message_code = (?<message_code>\d{8}:\d+):\s+Limiting\s+
EXTRACT-f5_tmm_traffic_severity = \d{8}:(?<severity>\d+):\s+Limiting\s+
EXTRACT-f5_tmm_traffic_limit = (?i)\bLimiting\s+(?<transport>[A-Za-z0-9_-]+)\s+response\s+from\s+(?<src_ip>\d{1,3}(?:\.\d{1,3}){3})\s+to\s+(?<packet_rate>\d+)\s+packets/sec
EVAL-vendor = "f5"
EVAL-product = "bigip"
EVAL-vendor_product = "f5:bigip"
EVAL-transport = upper(transport)
EVAL-action = "traffic_limit"
EVAL-signature_id = coalesce(signature_id, message_code)
EVAL-signature = coalesce(signature, message_code, "TMM traffic limiting")
FIELDALIAS-f5_tmm_traffic_src = src_ip AS src

[f5:bigip:asm:syslog]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EVAL-vendor = "f5"
EVAL-product = "bigip"
EVAL-vendor_product = "f5:bigip"
EVAL-action = coalesce(action, violations, "asm_event")
EVAL-signature = coalesce(signature, violations)
EVAL-signature_id = coalesce(signature_id, support_id)
FIELDALIAS-f5_asm_src = src_ip AS src
FIELDALIAS-f5_asm_dest = dest_ip AS dest

[f5:bigip:irule]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EVAL-vendor = "f5"
EVAL-product = "bigip"
EVAL-vendor_product = "f5:bigip"
EVAL-action = coalesce(action, f5_irule)
FIELDALIAS-f5_irule_src = src_ip AS src
FIELDALIAS-f5_irule_dest = dest_ip AS dest

[f5:bigip:gtm:dns:request:irule]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EVAL-vendor = "f5"
EVAL-product = "bigip"
EVAL-vendor_product = "f5:bigip"
EVAL-action = "dns_request"
EVAL-signature = coalesce(qname, signature)
FIELDALIAS-f5_dns_src = src_ip AS src
FIELDALIAS-f5_dns_dest = dest_ip AS dest

[f5:bigip:gtm:dns:response:irule]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EVAL-vendor = "f5"
EVAL-product = "bigip"
EVAL-vendor_product = "f5:bigip"
EVAL-action = "dns_response"
EVAL-signature = coalesce(qname, signature)
FIELDALIAS-f5_dns_resp_src = src_ip AS src
FIELDALIAS-f5_dns_resp_dest = dest_ip AS dest

[f5:bigip:ltm:http:irule]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EVAL-vendor = "f5"
EVAL-product = "bigip"
EVAL-vendor_product = "f5:bigip"
EVAL-action = coalesce(method, "http_request")
EVAL-signature = coalesce(uri, host, signature)
FIELDALIAS-f5_http_src = src_ip AS src
FIELDALIAS-f5_http_dest = dest_ip AS dest

[f5:bigip:ltm:failed:irule]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = auto
EVAL-vendor = "f5"
EVAL-product = "bigip"
EVAL-vendor_product = "f5:bigip"
EVAL-action = "lb_failed"
EVAL-signature = coalesce(reason, pool, signature)
EVAL-dest_port = coalesce(dest_port, mvindex(split(member, ":"), 1))
EVAL-pool_member_ip = coalesce(pool_member_ip, mvindex(split(member, ":"), 0))
EVAL-pool_member_port = coalesce(pool_member_port, mvindex(split(member, ":"), 1))
FIELDALIAS-f5_lb_failed_src = src_ip AS src
FIELDALIAS-f5_lb_failed_dest = dest_ip AS dest

[f5:bigip:ltm:access_json]
SHOULD_LINEMERGE = false
TRUNCATE = 20000
KV_MODE = json
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = "f5"
EVAL-product = "bigip"
EVAL-vendor_product = "f5:bigip"
EVAL-action = coalesce(event_type, method)
EVAL-signature = coalesce(uri, event_type, signature)
FIELDALIAS-f5_access_src = src_ip AS src
FIELDALIAS-f5_access_dest = dest_ip AS dest
