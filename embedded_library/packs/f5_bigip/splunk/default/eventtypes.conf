[f5_bigip_syslog]
search = sourcetype=f5:bigip:syslog vendor=f5 product=bigip

[f5_bigip_ltm_ssl_error]
search = sourcetype=f5:bigip:ltm:ssl:error vendor=f5 product=bigip

[f5_bigip_ltm_tcl_error]
search = sourcetype=f5:bigip:ltm:tcl:error vendor=f5 product=bigip

[f5_bigip_ltm_traffic]
search = sourcetype=f5:bigip:ltm:traffic vendor=f5 product=bigip

[f5_bigip_ltm_traffic_limited]
search = sourcetype=f5:bigip:ltm:traffic vendor=f5 product=bigip action=traffic_limit packet_rate=* src_ip=* transport=*

[f5_bigip_asm]
search = sourcetype=f5:bigip:asm:syslog vendor=f5 product=bigip

[f5_bigip_asm_attack]
search = sourcetype=f5:bigip:asm:syslog vendor=f5 product=bigip violations=* support_id=*

[f5_bigip_irule]
search = sourcetype IN (f5:bigip:irule,f5:bigip:gtm:dns:request:irule,f5:bigip:gtm:dns:response:irule,f5:bigip:ltm:http:irule,f5:bigip:ltm:failed:irule) vendor=f5 product=bigip

[f5_bigip_irule_dns]
search = sourcetype IN (f5:bigip:gtm:dns:request:irule,f5:bigip:gtm:dns:response:irule) vendor=f5 product=bigip qname=*

[f5_bigip_irule_dns_request]
search = sourcetype=f5:bigip:gtm:dns:request:irule vendor=f5 product=bigip qname=*

[f5_bigip_irule_dns_response]
search = sourcetype=f5:bigip:gtm:dns:response:irule vendor=f5 product=bigip qname=* rcode=*

[f5_bigip_irule_http]
search = sourcetype=f5:bigip:ltm:http:irule vendor=f5 product=bigip method=* uri=*

[f5_bigip_irule_lb_failed]
search = sourcetype=f5:bigip:ltm:failed:irule vendor=f5 product=bigip reason=*

[f5_bigip_access_json]
search = sourcetype=f5:bigip:ltm:access_json vendor=f5 product=bigip event_type=* method=* uri=*
