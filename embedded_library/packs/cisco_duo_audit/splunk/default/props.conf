[cisco:duo:audit:json]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "(?:isotimestamp|ts)"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%:z
MAX_TIMESTAMP_LOOKAHEAD = 40
EVAL-vendor = "cisco"
EVAL-product = "duo_audit"
EVAL-vendor_product = "cisco:duo_audit"
EVAL-phone_id = mvindex('phones{}.phone_id',0)
EVAL-phone_platform = mvindex('phones{}.platform',0)
EVAL-phone_model = mvindex('phones{}.model',0)
EVAL-phone_type = mvindex('phones{}.type',0)
EVAL-phone_last_seen = mvindex('phones{}.last_seen',0)
EVAL-phone_encrypted = mvindex('phones{}.encrypted',0)
EVAL-phone_screenlock = mvindex('phones{}.screenlock',0)
EVAL-phone_tampered = mvindex('phones{}.tampered',0)
EVAL-phone_capabilities = mvjoin('phones{}.capabilities{}', ",")
EVAL-user_status = status
EVAL-integration_name = name
EVAL-integration_type = type
EVAL-groups_allowed = mvjoin('groups_allowed{}', ",")
EVAL-event_type = coalesce(event_type, if(isnotnull(integration_key) AND isnotnull(adminapi_read_log), "integration_inventory", if(isnotnull('phones{}.phone_id') AND isnotnull(user_id), "user_phone_inventory", if(isnotnull(telephony_id), "telephony", if(isnotnull(sekey), "trust_monitor", if(isnotnull('action.name'), "activity", null()))))))
EVAL-action_name = coalesce('action.name', action)
EVAL-outcome_result = coalesce('outcome.result', result)
EVAL-trust_explanation_type = mvindex('explanations{}.type',0)
EVAL-trust_explanation = mvindex('explanations{}.summary',0)
EVAL-priority_reason_type = mvindex('priority_reasons{}.type',0)
EVAL-duo_family = case(event_type="integration_inventory","integration_inventory", event_type="user_phone_inventory","user_phone_inventory", isnotnull(telephony_id),"telephony_sms_or_phone", isnotnull(sekey) AND type="auth","trust_monitor_auth", isnotnull(sekey) AND type="bypass_status","trust_monitor_bypass", isnotnull(sekey) AND type="device_registration","trust_monitor_device_registration", event_type="authentication" AND result="success","auth_success", event_type="authentication" AND result="fraud","auth_fraud", event_type="authentication","auth_denied_or_other", event_type="activity" AND like(action_name,"%policy%"),"activity_policy", event_type="activity" AND action_name="webauthncredential_create","activity_webauthn", event_type="activity","activity_admin", true(),"duo_audit")
EVAL-user = coalesce(email, 'user.name', username, 'actor.name', 'surfaced_auth.email', 'surfaced_auth.user.name', 'enabled_for.name')
EVAL-src_user = coalesce(email, 'user.name', username, 'actor.name', 'surfaced_auth.email', 'surfaced_auth.user.name', 'enabled_for.name')
EVAL-src_ip = coalesce('access_device.ip', 'access_device.ip.address', ip, 'surfaced_auth.access_device.ip')
EVAL-src = src_ip
EVAL-app = coalesce('application.name', 'application.destination_name', 'surfaced_auth.application.name', integration_name)
EVAL-action = coalesce(result, action_name, type, if(event_type="integration_inventory", "inventory", if(event_type="user_phone_inventory", "inventory", event_type)))
EVAL-vendor_raw_action = coalesce(result, action_name, type, if(event_type="integration_inventory", "inventory", if(event_type="user_phone_inventory", "inventory", null())))
EVAL-signature = coalesce(reason, action_name, trust_explanation_type, type, context, integration_type, phone_platform, event_type)
EVAL-signature_id = coalesce(sekey, telephony_id, txid, activity_id, integration_key, user_id, phone_id, marker)
EVAL-status = coalesce(result, outcome_result, state, context, user_access, user_status)
EVAL-factor = coalesce(factor, 'surfaced_auth.factor')
EVAL-reason = coalesce(reason, 'surfaced_auth.reason', trust_explanation_type)
EVAL-object = coalesce(object, 'target.name', 'enabled_for.name', phone_id)
EVAL-object_type = coalesce(object_type, 'target.type', if(isnotnull('enabled_for.name'), "duo_user_or_group", if(isnotnull(phone_id), "duo_phone", null())))
FIELDALIAS-duo_marker = marker AS marker
