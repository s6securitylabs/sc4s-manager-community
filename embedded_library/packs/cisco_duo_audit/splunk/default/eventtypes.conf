[cisco_duo_authentication]
search = sourcetype="cisco:duo:audit:json" event_type="authentication"

[cisco_duo_authentication_success]
search = sourcetype="cisco:duo:audit:json" event_type="authentication" result="success"

[cisco_duo_authentication_denied]
search = sourcetype="cisco:duo:audit:json" event_type="authentication" (result="failure" OR result="denied" OR result="fraud")

[cisco_duo_activity]
search = sourcetype="cisco:duo:audit:json" event_type="activity"

[cisco_duo_policy_activity]
search = sourcetype="cisco:duo:audit:json" event_type="activity" action="*policy*"

[cisco_duo_telephony]
search = sourcetype="cisco:duo:audit:json" event_type="telephony" telephony_id=*

[cisco_duo_trust_monitor]
search = sourcetype="cisco:duo:audit:json" event_type="trust_monitor" sekey=*

[cisco_duo_trust_monitor_auth]
search = sourcetype="cisco:duo:audit:json" event_type="trust_monitor" type="auth" sekey=*

[cisco_duo_trust_monitor_bypass]
search = sourcetype="cisco:duo:audit:json" event_type="trust_monitor" type="bypass_status" sekey=*

[cisco_duo_trust_monitor_device_registration]
search = sourcetype="cisco:duo:audit:json" event_type="trust_monitor" type="device_registration" sekey=*

[cisco_duo_user_phone_inventory]
search = sourcetype="cisco:duo:audit:json" event_type="user_phone_inventory" user_id=* phone_id=*

[cisco_duo_integration_inventory]
search = sourcetype="cisco:duo:audit:json" event_type="integration_inventory" integration_key=* adminapi_read_log=*
