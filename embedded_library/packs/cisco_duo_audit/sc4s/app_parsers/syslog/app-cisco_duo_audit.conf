# Conservative Cisco Duo Admin API JSON relay parser for SecHub Resources.
# Matches one-line Duo authentication/activity/telephony/trust-monitor/user-phone JSON events only; does not collect Duo APIs.

block parser app_cisco_duo_audit() {
    channel {
        if {
            filter {
                (match('"event_type"\s*:\s*"(authentication|activity)"' value('MESSAGE'))
                 and match('"isotimestamp"\s*:' value('MESSAGE')))
                or (match('"telephony_id"\s*:' value('MESSAGE'))
                    and match('"ts"\s*:' value('MESSAGE'))
                    and match('"type"\s*:\s*"(sms|phone)"' value('MESSAGE')))
                or (match('"sekey"\s*:' value('MESSAGE'))
                    and match('"surfaced_timestamp"\s*:' value('MESSAGE'))
                    and match('"type"\s*:\s*"(auth|bypass_status|device_registration)"' value('MESSAGE')))
                or (match('"user_id"\s*:\s*"DU' value('MESSAGE'))
                    and match('"phones"\s*:\s*\[' value('MESSAGE'))
                    and match('"phone_id"\s*:\s*"DP' value('MESSAGE')))
                or (match('"integration_key"\s*:\s*"DI' value('MESSAGE'))
                    and match('"adminapi_read_log"\s*:' value('MESSAGE'))
                    and match('"user_access"\s*:' value('MESSAGE')));
            };
            parser { app-parser-template(vendor('cisco') product('duo_audit')) };
            rewrite { r_set_splunk_dest_default(index('main') sourcetype('cisco:duo:audit:json')) };
            rewrite { set('cisco_duo_audit', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
