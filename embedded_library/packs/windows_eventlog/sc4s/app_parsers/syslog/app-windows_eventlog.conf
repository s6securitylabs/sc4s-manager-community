# Microsoft Windows Event Log relay routing.
# Conservative: only acts on the dedicated source tag / netsource identity, then routes one-line Windows Event XML by explicit EventID markers.
block parser app-windows_eventlog_security() { channel { rewrite { r_set_splunk_dest_default(index('oswinsec') sourcetype('windows:eventlog:security') vendor('microsoft') product('windows_eventlog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('audit')); }; }; };
block parser app-windows_eventlog_process() { channel { rewrite { r_set_splunk_dest_default(index('oswinsec') sourcetype('windows:eventlog:process') vendor('microsoft') product('windows_eventlog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('endpoint')); }; }; };
block parser app-windows_eventlog_powershell() { channel { rewrite { r_set_splunk_dest_default(index('oswinsec') sourcetype('windows:eventlog:powershell') vendor('microsoft') product('windows_eventlog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('audit')); }; }; };
block parser app-windows_eventlog_defender() { channel { rewrite { r_set_splunk_dest_default(index('oswinsec') sourcetype('windows:eventlog:defender') vendor('microsoft') product('windows_eventlog') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('security')); }; }; };
application app-windows_eventlog_security[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_WINDOWS_EVENTLOG") or "${.netsource.sc4s_vendor_product}" eq "windows_eventlog") and (message('<EventID>4624</EventID>') or message('<EventID>1102</EventID>') or message('<EventID>4625</EventID>') or message('<EventID>4663</EventID>') or message('<EventID>4697</EventID>') or message('<EventID>4698</EventID>') or message('<EventID>4719</EventID>') or message('<EventID>4720</EventID>') or message('<EventID>4726</EventID>') or message('<EventID>4732</EventID>') or message('<EventID>4738</EventID>') or message('<EventID>4768</EventID>') or message('<EventID>4769</EventID>') or message('<EventID>4771</EventID>') or message('<EventID>4776</EventID>')) }; parser { app-windows_eventlog_security(); }; };
application app-windows_eventlog_process[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_WINDOWS_EVENTLOG") or "${.netsource.sc4s_vendor_product}" eq "windows_eventlog") and message('<EventID>4688</EventID>') }; parser { app-windows_eventlog_process(); }; };
application app-windows_eventlog_powershell[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_WINDOWS_EVENTLOG") or "${.netsource.sc4s_vendor_product}" eq "windows_eventlog") and (message('<EventID>4104</EventID>') or message('Microsoft-Windows-PowerShell')) }; parser { app-windows_eventlog_powershell(); }; };
application app-windows_eventlog_defender[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_WINDOWS_EVENTLOG") or "${.netsource.sc4s_vendor_product}" eq "windows_eventlog") and (message('<EventID>1116</EventID>') or message('Microsoft-Windows-Windows Defender')) }; parser { app-windows_eventlog_defender(); }; };
