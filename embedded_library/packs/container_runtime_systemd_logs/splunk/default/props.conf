[docker:container:json_file]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 200000
TIME_PREFIX = "time"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9N%Z
MAX_TIMESTAMP_LOOKAHEAD = 40
EXTRACT-container_runtime_marker = SC4S_CONTAINER_RUNTIME_SYSTEMD_TEST_(?<marker_family>[A-Z_]+)_\d{3}
EXTRACT-container_runtime_log_message = "log"\s*:\s*"(?<container_log>[^"\\]*(?:\\.[^"\\]*)*)"
EVAL-vendor = "docker"
EVAL-product = "json_file_container_logs"
EVAL-vendor_product = "docker:json_file_container_logs"
EVAL-stream = stream
EVAL-message = container_log
EVAL-action = stream
EVAL-signature = marker_family
EVAL-signature_id = marker_family

[container:cri:runtime]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%9N%Z
MAX_TIMESTAMP_LOOKAHEAD = 40
EXTRACT-cri_runtime = ^(?<cri_time>\S+)\s+(?<stream>stdout|stderr)\s+(?<cri_flag>[FP])\s+(?<message>.*?SC4S_CONTAINER_RUNTIME_SYSTEMD_TEST_(?<marker_family>[A-Z_]+)_\d{3}.*)$
EVAL-vendor = "kubernetes"
EVAL-product = "cri_container_logs"
EVAL-vendor_product = "kubernetes:cri_container_logs"
EVAL-action = stream
EVAL-signature = cri_flag
EVAL-signature_id = marker_family

[docker:engine:event]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 200000
EXTRACT-container_runtime_marker = SC4S_CONTAINER_RUNTIME_SYSTEMD_TEST_(?<marker_family>[A-Z_]+)_\d{3}
EVAL-vendor = "docker"
EVAL-product = "engine_events"
EVAL-vendor_product = "docker:engine_events"
EVAL-event_type = Type
EVAL-action = Action
EVAL-container_id = 'Actor.ID'
EVAL-signature = Type . ":" . Action
EVAL-signature_id = marker_family

[systemd:journald:service]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 200000
EXTRACT-container_runtime_marker = SC4S_CONTAINER_RUNTIME_SYSTEMD_TEST_(?<marker_family>[A-Z_]+)_\d{3}
EXTRACT-journald_service_unit = \"_SYSTEMD_UNIT\"\s*:\s*\"(?<service_unit>[^\"]+)\"
EXTRACT-journald_hostname = \"_HOSTNAME\"\s*:\s*\"(?<journald_host>[^\"]+)\"
EXTRACT-journald_transport = \"_TRANSPORT\"\s*:\s*\"(?<journald_transport>[^\"]+)\"
EVAL-vendor = "systemd"
EVAL-product = "journald_service_logs"
EVAL-vendor_product = "systemd:journald_service_logs"
EVAL-host = coalesce(journald_host, HOSTNAME, _HOSTNAME)
EVAL-service_unit = coalesce(service_unit, SYSTEMD_UNIT, _SYSTEMD_UNIT)
EVAL-program = SYSLOG_IDENTIFIER
EVAL-severity = PRIORITY
EVAL-message = MESSAGE
EVAL-action = coalesce(journald_transport, TRANSPORT, _TRANSPORT, SYSLOG_IDENTIFIER)
EVAL-signature = service_unit
EVAL-signature_id = marker_family

[docker:journald:container]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 200000
EXTRACT-container_runtime_marker = SC4S_CONTAINER_RUNTIME_SYSTEMD_TEST_(?<marker_family>[A-Z_]+)_\d{3}
EVAL-vendor = "docker"
EVAL-product = "journald_container_logs"
EVAL-vendor_product = "docker:journald_container_logs"
EVAL-host = coalesce(HOSTNAME, _HOSTNAME)
EVAL-container_id = CONTAINER_ID
EVAL-container_name = CONTAINER_NAME
EVAL-image_name = IMAGE_NAME
EVAL-stream = coalesce(TRANSPORT, _TRANSPORT)
EVAL-message = MESSAGE
EVAL-action = stream
EVAL-signature = image_name
EVAL-signature_id = marker_family
