[sc4s_container_runtime_docker_json_file]
search = sourcetype="docker:container:json_file" vendor=docker product=json_file_container_logs

[sc4s_container_runtime_cri_logs]
search = sourcetype="container:cri:runtime" vendor=kubernetes product=cri_container_logs

[sc4s_container_runtime_cri_partial]
search = sourcetype="container:cri:runtime" vendor=kubernetes product=cri_container_logs cri_flag=P

[sc4s_container_runtime_docker_events]
search = sourcetype="docker:engine:event" vendor=docker product=engine_events

[sc4s_container_runtime_journald_services]
search = sourcetype="systemd:journald:service" vendor=systemd product=journald_service_logs

[sc4s_container_runtime_docker_journald_containers]
search = sourcetype="docker:journald:container" vendor=docker product=journald_container_logs

[sc4s_container_runtime_errors]
search = (sourcetype="docker:container:json_file" OR sourcetype="container:cri:runtime") (stream=stderr OR level=error OR message="*error*")
