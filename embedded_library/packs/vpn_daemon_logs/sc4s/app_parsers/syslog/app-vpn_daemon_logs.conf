# VPN daemon log routing.
# Conservative: routes only dedicated source-tag/netsource traffic with explicit OpenVPN or documented strongSwan _updown tokens.
block parser app-vpn_daemon_logs_openvpn_peer() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('vpn:openvpn:peer') vendor('vpn_daemon') product('openvpn') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('network')); }; }; };
block parser app-vpn_daemon_logs_openvpn_verify() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('vpn:openvpn:verify') vendor('vpn_daemon') product('openvpn') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('network')); }; }; };
block parser app-vpn_daemon_logs_openvpn_session() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('vpn:openvpn:session') vendor('vpn_daemon') product('openvpn') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('network')); }; }; };
block parser app-vpn_daemon_logs_openvpn_auth_failed() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('vpn:openvpn:auth') vendor('vpn_daemon') product('openvpn') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('network')); }; }; };
block parser app-vpn_daemon_logs_strongswan_updown() { channel { rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('vpn:strongswan:updown') vendor('vpn_daemon') product('strongswan') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('network')); }; }; };
application app-vpn_daemon_logs_openvpn_peer[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_VPN_DAEMON_LOGS") or "${.netsource.sc4s_vendor_product}" eq "vpn_daemon_logs") and message('openvpn[') and message('Peer Connection Initiated with') }; parser { app-vpn_daemon_logs_openvpn_peer(); }; };
application app-vpn_daemon_logs_openvpn_verify[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_VPN_DAEMON_LOGS") or "${.netsource.sc4s_vendor_product}" eq "vpn_daemon_logs") and message('openvpn[') and message('VERIFY OK: depth=') }; parser { app-vpn_daemon_logs_openvpn_verify(); }; };
application app-vpn_daemon_logs_openvpn_session[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_VPN_DAEMON_LOGS") or "${.netsource.sc4s_vendor_product}" eq "vpn_daemon_logs") and message('openvpn[') and (message('Initialization Sequence Completed') or message('MULTI: primary virtual IP') or message('MULTI_sva: pool returned')) }; parser { app-vpn_daemon_logs_openvpn_session(); }; };
application app-vpn_daemon_logs_openvpn_auth_failed[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_VPN_DAEMON_LOGS") or "${.netsource.sc4s_vendor_product}" eq "vpn_daemon_logs") and message('openvpn[') and message('AUTH_FAILED') }; parser { app-vpn_daemon_logs_openvpn_auth_failed(); }; };
application app-vpn_daemon_logs_strongswan_updown[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_VPN_DAEMON_LOGS") or "${.netsource.sc4s_vendor_product}" eq "vpn_daemon_logs") and message(' vpn: ') and (message(' vpn: + ') or message(' vpn: - ')) }; parser { app-vpn_daemon_logs_strongswan_updown(); }; };
