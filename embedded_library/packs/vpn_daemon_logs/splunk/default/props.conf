[vpn:openvpn:peer]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EVAL-vendor = "vpn_daemon"
EVAL-product = "openvpn"
EVAL-vendor_product = "vpn_daemon:openvpn"
EXTRACT-openvpn_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2})\\s+(?<host>\\S+)\\s+openvpn\\[(?<process_id>\\d+)\\]:\\s+(?:(?<client_context>\\S+)\\s+)?(?<message>.*)\\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-openvpn_peer = Peer Connection Initiated with \\[AF_INET\\](?<src_ip>\\d+\\.\\d+\\.\\d+\\.\\d+):(?<src_port>\\d+)
EVAL-action = "peer_connection_initiated"
EVAL-result = "success"
EVAL-signature = "openvpn_peer_connection_initiated"
EVAL-signature_id = "Peer Connection Initiated"
EVAL-src = src_ip

[vpn:openvpn:verify]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EVAL-vendor = "vpn_daemon"
EVAL-product = "openvpn"
EVAL-vendor_product = "vpn_daemon:openvpn"
EXTRACT-openvpn_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2})\\s+(?<host>\\S+)\\s+openvpn\\[(?<process_id>\\d+)\\]:\\s+(?:(?<client_context>\\S+)\\s+)?(?<message>.*)\\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-openvpn_verify = VERIFY OK: depth=(?<cert_depth>\\d+),\\s+(?<certificate_subject>.+?)\\s+sc4s_marker=
EVAL-action = "certificate_verify_ok"
EVAL-result = "success"
EVAL-signature = "openvpn_certificate_verify_ok"
EVAL-signature_id = "VERIFY OK"

[vpn:openvpn:session]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EVAL-vendor = "vpn_daemon"
EVAL-product = "openvpn"
EVAL-vendor_product = "vpn_daemon:openvpn"
EXTRACT-openvpn_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2})\\s+(?<host>\\S+)\\s+openvpn\\[(?<process_id>\\d+)\\]:\\s+(?:(?<client_context>\\S+)\\s+)?(?<message>.*)\\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-openvpn_virtual_ip = MULTI: primary virtual IP for (?<vpn_peer>[^:]+/[^:]+:\\d+): (?<tunnel_ip>\\d+\\.\\d+\\.\\d+\\.\\d+)
EXTRACT-openvpn_pool_return = MULTI_sva: pool returned IPv4=(?<pool_ipv4>[^,]+), IPv6=(?<pool_ipv6>\\([^)]*\\)|[^\\s]+)
EVAL-action = case(match(message,"Initialization Sequence Completed"),"session_initialized",match(message,"MULTI_sva: pool returned"),"pool_assignment",true(),"virtual_ip_assigned")
EVAL-result = "success"
EVAL-signature = action
EVAL-signature_id = "openvpn_session"
EVAL-user = coalesce(vpn_peer, client_context)
EVAL-src = coalesce(tunnel_ip, pool_ipv4)
EVAL-src_ip = coalesce(tunnel_ip, pool_ipv4)

[vpn:openvpn:auth]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EVAL-vendor = "vpn_daemon"
EVAL-product = "openvpn"
EVAL-vendor_product = "vpn_daemon:openvpn"
EXTRACT-openvpn_common = ^(?<syslog_timestamp>[A-Z][a-z]{2}\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2})\\s+(?<host>\\S+)\\s+openvpn\\[(?<process_id>\\d+)\\]:\\s+(?:(?<client_context>\\S+)\\s+)?(?<message>.*)\\s+sc4s_marker="(?<marker>[^"]+)"
EXTRACT-openvpn_auth_failed = AUTH(?:[^:]*): .*AUTH_FAILED,?(?<reason>.*?)\\s+sc4s_marker=
EVAL-action = "auth_failed"
EVAL-result = "failure"
EVAL-signature = "openvpn_auth_failed"
EVAL-signature_id = "AUTH_FAILED"
EVAL-user = client_context

[vpn:strongswan:updown]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
TIME_PREFIX = ^
TIME_FORMAT = %b %d %H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 15
EVAL-vendor = "vpn_daemon"
EVAL-product = "strongswan"
EVAL-vendor_product = "vpn_daemon:strongswan"
EXTRACT-strongswan_updown = ^(?<syslog_timestamp>[A-Z][a-z]{2}\\s+\\d{1,2}\\s+\\d{2}:\\d{2}:\\d{2})\\s+(?<host>\\S+)\\s+vpn:\\s+(?<vendor_raw_action>[+-])\\s+(?<peer_id>\\S+)\\s+(?<peer_ip>\\d+\\.\\d+\\.\\d+\\.\\d+)\\s+--\\s+(?<local_ip>\\d+\\.\\d+\\.\\d+\\.\\d+)\\s+==\\s+(?<tunnel_network>\\S+)\\s+sc4s_marker="(?<marker>[^"]+)"
EVAL-action = if(vendor_raw_action="+","tunnel_up","tunnel_down")
EVAL-result = if(vendor_raw_action="+","success","ended")
EVAL-signature = "strongswan_updown_tunnel"
EVAL-signature_id = vendor_raw_action
EVAL-user = peer_id
EVAL-src = peer_ip
EVAL-src_ip = peer_ip
EVAL-dest = local_ip
EVAL-dest_ip = local_ip
