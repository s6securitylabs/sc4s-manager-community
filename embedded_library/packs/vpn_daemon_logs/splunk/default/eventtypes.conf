[vpn_daemon_openvpn_peer_connection]
search = sourcetype="vpn:openvpn:peer" vendor="vpn_daemon" product="openvpn" action="peer_connection_initiated"

[vpn_daemon_openvpn_certificate_verify]
search = sourcetype="vpn:openvpn:verify" vendor="vpn_daemon" product="openvpn" action="certificate_verify_ok"

[vpn_daemon_openvpn_session]
search = sourcetype="vpn:openvpn:session" vendor="vpn_daemon" product="openvpn" action="session_initialized" OR action="virtual_ip_assigned"

[vpn_daemon_openvpn_auth_failed]
search = sourcetype="vpn:openvpn:auth" vendor="vpn_daemon" product="openvpn" action="auth_failed"

[vpn_daemon_strongswan_tunnel]
search = sourcetype="vpn:strongswan:updown" vendor="vpn_daemon" product="strongswan" action="tunnel_up" OR action="tunnel_down"
