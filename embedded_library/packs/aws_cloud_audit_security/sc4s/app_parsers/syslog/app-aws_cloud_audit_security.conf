# Conservative AWS Cloud Audit and Security parser for SecHub Resources.
# Dedicated listener/source tag is recommended; patterns are intentionally tied to AWS record keys.
# Route CloudTrail, GuardDuty, and VPC Flow records to the same sourcetypes documented in pack.json/Splunk knowledge.

block parser app_aws_cloud_audit_security() {
    channel {
        if {
            filter {
                match('"eventSource"\s*:\s*"[a-z0-9.-]+\.amazonaws\.com"' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('aws') product('cloudtrail')) };
            rewrite { r_set_splunk_dest_default(index('main') sourcetype('aws:cloud:cloudtrail')) };
            rewrite { set('aws_cloud_audit_security', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
        if {
            filter {
                match('"schemaVersion"\s*:\s*"2\.0".*"serviceName"\s*:\s*"guardduty"' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('aws') product('guardduty')) };
            rewrite { r_set_splunk_dest_default(index('main') sourcetype('aws:cloud:guardduty')) };
            rewrite { set('aws_cloud_audit_security', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
        if {
            filter {
                match('^[0-9]+ [0-9]{12} eni-[A-Za-z0-9]+ [0-9a-fA-F:.]+ [0-9a-fA-F:.]+ [0-9-]+ [0-9-]+ [0-9-]+ [0-9-]+ [0-9-]+ [0-9]+ [0-9]+ (ACCEPT|REJECT|NODATA|SKIPDATA) (OK|NODATA|SKIPDATA)' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('aws') product('vpc_flow_logs')) };
            rewrite { r_set_splunk_dest_default(index('main') sourcetype('aws:cloud:vpcflow')) };
            rewrite { set('aws_cloud_audit_security', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
