[aws:cloud:audit_security]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "(?:eventTime|updatedAt)"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = "aws"
EVAL-product = "cloud_audit_security"
EVAL-vendor_product = "aws:cloud_audit_security"
EVAL-aws_family = case(isnotnull(eventSource), case(eventName IN ("GetCallerIdentity","ListUsers","ListBuckets","GetSendQuota","ListVerifiedEmailAddresses","GetAccountSendingEnabled","GetAccount","ListIdentities"), "cloudtrail_discovery", eventName IN ("CreateRole","AttachRolePolicy"), "cloudtrail_iam_escalation", eventName IN ("CreateSecurityGroup","AuthorizeSecurityGroupIngress","CreateKeyPair","RunInstances","CreateFunction20150331","CreateFunction","CreateLogGroup","CreateLogStream"), "cloudtrail_execution_staging", eventSource="s3.amazonaws.com" AND eventName IN ("GetObject","DeleteObject","PutObject"), "cloudtrail_s3_impact", true(), "cloudtrail_management"), service.serviceName="guardduty" OR schemaVersion="2.0", "guardduty_finding", true(), aws_family)
EVAL-action = coalesce(eventName, action, service.action.actionType)
EVAL-signature = coalesce(type, eventName, eventSource)
EVAL-signature_id = coalesce(id, eventID, eventName)
EVAL-severity = coalesce(severity, level)
FIELDALIAS-aws_account = recipientAccountId AS aws_account_id accountId AS aws_account_id
FIELDALIAS-aws_region = awsRegion AS aws_region region AS aws_region
FIELDALIAS-aws_user = userIdentity.userName AS user userIdentity.arn AS src_user
FIELDALIAS-aws_src = sourceIPAddress AS src_ip
FIELDALIAS-aws_resource = resource.instanceDetails.instanceId AS resource_id
FIELDALIAS-aws_marker = marker AS marker

[aws:cloud:cloudtrail]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "eventTime"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = "aws"
EVAL-product = "cloudtrail"
EVAL-vendor_product = "aws:cloudtrail"
EVAL-aws_family = case(eventName IN ("GetCallerIdentity","ListUsers","ListBuckets","GetSendQuota","ListVerifiedEmailAddresses","GetAccountSendingEnabled","GetAccount","ListIdentities"), "cloudtrail_discovery", eventName IN ("CreateRole","AttachRolePolicy"), "cloudtrail_iam_escalation", eventName IN ("CreateSecurityGroup","AuthorizeSecurityGroupIngress","CreateKeyPair","RunInstances","CreateFunction20150331","CreateFunction","CreateLogGroup","CreateLogStream"), "cloudtrail_execution_staging", eventSource="s3.amazonaws.com" AND eventName IN ("GetObject","DeleteObject","PutObject"), "cloudtrail_s3_impact", eventSource="s3.amazonaws.com", "cloudtrail_data", true(), "cloudtrail_management")
EVAL-action = eventName
EVAL-signature = eventName
EVAL-signature_id = eventName
FIELDALIAS-cloudtrail_account = recipientAccountId AS aws_account_id accountId AS aws_account_id
FIELDALIAS-cloudtrail_region = awsRegion AS aws_region
FIELDALIAS-cloudtrail_user = userIdentity.userName AS user userIdentity.arn AS src_user
FIELDALIAS-cloudtrail_src = sourceIPAddress AS src_ip
FIELDALIAS-cloudtrail_marker = marker AS marker
FIELDALIAS-cloudtrail_user_agent = userAgent AS user_agent
FIELDALIAS-cloudtrail_error = errorCode AS error_code
FIELDALIAS-cloudtrail_bucket = requestParameters.bucketName AS bucket
FIELDALIAS-cloudtrail_object_key = requestParameters.key AS object_key
FIELDALIAS-cloudtrail_role = requestParameters.roleName AS role_name requestParameters.roleArn AS role_arn
FIELDALIAS-cloudtrail_policy = requestParameters.policyArn AS policy_arn
FIELDALIAS-cloudtrail_function = requestParameters.functionName AS function_name
FIELDALIAS-cloudtrail_instance = responseElements.instancesSet.items{}.instanceId AS instance_id

[aws:cloud:guardduty]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "updatedAt"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = "aws"
EVAL-product = "guardduty"
EVAL-vendor_product = "aws:guardduty"
EVAL-aws_family = "guardduty_finding"
EVAL-action = service.action.actionType
EVAL-signature = type
EVAL-signature_id = id
FIELDALIAS-guardduty_account = accountId AS aws_account_id
FIELDALIAS-guardduty_region = region AS aws_region
FIELDALIAS-guardduty_resource = resource.instanceDetails.instanceId AS resource_id
FIELDALIAS-guardduty_src = service.action.networkConnectionAction.remoteIpDetails.ipAddressV4 AS src_ip
FIELDALIAS-guardduty_dest = resource.instanceDetails.networkInterfaces{}.privateIpAddress AS dest_ip
FIELDALIAS-guardduty_port = service.action.networkConnectionAction.localPortDetails.port AS dest_port
FIELDALIAS-guardduty_transport = service.action.networkConnectionAction.protocol AS transport
FIELDALIAS-guardduty_marker = marker AS marker

[aws:cloud:vpcflow]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = none
TIME_PREFIX = ^(?:\S+\s+){10}
TIME_FORMAT = %s
MAX_TIMESTAMP_LOOKAHEAD = 12
EXTRACT-vpcflow_default = ^(?<vpcflow_version>\S+)\s+(?<aws_account_id>\d{12})\s+(?<interface_id>\S+)\s+(?<src_ip>\S+)\s+(?<dest_ip>\S+)\s+(?<src_port>\S+)\s+(?<dest_port>\S+)\s+(?<protocol_number>\S+)\s+(?<packets>\S+)\s+(?<bytes>\S+)\s+(?<start>\S+)\s+(?<end>\S+)\s+(?<action>ACCEPT|REJECT|NODATA|SKIPDATA)\s+(?<log_status>OK|NODATA|SKIPDATA)(?:\s+(?<marker>SC4S_AWS_CLOUD_AUDIT_SECURITY_TEST_[A-Z0-9_]+))?
EVAL-vendor = "aws"
EVAL-product = "vpc_flow_logs"
EVAL-vendor_product = "aws:vpc_flow_logs"
EVAL-aws_family = "vpc_flow_log"
EVAL-transport = case(protocol_number="6", "TCP", protocol_number="17", "UDP", protocol_number="1", "ICMP", true(), protocol_number)
EVAL-signature = "vpc_flow_log"
EVAL-signature_id = interface_id
