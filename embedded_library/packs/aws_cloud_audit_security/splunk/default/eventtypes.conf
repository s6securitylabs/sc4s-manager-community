[aws_cloudtrail_management]
search = sourcetype=aws:cloud:cloudtrail aws_family=cloudtrail_management vendor=aws product=cloudtrail eventName=*

[aws_cloudtrail_data]
search = sourcetype=aws:cloud:cloudtrail aws_family=cloudtrail_data vendor=aws product=cloudtrail eventName=*

[aws_guardduty_findings]
search = sourcetype=aws:cloud:guardduty vendor=aws product=guardduty signature=* severity=*

[aws_vpc_flow_logs]
search = sourcetype=aws:cloud:vpcflow vendor=aws product=vpc_flow_logs src_ip=* dest_ip=* action=*

[aws_cloudtrail_discovery]
search = sourcetype=aws:cloud:cloudtrail aws_family=cloudtrail_discovery vendor=aws product=cloudtrail eventName IN ("GetCallerIdentity","ListUsers","ListBuckets","GetSendQuota","ListVerifiedEmailAddresses","GetAccountSendingEnabled","GetAccount","ListIdentities")

[aws_cloudtrail_iam_escalation]
search = sourcetype=aws:cloud:cloudtrail aws_family=cloudtrail_iam_escalation vendor=aws product=cloudtrail eventName IN ("CreateRole","AttachRolePolicy")

[aws_cloudtrail_execution_staging]
search = sourcetype=aws:cloud:cloudtrail aws_family=cloudtrail_execution_staging vendor=aws product=cloudtrail eventName IN ("CreateSecurityGroup","AuthorizeSecurityGroupIngress","CreateKeyPair","RunInstances","CreateFunction20150331","CreateFunction","CreateLogGroup","CreateLogStream")

[aws_cloudtrail_s3_impact]
search = sourcetype=aws:cloud:cloudtrail aws_family=cloudtrail_s3_impact vendor=aws product=cloudtrail eventName IN ("GetObject","DeleteObject","PutObject")
