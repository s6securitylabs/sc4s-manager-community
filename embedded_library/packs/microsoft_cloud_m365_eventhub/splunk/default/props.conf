TIME_PREFIX = "(?:CreationTime|time|TimeGenerated|TimeCreated|createdDateTime|eventTime|activityDateTime|detectedDateTime)"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 35
EVAL-vendor = "Microsoft"
EVAL-vendor_product = "microsoft:cloud"
FIELDALIAS-ms_creation_time = CreationTime AS creation_time, time AS event_time, TimeGenerated AS time_generated, detectedDateTime AS detected_time, activityDateTime AS activity_time
FIELDALIAS-ms_operation = Operation AS operation, operationName AS operation, activity AS operation
FIELDALIAS-ms_action = Operation AS action, operationName AS action, activity AS action
FIELDALIAS-ms_user = UserId AS user, userPrincipalName AS user, identity AS user, InitiatingProcessAccountUpn AS user, caller AS user
FIELDALIAS-ms_src = ClientIP AS src_ip, ClientIP AS src, ipAddress AS src_ip, ipAddress AS src, callerIpAddress AS src_ip, callerIpAddress AS src
FIELDALIAS-ms_result = ResultStatus AS result, result AS result, resultType AS result_code, resultDescription AS result_description, activityResult AS result, riskState AS result, riskDetail AS result_description
FIELDALIAS-ms_risk = riskLevel AS risk_level, riskState AS risk_state, riskDetail AS risk_detail, riskLevelAggregated AS risk_level
FIELDALIAS-ms_app = Application AS app, AppName AS app, appDisplayName AS app
FIELDALIAS-ms_object = ObjectId AS object, resourceId AS object, SiteUrl AS object, DeviceName AS object, SourceFileName AS object, TargetUserOrGroupName AS object, SensitivityLabelName AS object
FIELDALIAS-ms_source_sourcetype = sourcetype AS ms_source_sourcetype, sourceType AS ms_source_sourcetype
EVAL-operation = coalesce(operation, 'operationName.value', Operation, operationName, activity)
EVAL-action = coalesce(action, operation, 'operationName.value', Operation, operationName, activity)
EVAL-user = coalesce(user, 'actor.userPrincipalName', 'identity.claim.upn', UserId, userPrincipalName, identity, InitiatingProcessAccountUpn, caller)
EVAL-status = coalesce(status, 'status.value', result, ResultStatus, resultType, activityResult, riskState)
EVAL-resource_group = coalesce(resource_group, resourceGroupName)
EVAL-resource_provider = coalesce(resource_provider, 'resourceProviderName.value', resourceProviderName)
EVAL-sensitivity_label = coalesce(sensitivity_label, SensitivityLabelName)
EVAL-product = "intune"
