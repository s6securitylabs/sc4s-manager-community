# Conservative osquery result/status JSON parser for SecHub Resources.
# Match only documented osquery log records carrying the hostIdentifier,
# calendarTime/unixTime, and result/status field shapes. Do not match arbitrary JSON.

block parser app_osquery() {
    channel {
        if {
            filter {
                match('"hostIdentifier"\s*:\s*"' value('MESSAGE'))
                and match('"calendarTime"\s*:\s*"' value('MESSAGE'))
                and match('"unixTime"\s*:' value('MESSAGE'))
                and match('"name"\s*:\s*"' value('MESSAGE'))
                and match('"columns"\s*:' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('osquery') product('osquery')) };
            rewrite { r_set_splunk_dest_default(index('osnix') sourcetype('osquery:results')) };
            rewrite { set('osquery', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
        elif {
            filter {
                match('"hostIdentifier"\s*:\s*"' value('MESSAGE'))
                and match('"calendarTime"\s*:\s*"' value('MESSAGE'))
                and match('"unixTime"\s*:' value('MESSAGE'))
                and match('"severity"\s*:' value('MESSAGE'))
                and match('"message"\s*:\s*"' value('MESSAGE'));
            };
            parser { app-parser-template(vendor('osquery') product('osquery')) };
            rewrite { r_set_splunk_dest_default(index('osnix') sourcetype('osquery:status')) };
            rewrite { set('osquery', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
