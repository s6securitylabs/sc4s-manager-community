[osquery_result_added]
search = sourcetype=osquery:results vendor=osquery product=osquery action=added

[osquery_result_removed]
search = sourcetype=osquery:results vendor=osquery product=osquery action=removed

[osquery_snapshot_results]
search = sourcetype=osquery:results vendor=osquery product=osquery action=snapshot

[osquery_status_logs]
search = sourcetype=osquery:status vendor=osquery product=osquery osquery_log_type=status

[osquery_inventory_results]
search = sourcetype=osquery:results vendor=osquery product=osquery query_name IN (processes,process_snapshot,listening_ports)

[osquery_endpoint_activity]
search = sourcetype=osquery:results vendor=osquery product=osquery query_name IN (process_events,file_events,socket_events)

[osquery_hardware_events]
search = sourcetype=osquery:results vendor=osquery product=osquery query_name=hardware_events

[osquery_user_accounts]
search = sourcetype=osquery:results vendor=osquery product=osquery query_name=users

[osquery_logged_in_users]
search = sourcetype=osquery:results vendor=osquery product=osquery query_name=logged_in_users

[osquery_scheduled_tasks]
search = sourcetype=osquery:results vendor=osquery product=osquery query_name=crontab

[osquery_ssh_authorized_keys]
search = sourcetype=osquery:results vendor=osquery product=osquery query_name=authorized_keys

[osquery_suid_binaries]
search = sourcetype=osquery:results vendor=osquery product=osquery query_name=suid_bin

[osquery_startup_items]
search = sourcetype=osquery:results vendor=osquery product=osquery query_name=startup_items
