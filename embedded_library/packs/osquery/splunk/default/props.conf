[osquery:results]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "calendarTime"\s*:\s*"
TIME_FORMAT = %a %b %e %H:%M:%S %Y %Z
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = "osquery"
EVAL-product = "osquery"
EVAL-vendor_product = "osquery:osquery"
EVAL-osquery_log_type = if(action="snapshot", "snapshot", "result")
EVAL-query_name = name
EVAL-status = action
EVAL-result = action
EVAL-signature = name
EVAL-signature_id = tostring(counter)
EVAL-process_name = coalesce('columns.name', mvindex(split('columns.path', "/"), -1))
EVAL-pid = 'columns.pid'
EVAL-file_path = coalesce('columns.target_path', 'columns.path')
EVAL-cmdline = 'columns.cmdline'
EVAL-uid = 'columns.uid'
EVAL-local_address = 'columns.local_address'
EVAL-remote_address = 'columns.remote_address'
EVAL-local_port = coalesce('columns.local_port', 'columns.port')
EVAL-remote_port = 'columns.remote_port'
EVAL-port = coalesce('columns.port', 'columns.local_port', 'columns.remote_port')
EVAL-protocol = upper(coalesce('columns.protocol', 'columns.type'))
EVAL-hardware_action = 'columns.action'
EVAL-hardware_path = 'columns.path'
EVAL-hardware_type = 'columns.type'
EVAL-hardware_driver = 'columns.driver'
EVAL-hardware_vendor = 'columns.vendor'
EVAL-hardware_vendor_id = 'columns.vendor_id'
EVAL-hardware_model = 'columns.model'
EVAL-hardware_model_id = 'columns.model_id'
EVAL-hardware_serial = 'columns.serial'
EVAL-hardware_revision = 'columns.revision'
EVAL-user_name = coalesce('columns.username', 'columns.user')
EVAL-user_shell = 'columns.shell'
EVAL-user_home = 'columns.directory'
EVAL-session_tty = 'columns.tty'
EVAL-session_host = 'columns.host'
EVAL-session_time = 'columns.time'
EVAL-cron_command = 'columns.command'
EVAL-cron_path = 'columns.path'
EVAL-cron_schedule = trim(coalesce('columns.minute', "*")." ".coalesce('columns.hour', "*")." ".coalesce('columns.day_of_month', "*")." ".coalesce('columns.month', "*")." ".coalesce('columns.day_of_week', "*"))
EVAL-ssh_key_algorithm = 'columns.algorithm'
EVAL-ssh_key_comment = 'columns.comment'
EVAL-ssh_key_file = 'columns.key_file'
EVAL-ssh_key_options = 'columns.options'
EVAL-suid_path = if(name="suid_bin", 'columns.path', null())
EVAL-suid_owner = if(name="suid_bin", 'columns.username', null())
EVAL-suid_group = 'columns.groupname'
EVAL-suid_permissions = 'columns.permissions'
EVAL-startup_name = if(name="startup_items", 'columns.name', null())
EVAL-startup_path = if(name="startup_items", 'columns.path', null())
EVAL-startup_args = 'columns.args'
EVAL-startup_type = 'columns.type'
EVAL-startup_source = 'columns.source'
EVAL-startup_status = 'columns.status'
EVAL-startup_user = if(name="startup_items", 'columns.username', null())
FIELDALIAS-osquery_marker_results = marker AS marker

[osquery:status]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "calendarTime"\s*:\s*"
TIME_FORMAT = %a %b %e %H:%M:%S %Y %Z
MAX_TIMESTAMP_LOOKAHEAD = 32
EVAL-vendor = "osquery"
EVAL-product = "osquery"
EVAL-vendor_product = "osquery:osquery"
EVAL-osquery_log_type = "status"
EVAL-query_name = name
EVAL-action = "status"
EVAL-status = tostring(severity)
EVAL-result = message
EVAL-signature = filename
EVAL-signature_id = tostring(line)
FIELDALIAS-osquery_marker_status = marker AS marker
