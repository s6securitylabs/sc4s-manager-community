[truenas:middleware:auth]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
EXTRACT-marker = marker=(?<marker>SC4S_TRUENAS_TEST_[A-Z0-9_]+_\d{3})
EVAL-vendor = "ixsystems"
EVAL-product = "truenas"
EVAL-vendor_product = "ixsystems:truenas"
EXTRACT-truenas_login = login (?<result>success|failure) user=(?<user>\S+) src=(?<src>\S+) method=(?<method>\S+)
EVAL-action="login"

[truenas:storage:pool]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
EXTRACT-marker = marker=(?<marker>SC4S_TRUENAS_TEST_[A-Z0-9_]+_\d{3})
EVAL-vendor = "ixsystems"
EVAL-product = "truenas"
EVAL-vendor_product = "ixsystems:truenas"
EXTRACT-truenas_storage = pool scrub (?<action>finished|started) pool=(?<pool>\S+) result=(?<result>\S+) errors=(?<errors>\d+)

[truenas:storage:snapshot]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
EXTRACT-marker = marker=(?<marker>SC4S_TRUENAS_TEST_[A-Z0-9_]+_\d{3})
EVAL-vendor = "ixsystems"
EVAL-product = "truenas"
EVAL-vendor_product = "ixsystems:truenas"
EXTRACT-truenas_snapshot = dataset snapshot (?<action>created|deleted) dataset=(?<dataset>\S+) snapshot=(?<snapshot>\S+)
EVAL-result=action

[truenas:hardware:disk]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
EXTRACT-marker = marker=(?<marker>SC4S_TRUENAS_TEST_[A-Z0-9_]+_\d{3})
EVAL-vendor = "ixsystems"
EVAL-product = "truenas"
EVAL-vendor_product = "ixsystems:truenas"
EXTRACT-truenas_disk = disk alert device=(?<device>\S+) serial=(?<serial>\S+) severity=(?<severity>\w+) status="(?<status>[^"]+)"
EVAL-action="disk_alert"
EVAL-result=status

[truenas:replication]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
EXTRACT-marker = marker=(?<marker>SC4S_TRUENAS_TEST_[A-Z0-9_]+_\d{3})
EVAL-vendor = "ixsystems"
EVAL-product = "truenas"
EVAL-vendor_product = "ixsystems:truenas"
EXTRACT-truenas_replication = replication task (?<action>completed|failed) task=(?<task>\S+) result=(?<result>\S+) bytes=(?<bytes>\d+)

[truenas:host:auth]
SHOULD_LINEMERGE = false
KV_MODE = auto
TRUNCATE = 200000
EXTRACT-marker = marker=(?<marker>SC4S_TRUENAS_TEST_[A-Z0-9_]+_\d{3})
EVAL-vendor = "ixsystems"
EVAL-product = "truenas"
EVAL-vendor_product = "ixsystems:truenas"
EXTRACT-truenas_auth_fail = Failed password for (?:invalid user )?(?<user>\S+) from (?<src>\S+)
EVAL-action="ssh_login"
EVAL-result=if(match(_raw,"Failed password"),"failure","success")
