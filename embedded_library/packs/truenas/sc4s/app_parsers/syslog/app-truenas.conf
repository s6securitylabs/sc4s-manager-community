application app-truenas_login[sc4s-syslog] { filter { not filter(f_is_source_identified) and (tags(".source.s_TRUENAS") or "${.netsource.sc4s_vendor_product}" eq "ixsystems") and message('login') }; parser { app-truenas_login(); }; };
