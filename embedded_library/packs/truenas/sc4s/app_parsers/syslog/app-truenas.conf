# TrueNAS storage platform telemetry syslog relay routing. Conservative synthetic-equivalent matching only.
block parser app-truenas_login() { channel { rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('truenas:middleware:auth') vendor('ixsystems') product('truenas') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('infra')); }; }; };
block parser app-truenas_storage() { channel { rewrite { r_set_splunk_dest_default(index('infraops') sourcetype('truenas:storage:pool') vendor('ixsystems') product('truenas') template('t_hdr_msg')); }; rewrite { r_set_splunk_dest_update_v2(class('infra')); }; }; };
