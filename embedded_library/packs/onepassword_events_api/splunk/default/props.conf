[1password:events]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
AUTO_KV_JSON = true
TIME_PREFIX = "timestamp"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 20
EVAL-vendor = "1password"
EVAL-product = "events_api"
EVAL-vendor_product = "1password:events_api"
EVAL-onepassword_event_family = case(isnotnull(category), "sign_in_attempt", isnotnull(used_version), "item_usage", true(), "audit_event")
EVAL-event_id = uuid
EVAL-signature = coalesce(action, type, category)
EVAL-signature_id = uuid
EVAL-user = coalesce('actor_details.email','actor_details.name','user.email','user.name','target_user.email','target_user.name')
EVAL-src_user = coalesce('actor_details.email','actor_details.name','user.email','user.name')
EVAL-target_user = coalesce('target_user.email','target_user.name','aux_details.email','aux_details.name')
EVAL-object = coalesce('object_details.name', object_uuid, item_uuid, vault_uuid)
EVAL-object_type = coalesce(object_type, if(isnotnull(item_uuid), "item", null()))
EVAL-src_ip = 'session.ip'
EVAL-src = src_ip
EVAL-session_id = coalesce(session_uuid, 'session.uuid')
EVAL-client_app = 'client.app_name'
EVAL-client_platform = 'client.platform_name'
EVAL-location_country = 'location.country'
EVAL-location_region = 'location.region'
EVAL-location_city = 'location.city'
EVAL-reason = coalesce('details.value', type, category)
FIELDALIAS-onepassword_marker = marker AS marker
