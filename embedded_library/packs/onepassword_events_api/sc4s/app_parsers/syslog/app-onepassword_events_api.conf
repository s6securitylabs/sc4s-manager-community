# Conservative 1Password Events API JSON relay parser for SecHub Resources.
# Match only collector-relayed 1Password Events API items as one JSON object per line.
# The collector must poll /api/v2/auditevents, /api/v2/itemusages, or /api/v2/signinattempts, unwrap items[], and own bearer token/cursor/checkpoint state.

block parser app_onepassword_events_api() {
    channel {
        if {
            filter {
                match('"timestamp"\s*:' value('MESSAGE'))
                and match('"uuid"\s*:' value('MESSAGE'))
                and (
                    match('"action"\s*:\s*"(join|secure-copy)"' value('MESSAGE'))
                    or match('"category"\s*:\s*"firewall_failed"' value('MESSAGE'))
                );
            };
            parser { app-parser-template(vendor('1password') product('events_api')) };
            rewrite { r_set_splunk_dest_default(index('netauth') sourcetype('1password:events')) };
            rewrite { set('onepassword_events_api', value('fields.sc4s_profile')) };
            rewrite { r_set_source_identified() };
        };
    };
};
