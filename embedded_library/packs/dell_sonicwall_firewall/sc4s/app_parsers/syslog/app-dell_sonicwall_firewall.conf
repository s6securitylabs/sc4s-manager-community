block parser app-dell_sonicwall_firewall() {
    channel {
        # SonicWall firewall syslog is handled as application key=value text.
        # This profile intentionally preserves MESSAGE and only normalizes conservative fields
        # supported by the upstream SC4S SonicWall parser shape.
        parser {
            kv-parser(
                prefix(".values.")
                pair-separator(" ")
                template("${MESSAGE}")
            );
        };

        if ("${.values.time}" ne "") {
            parser {
                regexp-parser(
                    prefix(".tmp.")
                    patterns('^(?<timestamp>[^ ]+ [^ ]+)')
                    template("${.values.time}")
                );
                date-parser-nofilter(
                    format("%Y-%m-%d %H:%M:%S")
                    template("${.tmp.timestamp}")
                );
            };
        };

        rewrite {
            r_set_splunk_dest_default(
                index("netfw")
                sourcetype("dell:sonicwall")
                vendor("dell")
                product("sonicwall-firewall")
                source("dell_sonicwall_firewall")
                template("t_json_values_msg")
            );
            set("${.values.fw}" value("HOST") condition("${.values.fw}" ne ""));
        };
    };
};

application app-netsource-dell_sonicwall_firewall[sc4s-network-source] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_DELL_SONICWALL_FIREWALL")
            or tags("source.s_DELL_SONICWALL_FIREWALL")
            or "${SOURCE}" eq "s_DELL_SONICWALL_FIREWALL"
            or "${.netsource.sc4s_vendor_product}" eq "dell_sonicwall_firewall"
            or (
                match("^(dell|sonicwall)$" value(".netsource.sc4s_vendor") type(pcre) flags(ignore-case))
                and match("^(sonicwall|sonicwall-firewall|firewall)$" value(".netsource.sc4s_product") type(pcre) flags(ignore-case))
            )
        )
    };
    parser { app-dell_sonicwall_firewall(); };
};

application app-syslog-dell_sonicwall_firewall[sc4s-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_DELL_SONICWALL_FIREWALL")
            or tags("source.s_DELL_SONICWALL_FIREWALL")
            or program("^(SonicWall|sonicwall)$" type(pcre))
            or (message("(^| )time=" type(pcre)) and message("(^| )(fw|sn)=" type(pcre)))
        )
    };
    parser { app-dell_sonicwall_firewall(); };
};

application app-raw-dell_sonicwall_firewall[sc4s-raw-syslog] {
    filter {
        not filter(f_is_source_identified)
        and (
            tags(".source.s_DELL_SONICWALL_FIREWALL")
            or tags("source.s_DELL_SONICWALL_FIREWALL")
            or (message("(^| )time=" type(pcre)) and message("(^| )(fw|sn)=" type(pcre)))
        )
    };
    parser { app-dell_sonicwall_firewall(); };
};
