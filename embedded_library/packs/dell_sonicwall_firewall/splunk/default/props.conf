[dell:sonicwall]
SHOULD_LINEMERGE = false
KV_MODE = json
AUTO_KV_JSON = true
TRUNCATE = 20000
category = Network
pulldown_type = true
EVAL-vendor = coalesce(vendor, "Dell")
EVAL-product = coalesce(product, "sonicwall-firewall")
EVAL-vendor_product = coalesce(vendor_product, "dell:sonicwall-firewall")
EVAL-src = coalesce(src, src_ip, src)
EVAL-dest = coalesce(dest, dst, dest_ip)
EVAL-transport = coalesce(transport, proto, protocol)
EVAL-action = coalesce(action, msg)
EVAL-signature = coalesce(signature, msg)
EVAL-signature_id = coalesce(signature_id, id, m)
FIELDALIAS-sonicwall_src_port = sport AS src_port
FIELDALIAS-sonicwall_dest_port = dport AS dest_port
FIELDALIAS-sonicwall_serial = sn AS serial
FIELDALIAS-sonicwall_firewall = fw AS dvc
